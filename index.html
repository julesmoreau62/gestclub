<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototype de Fair Gestion, l’outil de gestion des clubs sportifs amateurs.">
  <link rel="icon" type="image/svg+xml" href="./public/assets/fair-icone.svg">
  <title>Fair Gestion — Tableau de bord</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f5f5;
      --white: #fff;
      --navy: #13294b;
      --mint: #1fb57a;
      --ink: #182943;
      --muted: #4e5e70;
      --rule: #dbe2e8;
      --green: #0f6348;
      --soft-green: #e2f5ec;
      --orange: #963f24;
      --soft-orange: #fbece5;
      --sidebar: 244px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      font-size: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid #147556;
      outline-offset: 3px;
    }
    button:disabled { opacity: .54; cursor: default; }
    h1, h2, h3, p { margin: 0; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    .icon { width: 19px; height: 19px; flex: none; vertical-align: middle; }

    .shell {
      min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }
    .app-workspace { min-width: 0; }
    .spaces-bar {
      position: sticky; top: 0; z-index: 1;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 12px clamp(15px, 4vw, 64px); background: var(--navy); border-bottom: 1px solid #395474;
    }
    .space-pill {
      min-height: 36px; padding: 6px 13px; border: 1px solid #55708c; border-radius: 999px;
      color: #e0ebf5; background: #1f3a5c; font-weight: 650;
    }
    .space-pill:hover { color: #fff; background: #2b496a; }
    .space-pill:focus-visible { outline-color: #8be8bf; }
    .space-pill[aria-current="true"] { color: #fff; background: #254567; box-shadow: inset 0 -3px 0 var(--mint); }
    .sidebar {
      position: sticky; top: 0; height: 100dvh; overflow-y: auto;
      background: var(--navy); color: #fff; color-scheme: dark;
      display: flex; flex-direction: column; padding: 25px 16px 18px;
    }
    .sidebar > * { flex: none; }
    .sidebar :focus-visible { outline-color: #8be8bf; }
    .brand { display: flex; align-items: center; gap: 9px; margin: 0 4px 27px; }
    .brand[data-space] { align-self: flex-start; border: 0; padding: 0; background: transparent; color: inherit; }
    .brand-mark { display: block; flex: none; width: 34px; height: 34px; border: 1px solid #54708e; border-radius: 50%; }
    .brand-name { font-size: 21px; font-weight: 620; letter-spacing: -.04em; white-space: nowrap; }
    .brand-name strong { font-weight: 800; }
    .avatar { flex: none; display: grid; place-items: center; font-weight: 750; }
    .event-actions { padding: 0 16px 14px; }
    .partner-details { overflow-wrap: anywhere; }
    .partner-details .secondary-value { white-space: pre-wrap; }
    .partner-controls { padding: 14px 18px; }
    .partner-proof { white-space: normal; text-align: left; }
    .inventory-details > summary { padding: 14px 18px; color: var(--navy); font-size: 14px; font-weight: 680; cursor: pointer; }
    .inventory-note { white-space: pre-wrap; overflow-wrap: anywhere; }
    .return-details > summary { cursor: pointer; }
    .return-details ul { margin: 5px 0 0; padding-left: 18px; text-align: left; }
    .event-link { width: 100%; }
    .navigation { display: grid; gap: 4px; margin-top: 12px; }
    .nav-button {
      background: transparent; border: 0; display: flex; align-items: center; gap: 10px;
      text-align: left; border-radius: 7px; padding: 10px; font-weight: 610; color: #d6e2ee; white-space: nowrap;
    }
    .nav-button:hover { background: #203c60; color: #fff; }
    .nav-button[aria-current="page"] { background: #254567; color: #fff; font-weight: 750; box-shadow: inset 3px 0 0 var(--mint); }
    .nav-button[aria-current="page"] .icon { color: #8be8bf; }
    .sidebar-footer { margin-top: auto; padding: 15px 2px 1px; border-top: 1px solid #395474; }
    .sidebar-footer .text-button { background: #203c60; border-color: #55708c; color: #fff; }
    .sidebar-footer .text-button:hover { background: #304f71; }
    #online-controls { margin-top: 7px; }
    #local-export { margin-top: 7px; }
    .demo-label { display: inline-flex; gap: 7px; align-items: center; color: #d6e2ee; font-size: 12px; font-weight: 650; }
    .demo-label::before { content: ""; height: 7px; width: 7px; border-radius: 50%; background: #ffc084; }

    .demo-label[data-shared]::before { background: #8be8bf; }
    .demo-controls { display: grid; gap: 6px; }
    .demo-controls select {
      width: 100%; min-height: 36px; padding: 6px 9px; border: 1px solid #55708c; border-radius: 8px;
      color: #fff; background: #1f3a5c; font-weight: 650;
    }

    main { width: 100%; max-width: 1480px; margin-inline: auto; padding: 32px clamp(22px, 4vw, 64px) 44px; }
    .page-header, .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .page-header { flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
    .page-header h1 { color: var(--navy); }
    #app-shell[data-page="home"] {
      grid-template-columns: minmax(0, 1fr);
    }
    #app-shell[data-page="home"] .sidebar { display: none; }
    #app-shell[data-page="home"] .app-workspace > main {
      min-height: 100svh; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding-block: clamp(24px, 5vh, 64px);
    }
    #app-shell[data-page="home"] .page-header { border: 0; padding: 0; justify-content: center; }
    .home-logo { display: none; }
    #app-shell[data-page="home"] .page-header h1 {
      display: flex; align-items: center; gap: 12px; text-transform: uppercase; letter-spacing: -.035em;
    }
    #app-shell[data-page="home"] .home-logo { display: block; width: clamp(36px, 5vw, 48px); height: auto; }
    #app-shell[data-page="home"] #content { width: 100%; max-width: 940px; }
    .space-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .space-card {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px;
      align-items: start; text-align: left; padding: 18px; min-height: 118px;
      flex: 1 1 250px; max-width: 300px;
    }
    .space-card:hover { background: #f5faf8; border-color: #92b7a8; }
    .space-card-name { display: block; color: var(--navy); font-size: 16px; font-weight: 750; }
    .space-card-description { display: block; color: var(--muted); line-height: 1.5; margin-top: 5px; }
    .space-card > .icon { color: var(--green); margin-top: 1px; }
    h1 { font-size: clamp(29px, 3.6vw, 45px); font-weight: 790; letter-spacing: -.06em; line-height: 1.1; }
    h2 { font-size: 18px; font-weight: 750; letter-spacing: -.025em; }
    h3 { font-size: 16px; }
    .season { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    .season label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .season select, .filters select {
      min-height: 39px; border: 1px solid #dbe1d9; border-radius: 8px; color: var(--ink); background: var(--white);
      padding: 7px 9px; font-weight: 650;
    }
    .dashboard-actions {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      padding: 15px 18px; background: var(--soft-green); border: 1px solid #c0ddcf;
      border-inline-start: 4px solid var(--mint); border-radius: 9px;
    }
    .dashboard-actions h2 { font-size: 15px; color: var(--navy); }
    .dashboard-actions .button.outline { background: transparent; border-color: #aacbbc; }
    .dashboard-actions .button.outline:hover { background: #f6fcf9; }
    .follow-up, .list-status, .list-meta { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 14px; }
    .list-meta { align-items: center; color: var(--muted); }
    .list-status [aria-pressed="true"] { color: var(--green); background: var(--soft-green); border-color: #92b5a2; }
    .skip-link { position: fixed; z-index: 3; top: 8px; left: 8px; transform: translateY(-150%); }
    .skip-link:focus { transform: none; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px;
      padding: 8px 13px; border: 1px solid transparent; border-radius: 8px; font-weight: 700; font-size: 13px;
    }
    .button .icon { width: 16px; height: 16px; }
    .button.primary { background: var(--navy); color: #fff; }
    .button.primary:hover { background: #224568; }
    .button.outline { background: #fff; border-color: #dbe1d9; }
    .button.outline:hover { background: var(--paper); }
    .link-button { background: none; border: 0; padding: 5px 0; color: var(--green); font-size: 12px; font-weight: 750; white-space: nowrap; }
    .link-button:hover { text-decoration: underline; }
    .link-button .icon { width: 15px; height: 15px; margin-left: 4px; }
    .overview {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 17px 0 20px;
      border: 1px solid var(--rule); border-radius: 11px; background: var(--white);
    }
    .stat { min-width: 0; padding: 16px 20px; }
    .stat + .stat { border-inline-start: 1px solid var(--rule); }
    .stat:first-child { background: #edf8f2; border-start-start-radius: 10px; border-end-start-radius: 10px; }
    .stat-label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; color: var(--muted); }
    .tile { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--green); background: var(--soft-green); }
    .tile.warm { color: var(--orange); background: var(--soft-orange); }
    .tile .icon { width: 17px; height: 17px; }
    .stat-value { margin: 9px 0 0; font-size: clamp(25px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -.045em; font-weight: 780; font-variant-numeric: tabular-nums; }
    .money-overview .stat-value { font-size: clamp(18px, 2.6vw, 36px); overflow-wrap: anywhere; }
    .stat-value span { font-size: 14px; color: var(--muted); font-weight: 550; letter-spacing: 0; margin-left: 6px; }

    .dashboard-grid { display: grid; grid-template-columns: minmax(225px, .43fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .panel { background: #fff; border: 1px solid var(--rule); border-radius: 12px; min-width: 0; }
    .panel-header { padding: 17px 18px; }
    .table-wrap { overflow-x: auto; }
    table { text-align: left; width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { color: var(--muted); background: #edf2f6; font-size: 11px; font-weight: 700; }
    th, td { padding: 9px 16px; border-top: 1px solid #edf0eb; }
    th:first-child, td:first-child { padding-left: 18px; }
    td:last-child { text-align: right; }
    tbody tr:hover { background: #f6f9fc; }
    .identity { display: flex; gap: 9px; align-items: center; font-weight: 690; }
    .avatar { border-radius: 50%; width: 30px; height: 30px; font-size: 10px; }
    .avatar.sage { background: #e5f0e5; color: #29583e; }
    .avatar.peach { background: #faebe0; color: #743b24; }
    .avatar.blue { background: #e7edf7; color: #3a527c; }
    .avatar.gold { background: #f5eddb; color: #694d19; }
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 8px; font-size: 11px; font-weight: 720; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.paid { color: #28583f; background: #e7f2e9; }
    .badge.unpaid { color: #843923; background: #fcece4; }
    .row-action { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 7px; color: var(--muted); }
    .row-action:hover { background: var(--soft-green); color: var(--green); }
    .row-action .icon { width: 15px; height: 15px; }
    .empty { text-align: left !important; color: var(--muted); padding: 24px 18px; white-space: normal; }
    .payment-panel { padding: 19px 18px; background: var(--navy); color: #fff; border-color: var(--navy); }
    .payment-panel :focus-visible { outline-color: #8be8bf; }
    .payment-progress { margin: 14px 0; display: grid; gap: 8px; }
    .payment-progress .percentage { font-size: 36px; line-height: 1; font-weight: 790; letter-spacing: -.045em; }
    .payment-progress progress { width: 100%; height: 8px; accent-color: var(--mint); }
    .payment-summary { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
    .payment-summary div { display: grid; gap: 5px; }
    .payment-summary dt { color: #c3d4e4; }
    .payment-summary dd { margin: 0; font-size: 19px; font-weight: 750; }
    .payment-panel .link-button { color: #8be8bf; margin-top: 15px; padding-top: 12px; border-top: 1px solid #3e5878; width: 100%; text-align: left; }
    .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 0 18px 14px; }
    .search { display: flex; align-items: center; gap: 6px; min-height: 39px; padding: 0 10px; border: 1px solid #dbe1d9; border-radius: 8px; flex: 1 1 195px; max-width: 320px; }
    .search:focus-within { outline: 2px solid #147556; outline-offset: 2px; }
    .search .icon { color: var(--muted); width: 16px; height: 16px; }
    .search input { padding: 8px 0; background: transparent; border: 0; outline: 0; width: 100%; min-width: 0; }
    .search input:focus-visible { outline: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 225px), 1fr)); gap: 14px; }
    .team { padding: 19px; }
    .team h2 { margin-top: 11px; }
    .team p { color: var(--muted); margin: 7px 0 12px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    dialog { color: var(--ink); background: #fff; width: min(440px, calc(100% - 30px)); border: 1px solid var(--rule); border-radius: 15px; padding: 22px; }
    dialog::backdrop { background: #0d203bd1; }
    dialog form { display: grid; gap: 14px; }
    dialog header, dialog footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    dialog footer { justify-content: flex-end; margin-top: 4px; }
    .field { display: grid; gap: 6px; font-size: 13px; font-weight: 690; }
    .field input, .field select, .field textarea { width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 7px; border: 1px solid #dbe1d9; color: var(--ink); background: #fff; }
    .field textarea { resize: vertical; min-height: 68px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toast { position: fixed; z-index: 2; right: 18px; bottom: 18px; max-width: calc(100% - 36px); padding: 12px 16px; border-radius: 9px; box-shadow: 0 4px 18px #143c2a30; background: var(--navy); color: #fff; font-weight: 650; }
    .quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; margin: 0 0 16px; }
    .quick-card { padding: 17px; display: grid; justify-items: start; align-content: start; gap: 10px; }
    .quick-card p, .panel-note, .meeting-meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .stack { display: grid; gap: 16px; }
    .panel-note { padding: 0 18px 14px; }
    .ledger-table td.numeric, .ledger-table th.numeric { text-align: right; font-variant-numeric: tabular-nums; }
    .ledger-table td:first-child { white-space: normal; }
    .ledger-table td.label-cell { min-width: 155px; white-space: normal; }
    .secondary-value { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .ledger-table tfoot { font-weight: 750; background: #f8f9f6; }
    .positive { color: var(--green); }
    .negative { color: var(--orange); }
    .text-button { background: #fff; border: 1px solid #dbe1d9; border-radius: 7px; padding: 6px 9px; font-weight: 660; font-size: 12px; }
    .text-button:hover { background: var(--soft-green); }
    .meeting-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; padding: 0 18px 18px; }
    .meeting-card { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; padding: 15px; border: 1px solid var(--rule); border-radius: 9px; overflow-wrap: anywhere; }
    .meeting-card p { white-space: pre-wrap; }
    .meeting-card .actions { margin-top: auto; }
    .row-actions { display: inline-flex; align-items: center; gap: 5px; }
    .account-period { color: var(--muted); white-space: nowrap; font-size: 12px; }
    .account-line-end td { border-bottom: 1px solid var(--rule); }
    .finance-state { color: var(--green); margin: 0 0 15px; }
    .file-field small { font-weight: 500; color: var(--muted); }
    .report-details { padding: 0 18px 18px; }
    .report-details summary { cursor: pointer; font-weight: 700; }
    .report-details ul { margin-bottom: 0; padding-left: 19px; line-height: 1.65; }
    .report-title { overflow-wrap: anywhere; }
    .selection-list { display: grid; gap: 7px; max-height: 255px; overflow-y: auto; padding: 5px 2px; }
    .selection-list label { display: flex; align-items: flex-start; gap: 8px; padding: 3px 4px; }
    .selection-list input { accent-color: var(--green); flex: none; }
    .import-preview { max-height: 240px; overflow: auto; }
    .import-preview th { position: sticky; top: 0; }
    @media print {
      body:has(.closing-report) { background: #fff; }
      body:has(.closing-report) .shell { display: block; }
      body:has(.closing-report) .sidebar, body:has(.closing-report) .spaces-bar, body:has(.closing-report) .page-header,
      body:has(.closing-report) .toast, .closing-report button, .closing-report .no-print { display: none !important; }
      body:has(.closing-report) main { padding: 0; }
      .closing-report .table-wrap { overflow: visible; }
      .closing-report .panel { break-inside: avoid; }
    }
    .module-dialog { width: min(522px, calc(100% - 26px)); }
    .module-dialog form { gap: 12px; }
    .empty-note { padding: 16px 18px; color: var(--muted); }
    .page-description { color: var(--muted); margin: -12px 0 17px; line-height: 1.5; }

    @media (max-width: 1050px) {
      :root { --sidebar: 193px; }
      main { padding-inline: 24px; }
      .dashboard-grid { grid-template-columns: minmax(200px, .43fr) minmax(0, 1fr); }
      th, td { padding-inline: 10px; }
    }
    @media (max-width: 940px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .shell { display: flex; flex-direction: column; }
      .app-workspace { display: contents; }
      .spaces-bar { order: -1; }
      .sidebar { position: static; height: auto; border: 0; padding: 13px 15px 8px; }
      .brand { margin: 0; }
      .brand-mark { width: 29px; height: 29px; }
      .sidebar-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 7px; padding: 7px 0 0; }
      #online-controls, #local-export { margin-top: 0; }
      .navigation { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 8px; }
      .navigation[data-workspace="treasurer"], .navigation[data-workspace="secretary"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .nav-button { flex-direction: column; justify-content: flex-start; white-space: normal; padding: 7px 2px; gap: 4px; font-size: 11px; text-align: center; }
      .nav-button[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--mint); }
      .nav-button .icon { width: 15px; height: 15px; }
      main { padding: 21px 15px 26px; }
      .page-header { margin-bottom: 15px; padding-bottom: 12px; }
      .season label { display: none; }
      .overview { margin: 12px 0; }
      .stat { padding: 10px 8px; }
      .stat-label { align-items: flex-start; flex-direction: column; gap: 5px; font-size: 11px; }
      .tile { width: 26px; height: 26px; }
      .stat-value { font-size: 25px; }
      .stat-value span { display: block; font-size: 11px; margin: 4px 0 0; }
      .money-overview .stat-value { font-size: clamp(13px, 4vw, 17px); }
      .dashboard-actions { padding: 11px 12px; }
      .panel-header { flex-wrap: wrap; padding: 14px 11px; }
      .filters, .follow-up, .list-status, .list-meta { padding-inline: 11px; }
      .filters .search { flex-basis: 100%; max-width: none; }
      .dashboard-actions .button, .list-status .button, .follow-up .button { min-height: 44px; }
      th, td { padding-inline: 7px; }
      th:first-child, td:first-child { padding-left: 10px; }
      .identity { gap: 5px; }
      .avatar { width: 24px; height: 24px; font-size: 9px; }
      .quick-grid { grid-template-columns: 1fr; gap: 10px; }
      .page-description { margin-top: -5px; }
      .meeting-grid, .panel-note { padding-inline: 11px; }
    }
  </style>
</head>
<body>
  <a class="skip-link button primary" href="#page-title">Aller au contenu</a>
  <div class="shell" id="app-shell" data-page="home">
    <aside class="sidebar">
      <button type="button" class="brand" data-space="home" aria-label="Accueil Fair Gestion">
        <img class="brand-mark" src="./public/assets/fair-icone.svg" width="33" height="33" alt="">
        <span class="brand-name"><strong>Fair</strong> Gestion</span>
      </button>
      <nav class="navigation" aria-label="Menu principal" id="navigation"></nav>
      <div class="sidebar-footer"><span class="demo-label" id="storage-mode" hidden>Données partagées</span>
        <div class="demo-controls" id="demo-controls" hidden>
          <span class="demo-label">Mode démo</span>
          <label class="visually-hidden" for="demo-role">Rôle en mode démo</label>
          <select id="demo-role">
            <option value="director">Dirigeant</option>
            <option value="secretary">Secrétaire</option>
            <option value="treasurer">Trésorier</option>

        <div class="actions" id="online-controls" hidden>
          <button type="button" class="text-button" id="online-refresh">Actualiser</button>

    <div class="app-workspace">
      <nav class="spaces-bar" id="spaces-bar" aria-label="Espaces de Fair Gestion" hidden></nav>
      <main>
        <header class="page-header">
          <h1 id="page-title" tabindex="-1">
            <img class="home-logo" src="./public/assets/fair-icone.svg" width="48" height="48" alt="">
            <span id="page-title-text">Fair Gestion</span>
          </h1>
          <div class="season" id="season-control">
            <label for="season">Saison</label>
            <select id="season" aria-label="Saison">
              <option value="2026">2026–2027</option>
              <option value="2025">2025–2026</option>

        <div id="content"></div>
      </main>

  </div>

  <dialog id="member-dialog" aria-labelledby="dialog-title">
    <form id="member-form">
      <header>
        <h2 id="dialog-title">Ajouter un adhérent</h2>
        <button class="row-action" type="button" data-close aria-label="Fermer" id="close-dialog"></button>
      </header>
      <div class="form-row">
        <label class="field">Prénom <input name="first" required maxlength="60"></label>
        <label class="field">Nom <input name="last" required maxlength="60"></label>
      </div>
      <label class="field">Équipe <select name="team" id="member-team"></select></label>
      <label class="field">Dossier
        <select name="fileStatus"><option>À vérifier</option><option>Incomplet</option><option>Complet</option></select>
      </label>
      <label class="field">Pièces ou informations manquantes <input name="fileNote" maxlength="180"></label>
      <label class="field">Cotisation
        <select name="paid"><option value="false">En attente</option><option value="true">Réglée</option></select>
      </label>
      <footer>
        <button class="button outline" type="button" data-close>Annuler</button>
        <button class="button primary" type="submit">Enregistrer</button>
      </footer>
    </form>
  </dialog>
  <dialog class="module-dialog" id="module-dialog" aria-labelledby="module-dialog-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    (function () {
  "use strict";

  const icons = {
    dashboard: '<rect x="3" y="3" width="7" height="8" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/>',
    members: '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m2-15a3 3 0 0 1 0 6m4 9v-2a4 4 0 0 0-3-4"/>',
    teams: '<path d="m12 22 2-4h4a3 3 0 0 0 3-3V5l-9-3-9 3v10a3 3 0 0 0 3 3h4l2 4Z"/><path d="m9 10 2 2 4-4"/>',
    payments: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-14 5h4"/>',
    ledger: '<path d="M5 3h12a2 2 0 0 1 2 2v16H6a2 2 0 1 1 0-4h13M5 17V3m4 4h6m-6 4h6"/>',
    budget: '<path d="M4 19h16M6 15v-4m6 4V6m6 9V9"/>',
    meetings: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18m-12 5h6"/>',
    tasks: '<path d="m4 7 2 2 4-4m3 2h7M4 16l2 2 4-4m3 2h7"/>',
    invoices: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7m-7 4h7"/>',
    accounting: '<path d="M12 3v17m-6 0h12M4 7h16M7 7l-3 6h6L7 7Zm10 0-3 6h6l-3-6Z"/>',
    bank: '<path d="M3 9h18l-9-5-9 5Zm2 10h14M7 10v7m5-7v7m5-7v7"/>',
    expenses: '<path d="M6 3v18l3-2 3 2 3-2 3 2V3L15 5l-3-2-3 2-3-2Zm3 6h6m-6 4h6"/>',
    closing: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    arrow: '<path d="M4 12h15m-6-6 6 6-6 6"/>',
    pencil: '<path d="m15 5 4 4M4 20l4.5-1 12-12a2.8 2.8 0 0 0-4-4l-12 12L4 20Z"/>',
    search: '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
    download: '<path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>'
  };

  function icon(name) {
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
  }

  const pages = {
    home: "Accueil", dashboard: "Tableau de bord", members: "Adhérents", teams: "Équipes", payments: "Cotisations",
    ledger: "Journal de trésorerie", budget: "Budget et rapport", meetings: "Réunions et PV", tasks: "Plan d’action",
    invoices: "Factures et échéances", accounting: "Écritures et balance", bank: "Rapprochement bancaire",
    expenses: "Notes de frais", closing: "Clôture et rapport d’AG", renewals: "Renouvellement des adhésions",
    decisions: "Décisions du bureau", volunteers: "Bénévoles", events: "Matchs et événements", registrations: "Inscriptions", partners: "Partenaires", equipment: "Matériel", assembly: "Préparation de l’AG"
  };
  const workspaces = {
    director: ["dashboard", "teams", "members", "decisions", "tasks", "volunteers", "expenses"],
    treasurer: ["dashboard", "ledger", "bank", "invoices", "expenses", "accounting", "budget", "payments", "closing"],
    secretary: ["dashboard", "members", "renewals", "meetings", "tasks"],
    equipment_manager: []
  };
  const menuLabels = { ledger: "Trésorerie", budget: "Budget", invoices: "Factures", accounting: "Comptabilité",
    bank: "Rapprochement", closing: "Clôture", renewals: "Renouvellement", decisions: "Décisions" };
  const pageIcons = { renewals: "members", decisions: "tasks", volunteers: "teams", assembly: "meetings" };
  const teams = ["Seniors", "U17", "U15"];
  const examples = [
    ["Louise", "Martin", "Seniors", true], ["Adam", "Bernard", "U17", false],
    ["Inès", "Petit", "U15", true], ["Hugo", "Robert", "Seniors", true],
    ["Maya", "Laurent", "U17", false], ["Sara", "Diallo", "U15", true],
    ["Nathan", "Thomas", "U17", true], ["Chloé", "Roux", "Seniors", true],
    ["Noé", "Garnier", "U15", false], ["Emma", "Vincent", "U15", true],
    ["Lucas", "Mercier", "U17", true], ["Lina", "Dupont", "Seniors", false],
    ["Amine", "Haddad", "Seniors", true], ["Gabriel", "Morel", "U15", true],
    ["Léna", "Simon", "U17", true], ["Raphaël", "Leroy", "Seniors", true],
    ["Jade", "Muller", "U15", false], ["Hana", "Nguyen", "U17", true],
    ["Arthur", "Girard", "U17", true], ["Zoé", "Robin", "Seniors", false],
    ["Louis", "Fournier", "Seniors", true], ["Nina", "André", "U15", true],
    ["Éliott", "Lopez", "U17", false], ["Fatou", "Ndiaye", "Seniors", true]
  ];

  const elements = Object.fromEntries(
    ["navigation", "page-title", "season", "content", "member-dialog", "member-form",
      "dialog-title", "close-dialog", "member-team", "toast", "module-dialog"]
      .map(id => [id, document.getElementById(id)])
  );
  const nav = elements.navigation;
  const season = elements.season;
  const main = elements.content;
  const dialog = elements["member-dialog"];
  const form = elements["member-form"];
  const moduleDialog = elements["module-dialog"];
  const remote = window.gestclubRemote || null;
  const spacesBar = document.getElementById("spaces-bar");
  const officeRoles = (remote?.roles ?? Object.keys(workspaces)).filter(value => value !== "equipment_manager");
  const bureauRole = officeRoles[0];
  const demoRoleSelect = document.getElementById("demo-role");
  let demoRole = bureauRole;
  let activeRole = remote?.role ?? demoRole;
  const spaceRoles = { events: "director", registrations: "secretary", partners: "director",
    equipment: remote?.roles.includes("equipment_manager") ? "equipment_manager" : "director" };
  function canOpenSpace(key) {
    if (key === "home") return true;
    if (key === "bureau") return officeRoles.length > 0;
    return Boolean(spaceRoles[key] && (!remote || remote.roles.includes(spaceRoles[key])));
  }

  const clubName = remote?.clubName || "AS des Tilleuls";
  let remoteBusy = false;
  if (remote) {
    season.replaceChildren(...Object.keys(remote.state.records).sort().reverse()
      .map(year => new Option(`${year}–${Number(year) + 1}`, year)));
    document.getElementById("storage-mode").hidden = false;
    document.getElementById("storage-mode").dataset.shared = "";
    document.getElementById("online-controls").hidden = false;
    document.getElementById("local-export").hidden = true;
    document.getElementById("logout-token").value = remote.csrf;
  } else {
    document.getElementById("demo-controls").hidden = false;
  }
  const storageKey = "gestclub-demo-v1";
  const records = loadRecords();
  let page = "home";
  let filters = { search: "", team: "", payment: "", fileStatus: "" };
  let editingId = null;
  let selectedAssemblyId = "";
  let toastTimeout;

  function loadRecords() {
    if (remote) return structuredClone(remote.state.records);
    const initial = {
      2026: examples.map(([first, last, team, paid], id) => ({ id: String(id), first, last, team, paid })),
      2025: [
        ...examples.slice(0, 18).map(([first, last, team], id) =>
          ({ id: String(id), first, last, team, paid: id !== 1 && id !== 4 })),
        { id: "prior-1", first: "Mila", last: "Lefèvre", team: "U17", paid: true },
        { id: "prior-2", first: "Léo", last: "Perrin", team: "U15", paid: true },
        { id: "prior-3", first: "Yanis", last: "Dubois", team: "Seniors", paid: true }
      ]
    };
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved?.[2026]) && Array.isArray(saved?.[2025])) return saved;
    } catch {
      // The demonstration still works in browsers that block local storage.
    }
    return initial;
  }

  function notify(message) {
    elements.toast.textContent = message;
    elements.toast.hidden = false;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { elements.toast.hidden = true; }, 4500);
  }

  function getMembers() {
    return records[season.value];
  }

  function hasRecordedDues(member) {
    return clubYear().entries.some(entry => entry.memberId === member.id);
  }

  function hasPaid(member) {
    return member.paid || hasRecordedDues(member);
  }

  function escapeHtml(value) {
    const substitutions = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    return String(value).replace(/[&<>"']/g, character => substitutions[character]);
  }

  function initials(member) {
    return `${[...member.first][0] || ""}${[...member.last][0] || ""}`.toLocaleUpperCase("fr");
  }

  function stat(label, value, symbol, secondary = "", warm = false) {
    return `<article class="stat">
      <p class="stat-label"><span class="tile${warm ? " warm" : ""}">${icon(symbol)}</span>${label}</p>
      <p class="stat-value">${value}${secondary ? `<span>${secondary}</span>` : ""}</p>
    </article>`;
  }

  function rows(members) {
    if (!members.length) return `<tr><td colspan="${page === "members" ? 5 : 4}" class="empty">${getMembers().length ? "Aucun résultat pour ces filtres." : "Aucun adhérent pour cette saison."}</td></tr>`;
    const avatarColors = ["sage", "peach", "blue", "gold"];
    return members.map((member, index) => {
      const name = escapeHtml(`${member.first} ${member.last}`);
      const isPaid = hasPaid(member);
      const paid = isPaid ? "Réglée" : "En attente";
      const collect = page === "payments" && !isPaid && !lockedFinanceYear() ? action("Encaisser", "dues", member.id) : "";
      return `<tr>
        <td><span class="identity"><span class="avatar ${avatarColors[index % avatarColors.length]}" aria-hidden="true">${escapeHtml(initials(member))}</span>${name}</span></td>
        <td>${escapeHtml(member.team)}</td>
        ${page === "members" ? `<td>${badge(fileStatus(member), fileStatus(member) !== "Complet")}
        ${member.fileNote ? `<span class="secondary-value">${escapeHtml(member.fileNote)}</span>` : ""}</td>` : ""}
        <td><span class="badge ${isPaid ? "paid" : "unpaid"}">${paid}</span></td>
        <td><span class="row-actions">${collect}<button type="button" class="row-action" data-edit="${escapeHtml(member.id)}" aria-label="Modifier ${name}" title="Modifier">${icon("pencil")}</button></span></td>
      </tr>`;
    }).join("");
  }

  function table(members) {
    return `<div class="table-wrap" tabindex="0" role="region" aria-label="Liste des adhérents">
      <table>
        <thead><tr><th scope="col">Adhérent</th><th scope="col">Équipe</th>${page === "members" ? '<th scope="col">Dossier</th>' : ""}<th scope="col">Cotisation</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
        <tbody id="member-rows">${rows(members)}</tbody>
      </table>
    </div>`;
  }

  function dashboardActions(buttons) {
    return `<section class="dashboard-actions" aria-label="Actions rapides">
      <h2>Actions rapides</h2><div class="actions">${buttons}</div>
    </section>`;
  }

  function dashboard() {
    const members = getMembers();
    const paid = members.filter(hasPaid).length;
    const unpaid = members.length - paid;
    const percent = members.length ? Math.round((paid / members.length) * 100) : 0;
    return `
      ${dashboardActions(`
        <button type="button" class="button primary" data-add>${icon("plus")} Ajouter un adhérent</button>
        <button type="button" class="button outline" data-nav="tasks">Plan d’action</button>`)}
      <section class="overview" aria-label="Chiffres de la saison">
        ${stat("Adhérents", members.length, "members")}
        ${stat("Équipes", teams.length, "teams", "", true)}
        ${stat("Cotisations réglées", paid, "payments", `sur ${members.length}`)}
      </section>
      <div class="dashboard-grid">
        <section class="panel payment-panel" aria-labelledby="fees-title">
          <h2 id="fees-title">Suivi des cotisations</h2>
          <div class="payment-progress">
            <span class="percentage" aria-hidden="true">${percent}&nbsp;%</span>
            <progress value="${percent}" max="100" aria-label="Cotisations réglées"></progress>
          </div>
          <dl class="payment-summary"><div><dt>Réglées</dt><dd>${paid}</dd></div><div><dt>En attente</dt><dd>${unpaid}</dd></div></dl>
          <button type="button" class="link-button" data-nav="payments" data-role="treasurer" data-payment="${unpaid ? "unpaid" : ""}">${unpaid ? `Voir les ${unpaid} en attente` : "Voir les cotisations"} ${icon("arrow")}</button>
        </section>
        <section class="panel" aria-labelledby="recent-title">
          <header class="panel-header"><h2 id="recent-title">Derniers adhérents</h2>
            <button type="button" class="link-button" data-nav="members">Voir la liste ${icon("arrow")}</button>
          </header>
          ${table(members.slice(0, 5))}
        </section>
      </div>
      <div class="quick-grid" style="margin-top: 16px">
        ${quickCard("Trésorerie du club", budgetSummary().ending + " de solde dans le journal de la saison.", "Ouvrir le budget", "budget", "treasurer")}
        ${quickCard("Vie du club", actionSummary(), "Ouvrir le plan d’action", "tasks")}
      </div>${directorOverview()}`;
  }

  function normalize(value) {
    return value.toLocaleLowerCase("fr").normalize("NFD").replace(/\p{Diacritic}/gu, "");
  }

  function filteredMembers() {
    const query = normalize(filters.search.trim());
    return getMembers().filter(member =>
      (!query || normalize(`${member.first} ${member.last}`).includes(query) ||
        normalize(`${member.last} ${member.first}`).includes(query)) &&
      (!filters.team || member.team === filters.team) &&
      (!filters.payment || hasPaid(member) === (filters.payment === "paid")) &&
      (!filters.fileStatus || (filters.fileStatus === "pending" ?
        fileStatus(member) !== "Complet" : fileStatus(member) === filters.fileStatus))
    );
  }

  function memberResultCount(count) {
    const total = getMembers().length;
    return count === total ? `${total} adhérent${total === 1 ? "" : "s"}` : `${count} résultat${count === 1 ? "" : "s"} sur ${total}`;
  }

  function updateMemberList() {
    const visible = filteredMembers();
    main.querySelector("#member-rows").innerHTML = rows(visible);
    main.querySelector("#member-count").textContent = memberResultCount(visible.length);
    main.querySelector("[data-clear-filters]").hidden = !Object.values(filters).some(Boolean);
    for (const button of main.querySelectorAll("[data-payment-filter]")) {
      button.setAttribute("aria-pressed", String(button.dataset.paymentFilter === (filters.payment || "")));
    }
  }

  function option(value, label, current) {
    return `<option value="${escapeHtml(value)}"${value === current ? " selected" : ""}>${escapeHtml(label)}</option>`;
  }

  function list() {
    const payments = page === "payments";
    const visible = filteredMembers();
    const members = getMembers();
    const paid = payments ? members.filter(hasPaid).length : 0;
    return `<section class="panel" aria-labelledby="list-title">
      <header class="panel-header">
        <h2 id="list-title">${payments ? "Statut des cotisations" : "Liste des adhérents"}</h2>
        <div class="actions">
          <button type="button" class="button outline" data-export>${icon("download")} Export CSV</button>
          ${activeRole === "secretary" && !payments ? action("Importer un CSV", "import-members") : ""}
          ${payments ? "" : `<button type="button" class="button primary" data-add>${icon("plus")} Ajouter un adhérent</button>`}
        </div>
      </header>
      ${payments ? `<div class="list-status" role="group" aria-label="Statut des cotisations">
        ${[["", "Toutes", members.length], ["unpaid", "En attente", members.length - paid], ["paid", "Réglées", paid]]
          .map(([value, label, count]) => `<button type="button" class="button outline" data-payment-filter="${value}"
            aria-pressed="${(filters.payment || "") === value}">${label} ${count}</button>`).join("")}
      </div>` : ""}
      <div class="filters">
        <label class="search">${icon("search")}<span class="visually-hidden">Rechercher un adhérent</span>
          <input type="search" placeholder="Rechercher un adhérent" data-filter="search" value="${escapeHtml(filters.search)}">
        </label>
        <select data-filter="team" aria-label="Filtrer par équipe">
          ${option("", "Toutes les équipes", filters.team)}
          ${teams.map(team => option(team, team, filters.team)).join("")}
        </select>
        ${payments ? "" : `<select data-filter="fileStatus" aria-label="Filtrer par état du dossier">
          ${option("", "Tous les dossiers", filters.fileStatus)}${option("pending", "Dossiers à traiter", filters.fileStatus)}${optionList(memberFileStates, filters.fileStatus)}</select>`}
        ${payments ? "" : `<select data-filter="payment" aria-label="Filtrer par statut de cotisation">
          ${option("", "Toutes les cotisations", filters.payment)}
          ${option("paid", "Réglées", filters.payment)}
          ${option("unpaid", "En attente", filters.payment)}
        </select>`}
      </div>
      <div class="list-meta">
        <p id="member-count" role="status">${memberResultCount(visible.length)}</p>
        <button type="button" class="link-button" data-clear-filters ${Object.values(filters).some(Boolean) ? "" : "hidden"}>Effacer les filtres</button>
      </div>
      ${table(visible)}
    </section>${payments ? helloAssoPanel() : ""}`;
  }

  function helloAssoPanel() {
    const link = clubYear().helloAssoUrl;
    return `<section class="panel" style="margin-top: 16px" aria-labelledby="helloasso-title">
      <header class="panel-header"><h2 id="helloasso-title">Adhésions sur HelloAsso</h2><div class="actions">
        ${link ? `<a class="button primary" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">Payer sur HelloAsso</a>
          ${action("Copier le lien", "helloasso-copy")}` : ""}
        ${action(link ? "Modifier le lien" : "Configurer HelloAsso", "helloasso-config")}
      </div></header>
      <p class="panel-note">${link ? "Partage le lien de la campagne avec les adhérents. Vérifie le paiement dans HelloAsso avant de le saisir dans Fair Gestion." :
        "Ajoute le lien public de la campagne d’adhésion du club pour cette saison."}</p>
    </section>`;
  }

  function editHelloAsso() {
    const fields = inputField("Lien public de la campagne", "url", clubYear().helloAssoUrl,
      'type="url" maxlength="500" placeholder="https://www.helloasso.com/associations/mon-club/adhesions/saison"');
    openModuleDialog("Lien HelloAsso de la saison", fields, (data, editor) => {
      const url = data.url.trim().split(/[?#]/, 1)[0];
      if (url && !/^https:\/\/(?:www\.)?helloasso\.com\/associations\/[a-z0-9_-]+\/adhesions\/[a-z0-9_-]+\/?$/i.test(url)) {
        return invalidInput(editor.elements.url, "Indique le lien public d’une campagne d’adhésion HelloAsso.");
      }
      clubYear().helloAssoUrl = url;
      return url ? "Lien HelloAsso enregistré." : "Lien HelloAsso retiré.";
    });
  }

  async function copyHelloAsso() {
    const url = clubYear().helloAssoUrl;
    if (!url) return;
    try {
      await navigator.clipboard.writeText(url);
      notify("Lien HelloAsso copié.");
    } catch {
      window.prompt("Copie le lien de la campagne", url);
    }
  }

  function teamCards() {
    return `<section class="team-grid" aria-label="Équipes de la saison">${teams.map(team => {
      const count = getMembers().filter(member => member.team === team).length;
      return `<article class="panel team">
        <span class="tile">${icon("teams")}</span><h2>${escapeHtml(team)}</h2>
        <p>${count} ${count === 1 ? "adhérent" : "adhérents"}</p>
        <button type="button" class="link-button" data-nav="members" data-team="${escapeHtml(team)}">Voir les adhérents ${icon("arrow")}</button>
      </article>`;
    }).join("")}</section>`;
  }

  const spaceCards = [
    ["bureau", "dashboard", "Bureau", "Adhésions, réunions et finances selon ton rôle."],
    ["events", "meetings", pages.events, "Planifie les événements et les créneaux des bénévoles."],
    ["registrations", "members", pages.registrations, "Vérifie les dossiers et les pièces déposés par les familles."],
    ["partners", "teams", pages.partners, "Suis les sponsors, les engagements et les renouvellements."],
    ["equipment", "tasks", pages.equipment, "Consulte l’inventaire et enregistre les prêts et les retours."]
  ];

  function downloadCsv(name, lines) {
    const csvCell = value => {
      const text = String(value);
      const formula = /^[=+@\-\t\r\n]/.test(text) && !/^-?\d+(?:[,.]\d+)?$/.test(text);
      const safe = formula ? "'" + text : text;
      return '"' + safe.replaceAll('"', '""') + '"';
    };
    const csv = lines.map(row => row.map(csvCell).join(";")).join("\r\n");
    downloadFile(`${name}-${season.value}.csv`, ["\uFEFF", csv], "text/csv;charset=utf-8");
    notify("Export CSV préparé.");
  }

  function downloadFile(name, content, mime) {
    const url = URL.createObjectURL(new Blob(content, { type: mime }));
    const download = document.createElement("a");
    download.href = url;
    download.download = `fair-gestion-${name}`;
    document.body.append(download);
    download.click();
    download.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function financialTotals(entries, includeTransfers = false) {
    return entries.reduce((totals, entry) => {

    }, { income: 0, expense: 0 });
  }

  }

  function amountCell(cents, signed = false) {
    const label = (signed && cents > 0 ? "+" : "") + money(cents);

    return `<td class="numeric ${color}">${label}</td>`;
  }

  function accountSummary() {
    const rows = Object.entries(accounts).map(([id, label]) => {

      const totals = financialTotals(entries, true);
      const cleared = financialTotals(entries.filter(entry => entry.cleared), true);
      const opening = clubYear().opening[id];
      const clearedCell = id === "bank" ? amountCell(opening + cleared.income - cleared.expense) : '<td class="numeric">—</td>';
      return `<tr><td>${label}</td>${amountCell(opening + totals.income - totals.expense)}${clearedCell}
        ${amountCell(opening)}${amountCell(totals.income)}${amountCell(totals.expense)}</tr>`;
    }).join("");
    const columns = [["Compte"], ["Solde suivi", true], ["Solde pointé", true], ["Ouverture", true], ["Entrées", true], ["Sorties", true]];
    return `<section class="panel"><header class="panel-header"><h2>Banque et caisse</h2>

  function budgetRows(kind) {
    const year = clubYear();
    return categories[kind].map(category => ({
      category,
      planned: year.plan[kind][category] ?? 0,
      actual: year.entries.filter(entry => !entry.transferId && entry.kind === kind && entry.category === category)
        .reduce((sum, entry) => sum + entry.amount, 0)
    }));
  }

  function budget() {
    const blocks = Object.keys(categories).map(kind => {
      const lines = budgetRows(kind);
      const total = lines.reduce(({ planned, actual }, line) =>
        ({ planned: planned + line.planned, actual: actual + line.actual }), { planned: 0, actual: 0 });
      const lineHtml = ({ category, planned, actual }) =>
        `<tr><td>${escapeHtml(category)}</td>${amountCell(planned)}${amountCell(actual)}${amountCell(actual - planned)}</tr>`;
      const title = kind === "income" ? "Recettes" : "Dépenses";
      const columns = [["Catégorie"], ["Prévu", true], ["Réalisé", true], ["Écart", true]];
      return `<section class="panel"><header class="panel-header"><h2>${title}</h2>
        ${action("Modifier le prévisionnel", "plan", kind)}</header>
        ${dataTable(columns, lines.map(lineHtml).join(""), title, `<tfoot>${lineHtml({ category: "Total", ...total })}</tfoot>`)}
        </section>`;
    });

  function openModuleDialog(title, fields, save, saveChanges = saveBureau) {
    const trigger = document.activeElement;
    moduleDialog.innerHTML = `<form><header><h2 id="module-dialog-title">${title}</h2>
      <button type="button" class="row-action" data-module-action="close" aria-label="Fermer">${icon("close")}</button>
      </header>${fields}<footer><button type="button" class="button outline" data-module-action="close">Annuler</button>
      <button type="submit" class="button primary">Enregistrer</button></footer></form>`;
    const editor = moduleDialog.querySelector("form");
    editor.addEventListener("submit", async event => {
      event.preventDefault();
      if (editor.dataset.saving) return;
      for (const input of editor.querySelectorAll("input[required], textarea[required]")) {
        if (input.value.trim()) continue;
        input.setCustomValidity("Renseigne ce champ.");
        input.reportValidity();
        return;
      }
      const data = Object.fromEntries(new FormData(editor).entries());
      let message;
      try {
        editor.dataset.saving = "true";
        for (const button of editor.querySelectorAll("button")) button.disabled = true;
        message = await save(data, editor);
      } catch (error) {
        notify(error instanceof Error ? error.message : "Enregistrement impossible.");
        return;
      } finally {
        delete editor.dataset.saving;
        for (const button of editor.querySelectorAll("button")) button.disabled = false;
      }
      if (!message) return;
      moduleDialog.close();
      saveChanges(message);
      render();
      restoreActionFocus(trigger);
    });
    editor.addEventListener("input", event => event.target.setCustomValidity?.(""));
    moduleDialog.showModal();
    editor.querySelector("input, select, textarea")?.focus();
    return editor;
  }

  moduleDialog.addEventListener("cancel", event => {
    if (moduleDialog.querySelector("form")?.dataset.saving) event.preventDefault();
  });

  function restoreActionFocus(trigger) {
    if (!trigger?.dataset.moduleAction) return;
    const similar = Array.from(main.querySelectorAll("[data-module-action]")).filter(button =>
      button.dataset.moduleAction === trigger.dataset.moduleAction);
    const target = similar.find(button => button.dataset.value === trigger.dataset.value) || similar[0] ||
      main.querySelector(".dashboard-actions button, .panel-header button");
    target?.focus();
  }

  function inputField(label, name, value = "", attributes = "") {
    return `<label class="field">${label}<input name="${name}" value="${escapeHtml(value)}" ${attributes}></label>`;
  }

  function selectField(label, name, options) {
    return `<label class="field">${label}<select name="${name}">${options}</select></label>`;
  }

  function textarea(label, name, value) {
    return `<label class="field">${label}<textarea name="${name}" maxlength="5000">${escapeHtml(value || "")}</textarea></label>`;
  }

  function optionList(values, selected) {
    return values.map(value => option(value, value, selected)).join("");
  }

  function seasonDates() {
    return { start: `${season.value}-09-01`, end: `${Number(season.value) + 1}-08-31` };
  }

  function dateField(label, value, required = true) {
    const { start, end } = seasonDates();
    return inputField(label, "date", value, `type="date" min="${start}" max="${end}" ${required ? "required" : ""}`);
  }

  function todayIso() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  }

  function defaultDate() {
    const value = todayIso();
    const { start, end } = seasonDates();
    return value >= start && value <= end ? value : start;
  }

  function amountField(label, name, cents, minimum = 0, required = true) {
    return inputField(label, name, cents === undefined ? "" : (cents / 100).toFixed(2),
      `type="number" inputmode="decimal" step="0.01" min="${minimum}" max="999999999" ${required ? "required" : ""}`);
  }

  function cents(value) {
    return Math.round(Number(value) * 100);
  }

  function saveItem(items, item) {
    const index = items.findIndex(existing => existing.id === item.id);
    if (index < 0) items.push(item);
    else items[index] = item;
  }

  function editEntry(entry, member) {
    const memberId = member?.id ?? entry?.memberId;
    const linked = memberId !== undefined;
    const kind = entry?.kind ?? "income";
    const label = entry?.label ?? (member ? `Cotisation · ${member.first} ${member.last}` : "");
    const fields = `<div class="form-row">${dateField("Date de l’opération", entry?.date || defaultDate())}
      ${selectField("Mouvement", "kind", choices(linked ? { income: directions.income } : directions, kind))}</div>
      ${inputField("Libellé", "label", label, "maxlength=145 required")}
      <div class="form-row">${selectField("Compte", "account", choices(accounts, entry?.account))}
      ${amountField("Montant (€)", "amount", entry?.amount, 0.01)}</div>
      ${selectField("Catégorie", "category", optionList(linked ? ["Cotisations"] : categories[kind], entry?.category))}
      ${inputField("Référence du justificatif", "reference", entry?.reference, 'maxlength="100" placeholder="Ex. FAC-2026-17"')}
      ${analysisFields(entry?.analysis)}`;
    const title = entry ? "Modifier l’opération" : linked ? "Encaisser la cotisation" : "Nouvelle opération";
    const editor = openModuleDialog(title, fields, data => {
      const amount = cents(data.amount);
      const sameBankMovement = entry?.account === "bank" && data.account === "bank" &&
        entry.date === data.date && entry.amount === amount && entry.kind === data.kind;
      saveItem(clubYear().entries, {
        id: entry?.id ?? newId(), date: data.date, label: data.label.trim(), kind: data.kind,
        account: data.account, category: data.category, amount, reference: data.reference.trim(),
        cleared: Boolean(sameBankMovement && entry.cleared), memberId, receipt: entry?.receipt, analysis: readAnalysis(data)
      });
      if (!entry && !linked) {
        ledgerFilters.kind = "";
        ledgerFilters.account = "";
        page = "ledger";
      }
      return entry ? "Opération modifiée." : linked ? "Cotisation encaissée et enregistrée dans le journal." : "Opération enregistrée.";
    });
    editor.elements.kind.addEventListener("change", () => {
      editor.elements.category.innerHTML = optionList(categories[editor.elements.kind.value]);
    });
  }

  function editOpening() {
    const opening = clubYear().opening;
    const fields = `<p class="meeting-meta">Montants disponibles au premier jour de la saison.</p>
      ${amountField("Solde bancaire (€)", "bank", opening.bank, -999999999)}

  function editTransfer(transferId) {
    const year = clubYear();
    const outgoing = year.entries.find(entry => entry.transferId === transferId && entry.kind === "expense");
    const source = outgoing?.account ?? "cash";
    const flows = { cash: "Caisse vers banque", bank: "Banque vers caisse" };
    const fields = `${dateField("Date du virement", outgoing?.date || defaultDate())}
      ${selectField("Sens du virement", "source", choices(flows, source))}
      ${amountField("Montant (€)", "amount", outgoing?.amount, 0.01)}
      ${inputField("Référence du justificatif", "reference", outgoing?.reference, "maxlength=100")}
      <p class="meeting-meta">Le virement change les soldes des deux comptes. Il n’entre pas dans le réalisé du budget.</p>`;
    openModuleDialog(transferId ? "Modifier le virement interne" : "Virement interne", fields, data => {
      const id = transferId || newId();
      const bankEntry = year.entries.find(entry => entry.transferId === id && entry.account === "bank");
      const amount = cents(data.amount);
      const label = flows[data.source];
      const base = { transferId: id, date: data.date, label, amount, category: "Virement interne", reference: data.reference.trim() };
      const destination = data.source === "cash" ? "bank" : "cash";
      const bankKind = destination === "bank" ? "income" : "expense";
      const bankCleared = Boolean(bankEntry?.cleared && bankEntry.date === data.date && bankEntry.amount === amount && bankEntry.kind === bankKind);
      saveItem(year.entries, { ...base, id: id + "-out", kind: "expense", account: data.source, cleared: data.source === "bank" && bankCleared });
      saveItem(year.entries, { ...base, id: id + "-in", kind: "income", account: destination, cleared: destination === "bank" && bankCleared });
      if (!transferId) {
        ledgerFilters.kind = "transfer";
        ledgerFilters.account = "";
      }
      return "Virement interne enregistré.";
    });
  }

  function exportMeeting(meeting, minutes) {
    const heading = minutes ? (meeting.status === "PV approuvé" ? "Procès-verbal approuvé" : "Projet de procès-verbal") : "Projet de convocation";
    const lines = [heading, clubName, meeting.type, meeting.title,

      "", "Ordre du jour", meeting.agenda || "À préciser"];
    if (minutes) lines.push("", "Présents et représentés", meeting.attendance || "À préciser", "", "Décisions", meeting.minutes);

    downloadFile(`${minutes ? "pv" : "convocation"}-${meeting.date}.txt`, [lines.join("\n")], "text/plain;charset=utf-8");

  function handleModuleAction(button) {
    const value = button.dataset.value;
    const year = clubYear();
    const command = button.dataset.moduleAction;
    if (financeWrites.has(command) && lockedFinanceYear()) {
      notify(financeLockMessage());
      return;
    }
    if (["entry", "invoice-payment-edit", "clear", "transfer"].includes(command) &&
      year.entries.some(entry => entry.bankLineId && (entry.id === value || entry.transferId === value))) {
      notify("Annule le rapprochement bancaire pour modifier cette opération.");
      return;
    }
    switch (command) {
      case "helloasso-config": editHelloAsso(); break;
      case "helloasso-copy": copyHelloAsso(); break;
      case "renew-members": renewMembersDialog(); break;
      case "import-members": importMembersDialog(); break;
      case "decision": editDecision(year.decisions?.find(item => item.id === value)); break;
      case "decision-task": {
        const decision = year.decisions?.find(item => item.id === value);
        if (decision) editTask(year.tasks.find(task => task.id === decision.taskId), decision);
        break;
      }
      case "registration-settings": editRegistrationSettings(); break;
      case "registration-link": showRegistrationLink(); break;
      case "registration-tracking": {
        const url = new URL("inscriptions.php", window.location.href);
        url.searchParams.set("dossier", value);
        showShareLink(url, "Lien privé de suivi");
        break;
      }
      case "registration-review": reviewRegistration(year.applications.find(item => item.id === value)); break;
      case "equipment-item": editEquipmentItem(equipmentStore().items.find(item => item.id === value)); break;
      case "equipment-loan": lendEquipment(equipmentStore().items.find(item => item.id === value)); break;
      case "equipment-return": returnEquipment(equipmentStore().loans.find(loan => loan.id === value)); break;
      case "equipment-loan-edit": editEquipmentLoan(equipmentStore().loans.find(loan => loan.id === value)); break;
      case "partner": editPartner(year.partners?.find(item => item.id === value)); break;
      case "partner-carry": carryPartners(); break;
      case "partner-commitment": {
        const [partnerId, commitmentId] = value.split(":");
        const partner = year.partners.find(item => item.id === partnerId);
        editPartnerCommitment(partner, year.partnerCommitments?.find(item => item.id === commitmentId));
        break;
      }
      case "partner-photo": downloadAttachment(year.partnerCommitments?.find(item => item.id === value)?.receipt); break;
      case "event": editClubEvent(year.events?.find(item => item.id === value)); break;
      case "event-slot": {
        const [eventId, slotId] = value.split(":");
        const item = year.events.find(item => item.id === eventId);
        editEventSlot(item, item.slots.find(slot => slot.id === slotId));
        break;
      }
      case "event-share": changeEventShare(year.events.find(item => item.id === value)); break;
      case "event-link": showEventLink(year.events.find(item => item.id === value)); break;
      case "volunteer": editVolunteer(year.volunteers?.find(item => item.id === value)); break;
      case "assembly": openAssembly(value); break;
      case "assembly-list": editAssemblyList(); break;
      case "assembly-attendee": editAssemblyAttendee(value); break;
      case "assembly-vote": editAssemblyVote(value); break;
      case "assembly-vote-decision": recordVoteDecision(value); break;
      case "assembly-report": attachAssemblyReport(); break;
      case "assembly-export": exportAssemblyList(); break;
      case "bank-import": importBankDialog(); break;
      case "bank-match": matchBankDialog(value); break;
      case "bank-unmatch": unmatchBank(value); break;
      case "expense": expenseDialog(value); break;
      case "expense-review": reviewExpense(value); break;
      case "receipt": attachReceipt(value); break;
      case "receipt-download": downloadReceipt(value); break;
      case "close-finance": closeFinance(); break;
      case "print-report": window.print(); break;
      case "entry": editEntry(year.entries.find(entry => entry.id === value)); break;
      case "invoice": editInvoice(value); break;
      case "invoice-payment": editInvoicePayment(findInvoice(value)); break;
      case "invoice-payment-edit": {
        const entry = year.entries.find(item => item.id === value);
        const invoice = findInvoice(entry.invoiceId);
        if (invoice) editInvoicePayment(invoice, entry);
        break;
      }
      case "export-invoices": exportInvoices(); break;
      case "export-accounting": exportAccounting(); break;
      case "export-trial-balance": exportTrialBalance(); break;
      case "dues": {
        const member = getMembers().find(item => item.id === value);
        if (member && !hasPaid(member)) editEntry(undefined, member);
        break;
      }
      case "transfer": editTransfer(value); break;
      case "opening": editOpening(); break;
      case "plan": editPlan(value); break;
      case "meeting": editMeeting(year.meetings.find(meeting => meeting.id === value)); break;
      case "task": editTask(year.tasks.find(task => task.id === value)); break;
      case "export-ledger": exportLedger(); break;
      case "export-budget": exportBudget(); break;
      case "close": moduleDialog.close(); break;
      case "clear": {
        const entry = year.entries.find(item => item.id === value);
        entry.cleared = !entry.cleared;
        saveBureau(entry.cleared ? "Opération pointée." : "Pointage retiré.");
        render();
        restoreActionFocus(button);
        break;
      }
      case "finish": {
        year.tasks.find(item => item.id === value).status = "Terminée";
        saveBureau("Action terminée.");
        render();
        restoreActionFocus(button);
        break;
      }
      case "invitation":
      case "minutes":
        exportMeeting(year.meetings.find(item => item.id === value), button.dataset.moduleAction === "minutes");
        break;
    }
  }
