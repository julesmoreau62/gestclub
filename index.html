<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Prototype de Gest’club, l’outil de gestion des clubs sportifs amateurs.">
  <title>Gest’club — Tableau de bord</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f2;
      --white: #fff;
      --ink: #162820;
      --muted: #536359;
      --rule: #e4e8e1;
      --green: #154433;
      --soft-green: #e7f1e9;
      --orange: #a73c25;
      --soft-orange: #fbece5;
      --sidebar: 238px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      font-size: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid #a54b33;
      outline-offset: 3px;
    }
    button:disabled { opacity: .54; cursor: default; }
    h1, h2, h3, p { margin: 0; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    .icon { width: 19px; height: 19px; flex: none; vertical-align: middle; }

    .shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100dvh; background: #fdfdfa;
      border-right: 1px solid var(--rule); display: flex; flex-direction: column; padding: 26px 15px 18px;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 10px 33px; font-size: 23px; font-weight: 780; letter-spacing: -.075em; }
    .brand-mark {
      width: 33px; height: 33px; border-radius: 9px; background: var(--green);
      display: grid; place-items: center; color: #fff; transform: rotate(-7deg);
    }
    .brand-mark .icon { width: 24px; height: 24px; transform: rotate(7deg); }
    .club { display: flex; align-items: center; gap: 10px; padding: 11px 10px; border: 1px solid var(--rule); border-radius: 11px; }
    .club-mark, .avatar { flex: none; display: grid; place-items: center; font-weight: 750; }
    .club-mark { width: 35px; height: 35px; border-radius: 8px; background: var(--soft-orange); color: var(--orange); font-size: 12px; }
    .club strong { display: block; font-size: 13px; }
    .club small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .workspace { display: grid; gap: 6px; margin-top: 24px; }
    .workspace label { padding-left: 6px; color: var(--muted); font-size: 11px; font-weight: 720; }
    .workspace select { width: 100%; min-height: 39px; padding: 6px 9px; border: 1px solid #dbe1d9; border-radius: 8px; background: #fff; color: var(--ink); font-weight: 720; }
    .navigation { display: grid; gap: 4px; margin-top: 12px; }
    .nav-button {
      background: transparent; border: 0; display: flex; align-items: center; gap: 11px;
      text-align: left; border-radius: 8px; padding: 11px 10px; font-weight: 610; color: var(--muted); white-space: nowrap;
    }
    .nav-button:hover { background: #f0f3ed; color: var(--ink); }
    .nav-button[aria-current="page"] { background: var(--soft-green); color: var(--green); font-weight: 750; }
    .sidebar-footer { margin-top: auto; padding: 15px 7px 1px; border-top: 1px solid var(--rule); }
    #online-controls { margin-top: 7px; }
    #local-export { margin-top: 7px; }
    .demo-label { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 650; }
    .demo-label::before { content: ""; height: 7px; width: 7px; border-radius: 50%; background: #b9573d; }

    main { width: 100%; max-width: 1480px; margin-inline: auto; padding: 32px clamp(22px, 4vw, 64px) 44px; }
    .page-header, .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .page-header { margin-bottom: 24px; }
    h1 { font-size: clamp(24px, 2.6vw, 30px); font-weight: 760; letter-spacing: -.035em; line-height: 1.15; }
    h2 { font-size: 18px; font-weight: 750; letter-spacing: -.025em; }
    h3 { font-size: 16px; }
    .season { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    .season label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .season select, .filters select {
      min-height: 39px; border: 1px solid #dbe1d9; border-radius: 8px; color: var(--ink); background: var(--white);
      padding: 7px 9px; font-weight: 650;
    }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px;
      padding: 8px 13px; border: 1px solid transparent; border-radius: 8px; font-weight: 700; font-size: 13px;
    }
    .button .icon { width: 16px; height: 16px; }
    .button.primary { background: var(--green); color: #fff; }
    .button.primary:hover { background: #0d3225; }
    .button.light { background: #f8e7d7; color: #342319; }
    .button.light:hover { background: #ffefdf; }
    .button.outline { background: #fff; border-color: #dbe1d9; }
    .button.outline:hover { background: var(--paper); }
    .link-button { background: none; border: 0; padding: 5px 0; color: var(--green); font-size: 12px; font-weight: 750; white-space: nowrap; }
    .link-button:hover { text-decoration: underline; }
    .link-button .icon { width: 15px; height: 15px; margin-left: 4px; }
    .overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 17px 0 20px; }
    .stat { position: relative; display: block; width: 100%; text-align: left; padding: 15px 17px; border: 1px solid var(--rule); border-radius: 12px; background: #fff; }
    .stat-link:hover { border-color: #b9c9bc; background: #fcfdfb; }
    .stat-link > .icon { position: absolute; top: 17px; right: 15px; width: 16px; height: 16px; color: var(--muted); }
    .stat-value { display: block; }
    .meter { display: block; height: 6px; margin-top: 11px; border-radius: 6px; background: #e9ede7; overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: 6px; background: #347456; }
    .stat-label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; color: var(--muted); }
    .tile { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--green); background: var(--soft-green); }
    .tile.warm { color: var(--orange); background: var(--soft-orange); }
    .tile .icon { width: 17px; height: 17px; }
    .stat-value { margin: 9px 0 0; font-size: 31px; line-height: 1.1; letter-spacing: -.045em; font-weight: 780; font-variant-numeric: tabular-nums; }
    .stat-value span { font-size: 14px; color: var(--muted); font-weight: 550; letter-spacing: 0; margin-left: 6px; }

    .panel { background: #fff; border: 1px solid var(--rule); border-radius: 12px; min-width: 0; }
    .panel-header { padding: 17px 18px; }
    .table-wrap { overflow-x: auto; }
    table { text-align: left; width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { color: var(--muted); background: #f8f9f6; font-size: 11px; font-weight: 700; }
    th, td { padding: 9px 16px; border-top: 1px solid #edf0eb; }
    th:first-child, td:first-child { padding-left: 18px; }
    td:last-child { text-align: right; }
    .identity { display: flex; gap: 9px; align-items: center; font-weight: 690; }
    .avatar { border-radius: 50%; width: 30px; height: 30px; font-size: 10px; }
    .avatar.sage { background: #e5f0e5; color: #29583e; }
    .avatar.peach { background: #faebe0; color: #743b24; }
    .avatar.blue { background: #e7edf7; color: #3a527c; }
    .avatar.gold { background: #f5eddb; color: #694d19; }
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 4px 8px; font-size: 11px; font-weight: 720; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.paid { color: #28583f; background: #e7f2e9; }
    .badge.unpaid { color: #843923; background: #fcece4; }
    .row-action { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 7px; color: var(--muted); }
    .row-action:hover { background: var(--soft-green); color: var(--green); }
    .row-action .icon { width: 15px; height: 15px; }
    .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 0 18px 14px; }
    .search { display: flex; align-items: center; gap: 6px; min-height: 39px; padding: 0 10px; border: 1px solid #dbe1d9; border-radius: 8px; flex: 1 1 195px; max-width: 320px; }
    .search:focus-within { outline: 2px solid #a54b33; outline-offset: 2px; }
    .search .icon { color: var(--muted); width: 16px; height: 16px; }
    .search input { padding: 8px 0; background: transparent; border: 0; outline: 0; width: 100%; min-width: 0; }
    .search input:focus-visible { outline: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 225px), 1fr)); gap: 14px; }
    .team { padding: 19px; }
    .team h2 { margin-top: 11px; }
    .team p { color: var(--muted); margin: 7px 0 12px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    dialog { color: var(--ink); background: #fff; width: min(440px, calc(100% - 30px)); border: 1px solid var(--rule); border-radius: 15px; padding: 22px; }
    dialog::backdrop { background: #13291ec0; }
    dialog form { display: grid; gap: 14px; }
    dialog header, dialog footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    dialog footer { justify-content: flex-end; margin-top: 4px; }
    .field { display: grid; gap: 6px; font-size: 13px; font-weight: 690; }
    .field input, .field select, .field textarea { width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 7px; border: 1px solid #dbe1d9; color: var(--ink); background: #fff; }
    .field textarea { resize: vertical; min-height: 68px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toast { position: fixed; z-index: 5; right: 18px; bottom: 18px; max-width: calc(100% - 36px); padding: 12px 16px; border-radius: 9px; box-shadow: 0 4px 18px #143c2a30; background: #143c2a; color: #fff; font-weight: 650; }
    .panel-note, .meeting-meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .dash-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: -12px 0 18px; }
    .dash-head p { color: var(--muted); font-size: 13px; }
    .dash-head strong { color: var(--ink); }
    .attention { margin-bottom: 0; }
    .attention .panel-header { justify-content: flex-start; gap: 9px; padding-bottom: 12px; }
    .count-pill { min-width: 22px; padding: 2px 7px; border-radius: 20px; background: var(--soft-orange); color: var(--orange); font-size: 12px; font-weight: 750; text-align: center; }
    .todo-list { list-style: none; margin: 0; padding: 0 12px 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 8px; }
    .todo { width: 100%; height: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; text-align: left; background: #fbfcfa; border: 1px solid var(--rule); border-radius: 10px; }
    .todo:hover { background: var(--soft-green); border-color: #cfe0d2; }
    .todo-count { flex: none; min-width: 34px; height: 34px; padding: 0 8px; display: grid; place-items: center; border-radius: 9px; background: var(--soft-orange); color: var(--orange); font-weight: 780; font-variant-numeric: tabular-nums; }
    .todo-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .todo-text small { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .todo > .icon { width: 16px; height: 16px; color: var(--muted); }
    .all-clear { display: flex; align-items: center; gap: 12px; padding: 15px 17px; }
    .all-clear p { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .split-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .empty-state { font-weight: 400; font-size: 13px; display: grid; justify-items: center; gap: 6px; padding: 26px 16px; text-align: center; color: var(--muted); line-height: 1.5; white-space: normal; }
    .empty-state strong { color: var(--ink); font-size: 14px; margin-top: 4px; }
    .empty-state span:last-child { max-width: 46ch; }
    td.empty { text-align: center !important; padding: 0; }
    .result-count { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; padding: 0 18px 12px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .search-trigger { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 39px; margin-top: 12px; padding: 6px 9px; border: 1px solid #dbe1d9; border-radius: 8px; background: #fff; color: var(--muted); font-weight: 600; text-align: left; }
    .search-trigger:hover { border-color: #b9c9bc; color: var(--ink); }
    .search-trigger .icon { width: 16px; height: 16px; }
    .search-trigger kbd { margin-left: auto; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); font: inherit; font-size: 11px; }
    .nav-more, .tab-label { display: none; }
    #palette { width: min(560px, calc(100% - 26px)); padding: 0; margin-top: 12vh; overflow: hidden; }
    .palette-field { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border-bottom: 1px solid var(--rule); }
    .palette-field .icon { color: var(--muted); }
    .palette-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
    .palette-results { list-style: none; margin: 0; padding: 6px; max-height: min(52vh, 380px); overflow-y: auto; }
    .palette-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-weight: 620; }
    .palette-item .icon { width: 17px; height: 17px; color: var(--muted); }
    .palette-item small { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .palette-item[aria-selected="true"], .palette-item:hover { background: var(--soft-green); color: var(--green); }
    .palette-empty { padding: 20px 16px; color: var(--muted); }
    .palette-hint { padding: 8px 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 11px; }
    #more-sheet { padding: 16px; }
    #more-sheet h2 { margin-bottom: 10px; }
    #more-pages { display: grid; gap: 2px; }
    #more-sheet .sidebar-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding: 12px 2px 0; }
    .stack { display: grid; gap: 16px; }
    .stack > * { min-width: 0; }
    .panel-note { padding: 0 18px 14px; }
    .ledger-table td.numeric, .ledger-table th.numeric { text-align: right; font-variant-numeric: tabular-nums; }
    .ledger-table td:first-child { white-space: normal; }
    .ledger-table td.label-cell { min-width: 155px; white-space: normal; }
    .secondary-value { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .ledger-table tfoot { font-weight: 750; background: #f8f9f6; }
    .positive { color: var(--green); }
    .negative { color: var(--orange); }
    .text-button { background: #fff; border: 1px solid #dbe1d9; border-radius: 7px; padding: 6px 9px; font-weight: 660; font-size: 12px; }
    .text-button:hover { background: var(--soft-green); }
    .meeting-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; padding: 0 18px 18px; }
    .meeting-card { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; padding: 15px; border: 1px solid var(--rule); border-radius: 9px; overflow-wrap: anywhere; }
    .meeting-card p { white-space: pre-wrap; }
    .meeting-card .actions { margin-top: auto; }
    .row-actions { display: inline-flex; align-items: center; gap: 5px; }
    .money-overview .stat-value { font-size: clamp(16px, 2.55vw, 31px); overflow-wrap: anywhere; }
    .account-period { color: var(--muted); white-space: nowrap; font-size: 12px; }
    .account-line-end td { border-bottom: 1px solid var(--rule); }
    .finance-state { color: var(--green); margin: 0 0 15px; }
    .file-field small { font-weight: 500; color: var(--muted); }
    .report-details { padding: 0 18px 18px; }
    .report-details summary { cursor: pointer; font-weight: 700; }
    .report-details ul { margin-bottom: 0; padding-left: 19px; line-height: 1.65; }
    .report-title { overflow-wrap: anywhere; }
    .selection-list { display: grid; gap: 7px; max-height: 255px; overflow-y: auto; padding: 5px 2px; }
    .selection-list label { display: flex; align-items: flex-start; gap: 8px; padding: 3px 4px; }
    .selection-list input { accent-color: var(--green); flex: none; }
    .import-preview { max-height: 240px; overflow: auto; }
    .import-preview th { position: sticky; top: 0; }
    @media print {
      body:has(.closing-report) { background: #fff; }
      body:has(.closing-report) .shell { display: block; }
      body:has(.closing-report) .sidebar, body:has(.closing-report) .page-header,
      body:has(.closing-report) .toast, .closing-report button, .closing-report .no-print { display: none !important; }
      body:has(.closing-report) main { padding: 0; }
      .closing-report .table-wrap { overflow: visible; }
      .closing-report .panel { break-inside: avoid; }
    }
    .module-dialog { width: min(522px, calc(100% - 26px)); }
    .module-dialog form { gap: 12px; }
    .empty-note { padding: 16px 18px; color: var(--muted); }
    .page-description { color: var(--muted); margin: -12px 0 17px; line-height: 1.5; }

    @media (max-width: 1050px) {
      :root { --sidebar: 193px; }
      main { padding-inline: 24px; }
      th, td { padding-inline: 10px; }
    }
    @media (max-width: 865px) {
      .split-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      :root { font-size: 15px; }
      .shell { display: block; }
      /* Barre supérieure compacte : marque, recherche, espace de travail. */
      .sidebar { position: sticky; top: 0; z-index: 3; height: auto; flex-direction: row; align-items: center; gap: 8px; border: 0; border-bottom: 1px solid var(--rule); padding: 9px 15px; }
      .brand { margin: 0 auto 0 0; font-size: 20px; }
      .brand-mark { width: 29px; height: 29px; }
      .club, .workspace label, .sidebar > .sidebar-footer, .search-trigger span, .search-trigger kbd { display: none; }
      .search-trigger { width: 44px; min-height: 44px; margin: 0; justify-content: center; }
      .search-trigger .icon { width: 19px; height: 19px; }
      .workspace { margin: 0; }
      .workspace select { width: auto; min-height: 44px; }
      /* Barre d’onglets fixe en bas : quatre rubriques et « Plus ». */
      .navigation { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; margin: 0; gap: 0; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #fdfdfa; border-top: 1px solid var(--rule); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
      .navigation .nav-button { flex-direction: column; justify-content: center; gap: 3px; min-height: 52px; padding: 5px 2px; font-size: 11px; line-height: 1.15; text-align: center; white-space: nowrap; overflow: hidden; }
      .navigation .nav-button .icon { width: 21px; height: 21px; }
      .navigation .nav-button:nth-child(n+5):not(.nav-more) { display: none; }
      .nav-more { display: flex; }
      .navigation .tab-label { display: inline; }
      .navigation .nav-label:has(+ .tab-label) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      #more-pages .nav-button { min-height: 48px; font-size: 15px; }
      main { padding: 18px 15px calc(84px + env(safe-area-inset-bottom)); }
      .page-header { margin-bottom: 15px; }
      .season label { display: none; }
      .dash-head { margin: -4px 0 14px; }
      .dash-head .button { flex: 1 1 100%; }
      .button, .season select, .filters select, .text-button { min-height: 44px; }
      .row-action { width: 44px; height: 44px; }
      .row-action .icon { width: 18px; height: 18px; }
      input, select, textarea { font-size: 16px; }
      .overview { grid-template-columns: 1fr; gap: 6px; margin: 12px 0; }
      .stat { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; padding: 11px 12px; }
      .stat-link > .icon { display: none; }
      .stat-label { gap: 9px; }
      .tile { width: 28px; height: 28px; }
      .stat-value, .money-overview .stat-value { margin: 0; font-size: 20px; }
      .stat-value span { font-size: 12px; }
      .meter { flex: 1 1 100%; margin-top: 5px; }
      .panel-header { flex-wrap: wrap; padding: 14px 12px; }
      .filters { padding-inline: 12px; }
      .filters .search { flex-basis: 100%; max-width: none; min-height: 44px; }
      .filters select { flex: 1 1 130px; min-width: 0; }
      .result-count, .meeting-grid, .panel-note { padding-inline: 12px; }
      .todo-list { padding: 0 10px 10px; }
      .page-description { margin-top: -5px; }
      .toast { left: 15px; right: 15px; bottom: calc(72px + env(safe-area-inset-bottom)); text-align: center; }
      /* Les tableaux deviennent des fiches : une ligne par enregistrement, chaque valeur avec son intitulé. */
      main .table-wrap { overflow: visible; }
      main table, main tbody, main tfoot, main tr, main td { display: block; }
      main table { white-space: normal; font-size: 14px; }
      main thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      main tr { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px 12px; padding: 12px; border-top: 1px solid #edf0eb; }
      main td, main th:first-child, main td:first-child { padding: 0; border: 0; }
      main td, main td:last-child, .ledger-table td.numeric { display: block; text-align: left; overflow-wrap: anywhere; }
      main td::before { content: attr(data-label); display: block; margin-bottom: 2px; color: var(--muted); font-size: 11px; font-weight: 600; }
      main td.cell-primary { grid-column: 1 / -1; order: -1; font-size: 15px; font-weight: 700; }
      main td.cell-primary::before, main td.cell-actions::before, main td.empty::before { content: none; }
      main td.cell-actions { grid-column: 1 / -1; }
      main td.cell-actions .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      main td.cell-icons { position: absolute; top: 3px; right: 4px; }

      main td.empty { text-align: center !important; }
      main tfoot tr { background: #f8f9f6; }
      .ledger-table td.label-cell { min-width: 0; }
      main .identity { gap: 9px; }
      /* Les fenêtres de saisie s’ouvrent en feuille depuis le bas de l’écran. */
      dialog, .module-dialog, #palette { width: 100%; max-width: 100%; max-height: 92dvh; margin: auto 0 0; border-radius: 18px 18px 0 0; border-width: 1px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
      #palette { margin: 0 0 auto; border-radius: 0 0 18px 18px; padding-bottom: 0; }
      .palette-hint { display: none; }
      .form-row { grid-template-columns: 1fr; }
      dialog footer .button { flex: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .button, .nav-button, .todo, .stat, .text-button, .row-action { transition: background-color .12s, border-color .12s, color .12s; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true" id="brand-icon"></span>
        Gest’club
      </div>
      <div class="club">
        <span class="club-mark" aria-hidden="true">AS</span>
        <div><strong id="club-name">AS des Tilleuls</strong><small id="club-subtitle">Club de football</small></div>
      </div>
      <button type="button" class="search-trigger" id="open-search" data-search aria-label="Rechercher une page ou un adhérent" aria-keyshortcuts="Control+K Meta+K">
        <span id="search-trigger-label">Rechercher</span><kbd id="search-shortcut">Ctrl K</kbd>
      </button>
      <div class="workspace">
        <label for="workspace-role">Espace de travail</label>
        <select id="workspace-role">
          <option value="director">Dirigeant</option>
          <option value="treasurer">Trésorier</option>
          <option value="secretary">Secrétaire</option>
        </select>
      </div>
      <nav class="navigation" aria-label="Menu principal" id="navigation"></nav>
      <div class="sidebar-footer" id="sidebar-footer"><span class="demo-label" id="storage-mode">Mode démo</span>
        <button type="button" class="text-button" id="local-export">Exporter les données locales</button>
        <div class="actions" id="online-controls" hidden>
          <button type="button" class="text-button" id="online-refresh">Actualiser</button>
          <form method="post"><input type="hidden" name="csrf" id="logout-token">
            <button type="submit" name="logout" class="text-button">Déconnexion</button></form>
        </div>
      </div>
    </aside>

    <main>
      <header class="page-header">
        <h1 id="page-title">Tableau de bord</h1>
        <div class="season">
          <label for="season">Saison</label>
          <select id="season" aria-label="Saison">
            <option value="2026">2026–2027</option>
            <option value="2025">2025–2026</option>
          </select>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <dialog id="member-dialog" aria-labelledby="dialog-title">
    <form id="member-form">
      <header>
        <h2 id="dialog-title">Ajouter un adhérent</h2>
        <button class="row-action" type="button" data-close aria-label="Fermer" id="close-dialog"></button>
      </header>
      <div class="form-row">
        <label class="field">Prénom <input name="first" required maxlength="60"></label>
        <label class="field">Nom <input name="last" required maxlength="60"></label>
      </div>
      <label class="field">Équipe <select name="team" id="member-team"></select></label>
      <label class="field">Dossier
        <select name="fileStatus"><option>À vérifier</option><option>Incomplet</option><option>Complet</option></select>
      </label>
      <label class="field">Pièces ou informations manquantes <input name="fileNote" maxlength="180"></label>
      <label class="field">Cotisation
        <select name="paid"><option value="false">En attente</option><option value="true">Réglée</option></select>
      </label>
      <footer>
        <button class="button outline" type="button" data-close>Annuler</button>
        <button class="button primary" type="submit">Enregistrer</button>
      </footer>
    </form>
  </dialog>
  <dialog class="module-dialog" id="module-dialog" aria-labelledby="module-dialog-title"></dialog>
  <dialog id="palette" aria-label="Recherche">
    <label class="palette-field"><span class="visually-hidden">Rechercher une page ou un adhérent</span>
      <input type="search" id="palette-input" placeholder="Rechercher une page ou un adhérent" autocomplete="off"
        role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list">
    </label>
    <ul class="palette-results" id="palette-results" role="listbox" aria-label="Résultats"></ul>
    <p class="palette-hint" aria-hidden="true">↑ ↓ pour parcourir · Entrée pour ouvrir · Échap pour fermer</p>
  </dialog>
  <dialog id="more-sheet" aria-labelledby="more-title">
    <header><h2 id="more-title">Plus</h2>
      <button type="button" class="row-action" data-more-close aria-label="Fermer" id="more-close"></button></header>
    <nav id="more-pages" aria-label="Autres rubriques"></nav>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    (function () {
  "use strict";

  const icons = {
    logo: '<path d="M5 7h14v10H5zM12 7v10"/><circle cx="12" cy="12" r="2"/>',
    dashboard: '<rect x="3" y="3" width="7" height="8" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/>',
    members: '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m2-15a3 3 0 0 1 0 6m4 9v-2a4 4 0 0 0-3-4"/>',
    teams: '<path d="m12 22 2-4h4a3 3 0 0 0 3-3V5l-9-3-9 3v10a3 3 0 0 0 3 3h4l2 4Z"/><path d="m9 10 2 2 4-4"/>',
    payments: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18m-14 5h4"/>',
    ledger: '<path d="M5 3h12a2 2 0 0 1 2 2v16H6a2 2 0 1 1 0-4h13M5 17V3m4 4h6m-6 4h6"/>',
    budget: '<path d="M4 19h16M6 15v-4m6 4V6m6 9V9"/>',
    meetings: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18m-12 5h6"/>',
    tasks: '<path d="m4 7 2 2 4-4m3 2h7M4 16l2 2 4-4m3 2h7"/>',
    invoices: '<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7m-7 4h7"/>',
    accounting: '<path d="M12 3v17m-6 0h12M4 7h16M7 7l-3 6h6L7 7Zm10 0-3 6h6l-3-6Z"/>',
    bank: '<path d="M3 9h18l-9-5-9 5Zm2 10h14M7 10v7m5-7v7m5-7v7"/>',
    expenses: '<path d="M6 3v18l3-2 3 2 3-2 3 2V3L15 5l-3-2-3 2-3-2Zm3 6h6m-6 4h6"/>',
    closing: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    arrow: '<path d="M4 12h15m-6-6 6 6-6 6"/>',
    pencil: '<path d="m15 5 4 4M4 20l4.5-1 12-12a2.8 2.8 0 0 0-4-4l-12 12L4 20Z"/>',
    search: '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
    download: '<path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>',
    check: '<path d="m5 12 5 5 9-10"/>',
    chevron: '<path d="m9 6 6 6-6 6"/>',
    inbox: '<path d="M4 13 6.5 5h11L20 13v6H4v-6Zm0 0h5a3 3 0 0 0 6 0h5"/>',
    more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'
  };

  function icon(name) {
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
  }

  const pages = {
    dashboard: "Tableau de bord", members: "Adhérents", teams: "Équipes", payments: "Cotisations",
    ledger: "Journal de trésorerie", budget: "Budget et rapport", meetings: "Réunions et PV", tasks: "Plan d’action",
    invoices: "Factures et échéances", accounting: "Écritures et balance", bank: "Rapprochement bancaire",
    expenses: "Notes de frais", closing: "Clôture et rapport d’AG", renewals: "Renouvellement des adhésions",
    decisions: "Décisions du bureau", volunteers: "Bénévoles", assembly: "Préparation de l’AG"
  };
  const workspaces = {
    director: ["dashboard", "teams", "members", "decisions", "tasks", "volunteers", "expenses"],
    treasurer: ["dashboard", "ledger", "bank", "invoices", "expenses", "accounting", "budget", "payments", "closing"],
    secretary: ["dashboard", "members", "renewals", "meetings", "tasks"]
  };
  const menuLabels = { ledger: "Trésorerie", budget: "Budget", invoices: "Factures", accounting: "Comptabilité",
    bank: "Rapprochement", closing: "Clôture", renewals: "Renouvellement", decisions: "Décisions" };
  // Libellés courts pour la barre d’onglets du téléphone.
  const tabLabels = { dashboard: "Accueil", bank: "Banque", renewals: "Rentrée", meetings: "Réunions" };
  const pageIcons = { renewals: "members", decisions: "tasks", volunteers: "teams", assembly: "meetings" };
  const teams = ["Seniors", "U17", "U15"];
  const examples = [
    ["Louise", "Martin", "Seniors", true], ["Adam", "Bernard", "U17", false],
    ["Inès", "Petit", "U15", true], ["Hugo", "Robert", "Seniors", true],
    ["Maya", "Laurent", "U17", false], ["Sara", "Diallo", "U15", true],
    ["Nathan", "Thomas", "U17", true], ["Chloé", "Roux", "Seniors", true],
    ["Noé", "Garnier", "U15", false], ["Emma", "Vincent", "U15", true],
    ["Lucas", "Mercier", "U17", true], ["Lina", "Dupont", "Seniors", false],
    ["Amine", "Haddad", "Seniors", true], ["Gabriel", "Morel", "U15", true],
    ["Léna", "Simon", "U17", true], ["Raphaël", "Leroy", "Seniors", true],
    ["Jade", "Muller", "U15", false], ["Hana", "Nguyen", "U17", true],
    ["Arthur", "Girard", "U17", true], ["Zoé", "Robin", "Seniors", false],
    ["Louis", "Fournier", "Seniors", true], ["Nina", "André", "U15", true],
    ["Éliott", "Lopez", "U17", false], ["Fatou", "Ndiaye", "Seniors", true]
  ];

  const elements = Object.fromEntries(
    ["brand-icon", "navigation", "page-title", "season", "content", "member-dialog", "member-form",
      "dialog-title", "close-dialog", "member-team", "toast", "workspace-role", "module-dialog"]
      .map(id => [id, document.getElementById(id)])
  );
  const nav = elements.navigation;
  const season = elements.season;
  const main = elements.content;
  const dialog = elements["member-dialog"];
  const form = elements["member-form"];
  const role = elements["workspace-role"];
  const moduleDialog = elements["module-dialog"];
  const palette = document.getElementById("palette");
  const paletteInput = document.getElementById("palette-input");
  const paletteResults = document.getElementById("palette-results");
  const moreSheet = document.getElementById("more-sheet");
  const morePages = document.getElementById("more-pages");
  const sidebarFooter = document.getElementById("sidebar-footer");
  const compactLayout = window.matchMedia("(max-width: 680px)");
  const tabCount = 4;
  const remote = window.gestclubRemote || null;
  const clubName = remote?.clubName || "AS des Tilleuls";
  let remoteBusy = false;
  if (remote) {
    role.replaceChildren(...remote.roles.map(value => new Option(
      { director: "Dirigeant", treasurer: "Trésorier", secretary: "Secrétaire" }[value], value
    )));
    role.value = remote.role;
    season.replaceChildren(...Object.keys(remote.state.records).sort().reverse()
      .map(year => new Option(`${year}–${Number(year) + 1}`, year)));
    document.getElementById("club-name").textContent = clubName;
    document.getElementById("club-subtitle").hidden = true;
    document.getElementById("storage-mode").textContent = "Données partagées";
    document.getElementById("online-controls").hidden = false;
    document.getElementById("local-export").hidden = true;
    document.getElementById("logout-token").value = remote.csrf;
  }
  const storageKey = "gestclub-demo-v1";
  const records = loadRecords();
  let page = "dashboard";
  let filters = { search: "", team: "", payment: "" };
  let editingId = null;
  let selectedAssemblyId = "";
  let toastTimeout;

  function loadRecords() {
    if (remote) return structuredClone(remote.state.records);
    const initial = {
      2026: examples.map(([first, last, team, paid], id) => ({ id: String(id), first, last, team, paid })),
      2025: [
        ...examples.slice(0, 18).map(([first, last, team], id) =>
          ({ id: String(id), first, last, team, paid: id !== 1 && id !== 4 })),
        { id: "prior-1", first: "Mila", last: "Lefèvre", team: "U17", paid: true },
        { id: "prior-2", first: "Léo", last: "Perrin", team: "U15", paid: true },
        { id: "prior-3", first: "Yanis", last: "Dubois", team: "Seniors", paid: true }
      ]
    };
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved?.[2026]) && Array.isArray(saved?.[2025])) return saved;
    } catch {
      // The demonstration still works in browsers that block local storage.
    }
    return initial;
  }

  function notify(message) {
    elements.toast.textContent = message;
    elements.toast.hidden = false;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { elements.toast.hidden = true; }, 4500);
  }

  function getMembers() {
    return records[season.value];
  }

  function hasRecordedDues(member) {
    return clubYear().entries.some(entry => entry.memberId === member.id);
  }

  function hasPaid(member) {
    return member.paid || hasRecordedDues(member);
  }

  function escapeHtml(value) {
    const substitutions = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    return String(value).replace(/[&<>"']/g, character => substitutions[character]);
  }

  function initials(member) {
    return `${[...member.first][0] || ""}${[...member.last][0] || ""}`.toLocaleUpperCase("fr");
  }

  // Les raccourcis vers une rubrique d’un autre rôle ne s’affichent que si le compte possède ce rôle.
  function canReach(workspace) {
    return !workspace || !remote || remote.roles.includes(workspace);
  }

  function navAttributes(target) {
    return `data-nav="${target.page}" data-role="${target.role || ""}" data-payment="${target.payment || ""}" data-file-status="${target.fileStatus || ""}"`;
  }

  function stat(label, value, symbol, secondary = "", warm = false, target = null, progress = null) {
    const body = `<span class="stat-label"><span class="tile${warm ? " warm" : ""}">${icon(symbol)}</span>${label}</span>
      <span class="stat-value">${value}${secondary ? `<span>${secondary}</span>` : ""}</span>
      ${progress === null ? "" : `<span class="meter" aria-hidden="true"><i style="width: ${progress}%"></i></span>`}`;
    if (target && canReach(target.role)) {
      return `<button type="button" class="stat stat-link" ${navAttributes(target)}>${body}${icon("arrow")}</button>`;
    }
    return `<article class="stat">${body}</article>`;
  }

  function emptyState(title, hint = "") {
    return `<div class="empty-state"><span class="tile">${icon("inbox")}</span><strong>${title}</strong>${hint ? `<span>${hint}</span>` : ""}</div>`;
  }

  // « À traiter » : ce qui attend une action, avec un accès direct à la bonne rubrique.
  function attention(items) {
    const visible = items.filter(item => item.count > 0 && canReach(item.role));
    if (!visible.length) {
      return `<section class="panel all-clear" aria-label="À traiter"><span class="tile">${icon("check")}</span>
        <div><h2>Tout est à jour</h2><p>Rien n’attend ton intervention pour cette saison.</p></div></section>`;
    }
    return `<section class="panel attention" aria-labelledby="attention-title">
      <header class="panel-header"><h2 id="attention-title">À traiter</h2><span class="count-pill">${visible.length}</span></header>
      <ul class="todo-list">${visible.map(item => `<li><button type="button" class="todo" ${navAttributes(item)}>
        <span class="todo-count">${item.count}</span>
        <span class="todo-text"><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(item.hint)}</small></span>
        ${icon("chevron")}</button></li>`).join("")}</ul></section>`;
  }

  function dashHead(workspace, primary) {
    return `<div class="dash-head"><p><strong>${escapeHtml(clubName)}</strong> · ${workspace}</p>${primary}</div>`;
  }

  function plural(count, one, many) {
    return count === 1 ? one : many;
  }

  function rows(members) {
    if (!members.length) {
      const message = getMembers().length
        ? emptyState("Aucun adhérent ne correspond", "Modifie la recherche ou réinitialise les filtres.")
        : emptyState("Aucun adhérent pour cette saison", "Ajoute un premier adhérent ou reprends ceux de la saison précédente.");
      return `<tr><td colspan="${page === "members" ? 5 : 4}" class="empty">${message}</td></tr>`;
    }
    const avatarColors = ["sage", "peach", "blue", "gold"];
    return members.map((member, index) => {
      const name = escapeHtml(`${member.first} ${member.last}`);
      const isPaid = hasPaid(member);
      const paid = isPaid ? "Réglée" : "En attente";
      const collect = page === "payments" && !isPaid ? action("Encaisser", "dues", member.id) : "";
      return `<tr>
        <td><span class="identity"><span class="avatar ${avatarColors[index % avatarColors.length]}" aria-hidden="true">${escapeHtml(initials(member))}</span>${name}</span></td>
        <td>${escapeHtml(member.team)}</td>
        ${page === "members" ? `<td>${badge(fileStatus(member), fileStatus(member) !== "Complet")}
        ${member.fileNote ? `<span class="secondary-value">${escapeHtml(member.fileNote)}</span>` : ""}</td>` : ""}
        <td><span class="badge ${isPaid ? "paid" : "unpaid"}">${paid}</span></td>
        <td><span class="row-actions">${collect}<button type="button" class="row-action" data-edit="${escapeHtml(member.id)}" aria-label="Modifier ${name}" title="Modifier">${icon("pencil")}</button></span></td>
      </tr>`;
    }).join("");
  }

  function table(members) {
    return `<div class="table-wrap" tabindex="0" role="region" aria-label="Liste des adhérents">
      <table>
        <thead><tr><th scope="col">Adhérent</th><th scope="col">Équipe</th>${page === "members" ? '<th scope="col">Dossier</th>' : ""}<th scope="col">Cotisation</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
        <tbody id="member-rows">${rows(members)}</tbody>
      </table>
    </div>`;
  }

  function dashboard() {
    const members = getMembers();
    const paid = members.filter(hasPaid).length;
    const unpaid = members.length - paid;
    const percent = members.length ? Math.round((paid / members.length) * 100) : 0;
    const year = clubYear();
    const toCheck = members.filter(member => fileStatus(member) !== "Complet").length;
    const openTasks = year.tasks.filter(task => task.status !== "Terminée").length;
    const vacant = (year.volunteers ?? []).filter(item => !item.owner).length;
    return `
      ${dashHead("Espace dirigeant", `<button type="button" class="button primary" data-add>${icon("plus")} Ajouter un adhérent</button>`)}
      ${attention([
        { count: unpaid, label: plural(unpaid, "Cotisation en attente", "Cotisations en attente"),
          hint: "Relancer les adhérents ou encaisser les règlements.", page: "payments", role: "treasurer", payment: "unpaid" },
        { count: toCheck, label: plural(toCheck, "Dossier à compléter", "Dossiers à compléter"),
          hint: "Vérifier les pièces et les informations manquantes.", page: "members" },
        { count: openTasks, label: plural(openTasks, "Action ouverte", "Actions ouvertes"),
          hint: "Suivre le plan d’action du bureau.", page: "tasks" },
        { count: vacant, label: plural(vacant, "Poste bénévole à pourvoir", "Postes bénévoles à pourvoir"),
          hint: "Trouver un bénévole avant l’échéance.", page: "volunteers" }
      ])}
      <section class="overview" aria-label="Chiffres de la saison">
        ${stat("Adhérents", members.length, "members", plural(teams.length, "en 1 équipe", `en ${teams.length} équipes`), false, { page: "members" })}
        ${stat("Cotisations réglées", paid, "payments", `sur ${members.length} · ${percent}&nbsp;%`, false, { page: "payments", role: "treasurer" }, percent)}
        ${stat("Solde de trésorerie", budgetSummary().ending, "bank", "", true, { page: "budget", role: "treasurer" })}
      </section>
      <div class="stack">
        <section class="panel" aria-labelledby="recent-title">
          <header class="panel-header"><h2 id="recent-title">Derniers adhérents</h2>
            <button type="button" class="link-button" data-nav="members">Voir la liste ${icon("arrow")}</button>
          </header>
          ${table(members.slice(0, 5))}
        </section>
        ${directorOverview()}
      </div>`;
  }

  function normalize(value) {
    return value.toLocaleLowerCase("fr").normalize("NFD").replace(/\p{Diacritic}/gu, "");
  }

  function filteredMembers() {
    const query = normalize(filters.search.trim());
    return getMembers().filter(member =>
      (!query || normalize(`${member.first} ${member.last}`).includes(query) ||
        normalize(`${member.last} ${member.first}`).includes(query)) &&
      (!filters.team || member.team === filters.team) &&
      (!filters.payment || hasPaid(member) === (filters.payment === "paid")) &&
      (!filters.fileStatus || fileStatus(member) === filters.fileStatus)
    );
  }

  function option(value, label, current) {
    return `<option value="${escapeHtml(value)}"${value === current ? " selected" : ""}>${escapeHtml(label)}</option>`;
  }

  function list() {
    const payments = page === "payments";
    return `<section class="panel" aria-labelledby="list-title">

  function downloadCsv(name, lines) {
    const csvCell = value => {
      const text = String(value);
      const formula = /^[=+@\-\t\r\n]/.test(text) && !/^-?\d+(?:[,.]\d+)?$/.test(text);
      const safe = formula ? "'" + text : text;
      return '"' + safe.replaceAll('"', '""') + '"';
    };
    const csv = lines.map(row => row.map(csvCell).join(";")).join("\r\n");
    downloadFile(`${name}-${season.value}.csv`, ["\uFEFF", csv], "text/csv;charset=utf-8");
    notify("Export CSV préparé.");
  }

  function downloadFile(name, content, mime) {
    const url = URL.createObjectURL(new Blob(content, { type: mime }));
    const download = document.createElement("a");
    download.href = url;
    download.download = `gestclub-${name}`;
    document.body.append(download);
    download.click();
    download.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

    if (remote) return structuredClone(remote.state.bureau);

      if (saved?.[2026]?.entries && saved?.[2025]?.entries) return saved;

  function financialTotals(entries, includeTransfers = false) {
    return entries.reduce((totals, entry) => {
      if (includeTransfers || !entry.transferId) totals[entry.kind] += entry.amount;
      return totals;
    }, { income: 0, expense: 0 });
  }

  function budgetSummary(totals) {
    if (clubYear().report) return { ending: money(clubYear().report.balance) };
    totals ??= financialTotals(clubYear().entries);
    const opening = clubYear().opening;
    return { ending: money(opening.bank + opening.cash + totals.income - totals.expense) };
  }

  function financeDashboard() {
    const year = clubYear();
    const totals = financialTotals(year.entries);
    const toCheck = year.entries.filter(entry => entry.account === "bank" && !entry.cleared).length;
    const invoices = invoicesForSeason();
    const toPay = invoices.filter(invoice => invoice.kind === "expense" && invoice.remaining > 0);
    const toCollect = invoices.filter(invoice => invoice.kind === "income" && invoice.remaining > 0);
    const due = list => money(list.reduce((sum, invoice) => sum + invoice.remaining, 0));
    const claims = expenseRecords().filter(expense => expense.status === "Déposée" && !expense.invoiceId).length;

        { count: toPay.length, label: plural(toPay.length, "Facture à payer", "Factures à payer"),
          hint: `${due(toPay)} restent à régler.`, page: "invoices" },

  function dataTable(columns, rows, title, footer = "") {
    const headings = columns.map(([text, numeric]) => `<th scope="col"${numeric ? ' class="numeric"' : ""}>${text}</th>`).join("");
    return `<div class="table-wrap" tabindex="0" role="region" aria-label="${title}">
      <table class="ledger-table"><thead><tr>${headings}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${columns.length}" class="empty">${emptyState(...(emptyTables[title] || ["Rien à afficher pour le moment"]))}</td></tr>`}</tbody>${footer}
      </table></div>`;
  }

  function amountCell(cents, signed = false) {
    const label = (signed && cents > 0 ? "+" : "") + money(cents);
    const color = signed ? (cents < 0 ? "negative" : "positive") : "";
    return `<td class="numeric ${color}">${label}</td>`;
  }

  function accountSummary() {
    const rows = Object.entries(accounts).map(([id, label]) => {
      const entries = clubYear().entries.filter(entry => entry.account === id);
      const totals = financialTotals(entries, true);
      const cleared = financialTotals(entries.filter(entry => entry.cleared), true);
      const opening = clubYear().opening[id];
      const clearedCell = id === "bank" ? amountCell(opening + cleared.income - cleared.expense) : '<td class="numeric">—</td>';
      return `<tr><td>${label}</td>${amountCell(opening + totals.income - totals.expense)}${clearedCell}
        ${amountCell(opening)}${amountCell(totals.income)}${amountCell(totals.expense)}</tr>`;
    }).join("");
    const columns = [["Compte"], ["Solde suivi", true], ["Solde pointé", true], ["Ouverture", true], ["Entrées", true], ["Sorties", true]];
    return `<section class="panel"><header class="panel-header"><h2>Banque et caisse</h2>
      ${action("Soldes d’ouverture", "opening")}</header>${dataTable(columns, rows, "Soldes par compte")}</section>`;

  function budgetRows(kind) {
    const year = clubYear();
    return categories[kind].map(category => ({
      category,
      planned: year.plan[kind][category] ?? 0,
      actual: year.entries.filter(entry => !entry.transferId && entry.kind === kind && entry.category === category)
        .reduce((sum, entry) => sum + entry.amount, 0)
    }));
  }

  function budget() {
    const blocks = Object.keys(categories).map(kind => {
      const lines = budgetRows(kind);
      const total = lines.reduce(({ planned, actual }, line) =>
        ({ planned: planned + line.planned, actual: actual + line.actual }), { planned: 0, actual: 0 });
      const lineHtml = ({ category, planned, actual }) =>
        `<tr><td>${escapeHtml(category)}</td>${amountCell(planned)}${amountCell(actual)}${amountCell(actual - planned)}</tr>`;
      const title = kind === "income" ? "Recettes" : "Dépenses";
      const columns = [["Catégorie"], ["Prévu", true], ["Réalisé", true], ["Écart", true]];
      return `<section class="panel"><header class="panel-header"><h2>${title}</h2>
        ${action("Modifier le prévisionnel", "plan", kind)}</header>
        ${dataTable(columns, lines.map(lineHtml).join(""), title, `<tfoot>${lineHtml({ category: "Total", ...total })}</tfoot>`)}
        </section>`;
    });
    const { income, expense } = financialTotals(clubYear().entries);
    return `<p class="page-description">Le réalisé repose sur les encaissements et décaissements. L’écart correspond au réalisé moins le prévu.</p>
      <div class="stack"><section class="panel"><header class="panel-header"><h2>Rapport de trésorerie</h2>
      ${action("Export CSV", "export-budget", "", "outline", "download")}</header>

      ${blocks.join("")}${analysisPanel()}</div>`;
  }

  function secretaryDashboard() {
    const year = clubYear();
    const scheduled = year.meetings.filter(meeting => meeting.status === "À venir").sort((a, b) => a.date.localeCompare(b.date));
    const draftCount = year.meetings.filter(meeting => meeting.status === "Tenue").length;
    const next = scheduled[0];

  function openModuleDialog(title, fields, save, saveChanges = saveBureau) {
    const trigger = document.activeElement;
    moduleDialog.innerHTML = `<form><header><h2 id="module-dialog-title">${title}</h2>
      <button type="button" class="row-action" data-module-action="close" aria-label="Fermer">${icon("close")}</button>
      </header>${fields}<footer><button type="button" class="button outline" data-module-action="close">Annuler</button>
      <button type="submit" class="button primary">Enregistrer</button></footer></form>`;
    const editor = moduleDialog.querySelector("form");
    editor.addEventListener("submit", async event => {
      event.preventDefault();
      if (editor.dataset.saving) return;
      for (const input of editor.querySelectorAll("input[required], textarea[required]")) {
        if (input.value.trim()) continue;
        input.setCustomValidity("Renseigne ce champ.");
        input.reportValidity();
        return;
      }
      const data = Object.fromEntries(new FormData(editor).entries());
      let message;
      try {
        editor.dataset.saving = "true";
        for (const button of editor.querySelectorAll("button")) button.disabled = true;
        message = await save(data, editor);
      } catch (error) {
        notify(error instanceof Error ? error.message : "Enregistrement impossible.");
        return;
      } finally {
        delete editor.dataset.saving;
        for (const button of editor.querySelectorAll("button")) button.disabled = false;
      }
      if (!message) return;
      moduleDialog.close();
      saveChanges(message);
      render();
      restoreActionFocus(trigger);
    });
    editor.addEventListener("input", event => event.target.setCustomValidity?.(""));
    moduleDialog.showModal();
    editor.querySelector("input, select, textarea")?.focus();
    return editor;
  }

  moduleDialog.addEventListener("cancel", event => {
    if (moduleDialog.querySelector("form")?.dataset.saving) event.preventDefault();
  });

  function restoreActionFocus(trigger) {
    if (!trigger?.dataset.moduleAction) return;
    const similar = Array.from(main.querySelectorAll("[data-module-action]")).filter(button =>
      button.dataset.moduleAction === trigger.dataset.moduleAction);
    const target = similar.find(button => button.dataset.value === trigger.dataset.value) || similar[0] ||
      main.querySelector(".panel-header button, .dash-head button");
    target?.focus();
  }

  function inputField(label, name, value = "", attributes = "") {
    return `<label class="field">${label}<input name="${name}" value="${escapeHtml(value)}" ${attributes}></label>`;
  }

  function selectField(label, name, options) {
    return `<label class="field">${label}<select name="${name}">${options}</select></label>`;
  }

  function textarea(label, name, value) {
    return `<label class="field">${label}<textarea name="${name}" maxlength="5000">${escapeHtml(value || "")}</textarea></label>`;
  }

  function optionList(values, selected) {
    return values.map(value => option(value, value, selected)).join("");

  function seasonDates() {
    return { start: `${season.value}-09-01`, end: `${Number(season.value) + 1}-08-31` };
  }

  function dateField(label, value, required = true) {
    const { start, end } = seasonDates();
    return inputField(label, "date", value, `type="date" min="${start}" max="${end}" ${required ? "required" : ""}`);
  }

  function todayIso() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  }

  function defaultDate() {
    const value = todayIso();
    const { start, end } = seasonDates();
    return value >= start && value <= end ? value : start;
  }

  function amountField(label, name, cents, minimum = 0, required = true) {
    return inputField(label, name, cents === undefined ? "" : (cents / 100).toFixed(2),
      `type="number" inputmode="decimal" step="0.01" min="${minimum}" max="999999999" ${required ? "required" : ""}`);
  }

  function cents(value) {
    return Math.round(Number(value) * 100);
  }

  function saveItem(items, item) {
    const index = items.findIndex(existing => existing.id === item.id);
    if (index < 0) items.push(item);
    else items[index] = item;
  }

  function editTransfer(transferId) {
    const year = clubYear();
    const outgoing = year.entries.find(entry => entry.transferId === transferId && entry.kind === "expense");
    const source = outgoing?.account ?? "cash";
    const flows = { cash: "Caisse vers banque", bank: "Banque vers caisse" };
    const fields = `${dateField("Date du virement", outgoing?.date || defaultDate())}
      ${selectField("Sens du virement", "source", choices(flows, source))}
      ${amountField("Montant (€)", "amount", outgoing?.amount, 0.01)}
      ${inputField("Référence du justificatif", "reference", outgoing?.reference, "maxlength=100")}
      <p class="meeting-meta">Le virement change les soldes des deux comptes. Il n’entre pas dans le réalisé du budget.</p>`;
    openModuleDialog(transferId ? "Modifier le virement interne" : "Virement interne", fields, data => {
      const id = transferId || newId();
      const bankEntry = year.entries.find(entry => entry.transferId === id && entry.account === "bank");
      const amount = cents(data.amount);
      const label = flows[data.source];
      const base = { transferId: id, date: data.date, label, amount, category: "Virement interne", reference: data.reference.trim() };
      const destination = data.source === "cash" ? "bank" : "cash";
      const bankKind = destination === "bank" ? "income" : "expense";
      const bankCleared = Boolean(bankEntry?.cleared && bankEntry.date === data.date && bankEntry.amount === amount && bankEntry.kind === bankKind);
      saveItem(year.entries, { ...base, id: id + "-out", kind: "expense", account: data.source, cleared: data.source === "bank" && bankCleared });
      saveItem(year.entries, { ...base, id: id + "-in", kind: "income", account: destination, cleared: destination === "bank" && bankCleared });
      if (!transferId) {
        ledgerFilters.kind = "transfer";
        ledgerFilters.account = "";
      }
      return "Virement interne enregistré.";
    });
  }

  function handleModuleAction(button) {
    const value = button.dataset.value;
    const year = clubYear();
    const command = button.dataset.moduleAction;
    if (financeWrites.has(command) && lockedFinanceYear()) {
      notify(financeLockMessage());
      return;
    }
    if (["entry", "invoice-payment-edit", "clear", "transfer"].includes(command) &&
      year.entries.some(entry => entry.bankLineId && (entry.id === value || entry.transferId === value))) {
      notify("Annule le rapprochement bancaire pour modifier cette opération.");
      return;
    }
    switch (command) {
      case "renew-members": renewMembersDialog(); break;
      case "import-members": importMembersDialog(); break;
      case "decision": editDecision(year.decisions?.find(item => item.id === value)); break;
      case "decision-task": {
        const decision = year.decisions?.find(item => item.id === value);
        if (decision) editTask(year.tasks.find(task => task.id === decision.taskId), decision);
        break;
      }
      case "volunteer": editVolunteer(year.volunteers?.find(item => item.id === value)); break;
      case "assembly": openAssembly(value); break;
      case "assembly-list": editAssemblyList(); break;
      case "assembly-attendee": editAssemblyAttendee(value); break;
      case "assembly-vote": editAssemblyVote(value); break;
      case "assembly-vote-decision": recordVoteDecision(value); break;
      case "assembly-report": attachAssemblyReport(); break;
      case "assembly-export": exportAssemblyList(); break;
      case "bank-import": importBankDialog(); break;
      case "bank-match": matchBankDialog(value); break;
      case "bank-unmatch": unmatchBank(value); break;
      case "expense": expenseDialog(value); break;
      case "expense-review": reviewExpense(value); break;
      case "receipt": attachReceipt(value); break;
      case "receipt-download": downloadReceipt(value); break;
      case "close-finance": closeFinance(); break;
      case "print-report": window.print(); break;
      case "entry": editEntry(year.entries.find(entry => entry.id === value)); break;
      case "invoice": editInvoice(value); break;
      case "invoice-payment": editInvoicePayment(findInvoice(value)); break;
      case "invoice-payment-edit": {
        const entry = year.entries.find(item => item.id === value);
        const invoice = findInvoice(entry.invoiceId);
        if (invoice) editInvoicePayment(invoice, entry);
        break;
      }
      case "export-invoices": exportInvoices(); break;
      case "export-accounting": exportAccounting(); break;
      case "export-trial-balance": exportTrialBalance(); break;
      case "dues": {
        const member = getMembers().find(item => item.id === value);
        if (member && !hasPaid(member)) editEntry(undefined, member);
        break;
      }
      case "transfer": editTransfer(value); break;
      case "opening": editOpening(); break;
      case "plan": editPlan(value); break;
      case "meeting": editMeeting(year.meetings.find(meeting => meeting.id === value)); break;
      case "task": editTask(year.tasks.find(task => task.id === value)); break;
      case "export-ledger": exportLedger(); break;
      case "export-budget": exportBudget(); break;
      case "close": moduleDialog.close(); break;
      case "clear": {
        const entry = year.entries.find(item => item.id === value);
        entry.cleared = !entry.cleared;
        saveBureau(entry.cleared ? "Opération pointée." : "Pointage retiré.");
        render();
        restoreActionFocus(button);
        break;
      }
      case "finish": {
        year.tasks.find(item => item.id === value).status = "Terminée";
        saveBureau("Action terminée.");
        render();
        restoreActionFocus(button);
        break;
      }
      case "invitation":
      case "minutes":
        exportMeeting(year.meetings.find(item => item.id === value), button.dataset.moduleAction === "minutes");
        break;
    }
  }

  function findInvoice(id) {
    return allInvoices().find(invoice => invoice.id === id);
  }

  function allInvoices() {
    return Object.values(bureau).flatMap(year => year.invoices ?? []);
  }

  function settledAmount(invoice, until = "9999-12-31", except = null) {
    return Object.values(bureau).reduce((total, year) => total + year.entries
      .filter(entry => entry.invoiceId === invoice.id && entry.date <= until && entry !== except)
      .reduce((sum, entry) => sum + entry.amount, 0), 0);
  }

  function invoicesForSeason() {
    const { start, end } = seasonDates();
    const today = todayIso();
    const comparison = today < end ? today : end;
    return allInvoices().filter(invoice => invoice.date <= end &&
      (invoice.date >= start || settledAmount(invoice, previousClosing()) < invoice.amount))
      .map(invoice => {
        const paid = settledAmount(invoice, end);
        const remaining = invoice.amount - paid;
        const status = remaining === 0 ? "Réglée" : paid === 0 ? "À régler" : "Partielle";
        const overdue = invoice.due < comparison && settledAmount(invoice, comparison) < invoice.amount;
        return { ...invoice, paid, remaining, status, overdue };
      }).sort((a, b) => a.due.localeCompare(b.due));
  }

  function previousClosing() {
    return `${season.value}-08-31`;
  }

  function invoiceTotals() {
    return invoicesForSeason().reduce((totals, invoice) => {
      totals[invoice.kind] += invoice.remaining;
      if (invoice.overdue) totals.overdue += 1;
      return totals;
    }, { income: 0, expense: 0, overdue: 0 });
  }

  function visibleInvoices() {
    return invoicesForSeason().filter(invoice =>
      (!invoiceFilters.kind || invoice.kind === invoiceFilters.kind) &&
      (!invoiceFilters.status || (invoiceFilters.status === "overdue" ? invoice.overdue :

  function invalidInput(input, message) {

  function editInvoice(id) {
    const existing = id ? findInvoice(id) : null;
    if (existing?.expenseId) return;
    const paid = existing ? settledAmount(existing) : 0;
    const kind = existing?.kind ?? "expense";
    const directions = paid ? { [kind]: invoiceKinds[kind] } : invoiceKinds;
    const validCategories = paid ? [existing.category] : categories[kind];
    const issued = existing?.date || defaultDate();
    const dateControl = paid
      ? inputField("Date de facture", "date", issued, 'type="date" readonly required')
      : dateField("Date de facture", issued);
    const lockIdentity = paid ? "readonly" : "";
    const fields = `<div class="form-row">${selectField("Type de facture", "kind", choices(directions, kind))}
      ${inputField("Numéro de facture", "reference", existing?.reference, `maxlength=80 required ${lockIdentity}`)}</div>
      ${inputField("Fournisseur ou client", "party", existing?.party, `maxlength=120 required ${lockIdentity}`)}
      ${inputField("Libellé", "label", existing?.label, "maxlength=120 required")}
      <div class="form-row">${dateControl}
      ${inputField("Date d’échéance", "due", existing?.due ?? issued, `type="date" min="${issued}" max="9999-12-31" required`)}</div>
      ${selectField("Catégorie", "category", optionList(validCategories, existing?.category))}
      ${amountField("Montant total (€)", "amount", existing?.amount, 0.01)}
      ${analysisFields(existing?.analysis)}
      ${paid ? `<p class="meeting-meta">${money(paid)} déjà réglés sur cette facture.</p>` : ""}`;
    const editor = openModuleDialog(existing ? "Modifier la facture" : "Nouvelle facture", fields, (data, form) => {
      const amount = cents(data.amount);
      if (data.due < data.date) return invalidInput(form.elements.due, "L’échéance doit suivre la date de la facture ou tomber le même jour.");
      if (amount < paid) return invalidInput(form.elements.amount, `Le montant doit couvrir les ${money(paid)} déjà réglés.`);
      const reference = data.reference.trim();
      const party = data.party.trim();
      const duplicate = allInvoices().some(invoice => invoice.id !== id && invoice.kind === data.kind &&
        normalize(invoice.party) === normalize(party) && normalize(invoice.reference) === normalize(reference));
      if (duplicate) return invalidInput(form.elements.reference, "Une facture de ce tiers porte déjà ce numéro.");
      clubYear().invoices ??= [];
      const { kind, date, due } = data;
      saveItem(clubYear().invoices, { ...existing, kind, date, due, id: id || newId(),
        amount, party, reference, label: data.label.trim(), analysis: readAnalysis(data) });
      invoiceFilters.kind = "";
      invoiceFilters.status = "";
      return existing ? "Facture modifiée." : "Facture enregistrée.";
    });
    editor.elements.kind.addEventListener("change", () => {
      editor.elements.category.innerHTML = optionList(categories[editor.elements.kind.value]);
    });
    editor.elements.date.addEventListener("input", () => {
      const due = editor.elements.due;
      due.min = editor.elements.date.value;
      due.setCustomValidity("");
      if (due.value < due.min) due.value = due.min;
    });
    editor.elements.party.addEventListener("input", () => editor.elements.reference.setCustomValidity(""));
    editor.elements.kind.addEventListener("change", () => editor.elements.reference.setCustomValidity(""));
  }

  function editInvoicePayment(invoice, entry) {
    if (!invoice) return;
    const remaining = invoice.amount - settledAmount(invoice, "9999-12-31", entry);
    if (remaining <= 0) return;
    const { start, end } = seasonDates();
    const earliest = invoice.date > start ? invoice.date : start;
    const proposed = defaultDate();
    const date = entry?.date ?? (proposed < earliest ? earliest : proposed);
    const fields = `<p class="meeting-meta">${escapeHtml(invoice.reference)} · ${escapeHtml(invoice.party)}<br>
      Montant disponible pour ce règlement <strong>${money(remaining)}</strong></p>
      ${inputField("Date du règlement", "date", date, `type="date" min="${earliest}" max="${end}" required`)}
      ${selectField("Compte", "account", choices(accounts, entry?.account))}
      ${amountField("Montant du règlement (€)", "amount", entry?.amount ?? remaining, 0.01)}
      ${inputField("Référence du règlement", "reference", entry?.reference, "maxlength=100")}`;
    openModuleDialog(entry ? "Modifier le règlement" : "Enregistrer un règlement", fields, (data, form) => {
      const amount = cents(data.amount);
      if (amount > remaining) return invalidInput(form.elements.amount, `Le montant disponible est de ${money(remaining)}.`);
      const sameBankMovement = data.account === "bank" && entry?.account === "bank" &&
        entry.date === data.date && entry.amount === amount;
      saveItem(clubYear().entries, {
        id: entry?.id ?? newId(), invoiceId: invoice.id, date: data.date, kind: invoice.kind,
        account: data.account, amount, category: invoice.category,
        label: `Règlement ${invoice.reference} · ${invoice.party}`, reference: data.reference.trim(),
        cleared: Boolean(sameBankMovement && entry.cleared)
      });
      return "Règlement enregistré dans la trésorerie et les écritures.";
    });
  }

  function accountingMovements() {
    const { start } = seasonDates();
    const year = clubYear();
    const movements = [];
    const add = (journal, id, date, label, reference, debit, credit, amount) => {
      if (amount === 0) return;
      movements.push({ journal, id, date, label, reference, debit, credit, amount });
    };

    for (const [key, amount] of Object.entries(year.opening)) {
      const bank = bankAccounts[key];
      const contra = "890";
      add("AN", `AN-${key}`, start, `Solde d’ouverture · ${accounts[key]}`, "",
        amount >= 0 ? bank : contra, amount >= 0 ? contra : bank, Math.abs(amount));
    }

    for (const invoice of invoicesForSeason()) {
      const income = invoice.kind === "income";
      const carried = invoice.date < start;
      const other = carried ? "890" : categoryAccounts[invoice.category];
      const thirdParty = invoice.expenseId ? "467" : income ? "411" : "401";
      const amount = carried ? invoice.amount - settledAmount(invoice, previousClosing()) : invoice.amount;
      const journal = carried ? "AN" : income ? "VE" : "AC";
      add(journal, `${journal}-${invoice.id}`, carried ? start : invoice.date,
        `${carried ? "Report · " : ""}${invoice.label} · ${invoice.party}`, invoice.reference,
        income ? thirdParty : other, income ? other : thirdParty, amount);
    }

    for (const entry of year.entries) {
      const income = entry.kind === "income";
      const account = bankAccounts[entry.account];
      let contra = categoryAccounts[entry.category];
      if (entry.transferId) contra = "58";
      else if (entry.invoiceId) contra = findInvoice(entry.invoiceId)?.expenseId ? "467" : income ? "411" : "401";
      const journal = entry.account === "bank" ? "BQ" : "CA";
      add(journal, `${journal}-${entry.id}`, entry.date, entry.label, entry.reference,
        income ? account : contra, income ? contra : account, entry.amount);
    }

    return movements.sort((a, b) => a.date.localeCompare(b.date) ||
      (a.journal !== "AN") - (b.journal !== "AN") || a.journal.localeCompare(b.journal));
  }

  function accountingLines(movements) {
    return movements.flatMap(move => [
      { ...move, account: move.debit, debit: move.amount, credit: 0 },
      { ...move, account: move.credit, debit: 0, credit: move.amount }
    ]);
  }

  function trialBalance(lines) {
    const balances = new Map();
    for (const line of lines) {
      const balance = balances.get(line.account) ?? { code: line.account, debit: 0, credit: 0 };
      balance.debit += line.debit;
      balance.credit += line.credit;
      balances.set(line.account, balance);
    }
    return [...balances.values()].sort((a, b) => a.code.localeCompare(b.code));
  }

  function balanceSummary(balances) {
    return balances.reduce((summary, item) => {
      const net = item.debit - item.credit;
      summary.debit += item.debit;
      summary.credit += item.credit;
      summary.debitBalance += Math.max(net, 0);
      summary.creditBalance += Math.max(-net, 0);
      if (item.code.startsWith("6")) summary.expenses += net;
      if (item.code.startsWith("7")) summary.income -= net;
      return summary;
    }, { debit: 0, credit: 0, debitBalance: 0, creditBalance: 0, expenses: 0, income: 0 });
  }

  function filteredAccountingLines(lines) {
    return accountingAccount ? lines.filter(line => line.account === accountingAccount) : lines;
  }

  function accountingPage() {
    const lines = accountingLines(accountingMovements());

  function balanceTable(balances, summary) {
    const columns = [["Compte"], ["Intitulé"], ["Mouvements débit", true], ["Mouvements crédit", true],
      ["Solde débiteur", true], ["Solde créditeur", true]];
    const rows = balances.map(({ code, debit, credit }) =>
      `<tr><td>${code}</td><td class="label-cell">${accountNames[code]}</td>${amountCell(debit)}${amountCell(credit)}
      ${amountCell(Math.max(debit - credit, 0))}${amountCell(Math.max(credit - debit, 0))}</tr>`).join("");
    const footer = `<tfoot><tr><td colspan="2">Total</td>${amountCell(summary.debit)}${amountCell(summary.credit)}
      ${amountCell(summary.debitBalance)}${amountCell(summary.creditBalance)}</tr></tfoot>`;
    return dataTable(columns, rows, "Balance des comptes", footer);
  }

  function accountingTable(lines) {
    const columns = [["Date"], ["Journal"], ["Libellé"], ["Compte"], ["Débit", true], ["Crédit", true]];
    const rows = lines.map((line, index) => {
      const previous = lines[index - 1];
      const groupStart = line.id !== previous?.id;
      const groupEnd = line.id !== lines[index + 1]?.id;
      const reference = line.reference ? `<span class="secondary-value">Pièce ${escapeHtml(line.reference)}</span>` : "";
      return `<tr${groupEnd ? ' class="account-line-end"' : ""}>
        <td>${groupStart ? dateLabel(line.date) : `<span class="visually-hidden">${dateLabel(line.date)}</span>`}</td>
        <td title="${movementNames[line.journal]}">${line.journal}</td>
        <td class="label-cell">${groupStart ? `${escapeHtml(line.label)}${reference}` : `<span class="visually-hidden">${escapeHtml(line.label)}</span>`}</td>
        <td>${line.account}<span class="secondary-value">${accountNames[line.account]}</span></td>
        ${line.debit ? amountCell(line.debit) : '<td class="numeric">—</td>'}
        ${line.credit ? amountCell(line.credit) : '<td class="numeric">—</td>'}
      </tr>`;
    }).join("");
    return dataTable(columns, rows, "Écritures au débit et au crédit");
  }

  const receiptTypes = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" };

  function receiptField(required = false) {
    return `<label class="field file-field">Justificatif
      <input name="receipt" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"${required ? " required" : ""}>
      <small>PDF, JPEG, PNG ou WebP · 1 Mo maximum</small></label>`;
  }

  async function readReceipt(file, input) {
    const suffix = file.name.split(".").pop().toLowerCase();
    const type = receiptTypes[suffix];
    if (!type || file.size === 0 || file.size > 1024 * 1024) {
      invalidInput(input, "Choisis un PDF ou une image de 1 Mo maximum.");
      return null;
    }
    const bytes = new Uint8Array(await file.arrayBuffer());
    let raw = "";
    for (let index = 0; index < bytes.length; index += 8192) {
      raw += String.fromCharCode(...bytes.subarray(index, index + 8192));
    }
    return { name: file.name, type, data: btoa(raw) };
  }

  function expenseRecords(year = clubYear()) {
    return year.expenses ?? [];
  }

  function receiptTarget(key) {
    const [type, id] = key.split(":");
    for (const [year, data] of Object.entries(bureau)) {
      if (type !== "invoice" && year !== season.value) continue;
      const items = type === "entry" ? data.entries : type === "expense" ? expenseRecords(data) : data.invoices ?? [];
      const item = items.find(row => row.id === id);
      if (!item) continue;
      const source = type === "invoice" && item.expenseId ?
        expenseRecords(data).find(row => row.id === item.expenseId) : item;
      return { year, item: source || item };
    }
    return null;
  }

  function receiptActions(type, id) {
    const key = `${type}:${id}`;
    const target = receiptTarget(key);
    if (!target) return "";
    const download = target.item.receipt ? action("Pièce", "receipt-download", key) : "";
    const attach = !lockedFinanceYear(target.year) && !target.item.receipt && role.value === "treasurer" ?
      action("Joindre une pièce", "receipt", key) : "";
    return download + attach;
  }

  function persistReceiptChange(undo) {
    if (remote) return;
    try {
      localStorage.setItem(moduleKey, JSON.stringify(bureau));
    } catch {
      undo();
      throw new Error("L’espace de stockage du navigateur est plein ou inaccessible. Essaie un fichier plus léger.");
    }
  }

  function attachReceipt(key) {
    const target = receiptTarget(key);
    if (!target || lockedFinanceYear(target.year)) return;
    openModuleDialog("Joindre un justificatif", receiptField(true), async (data, editor) => {
      const receipt = await readReceipt(data.receipt, editor.elements.receipt);
      if (!receipt) return "";
      const previous = target.item.receipt;
      target.item.receipt = receipt;
      persistReceiptChange(() => { target.item.receipt = previous; });
      return "Justificatif ajouté.";
    });
  }

  async function downloadReceipt(key) {
    const receipt = receiptTarget(key)?.item.receipt;
    if (!receipt) return;
    if (remote && receipt.id) {
      try {
        const response = await fetch(`api.php?role=${encodeURIComponent(remote.role)}&attachment=${encodeURIComponent(receipt.id)}`,
          { cache: "no-store" });
        if (!response.ok) throw new Error();
        const data = await response.blob();
        downloadFile(receipt.name, [data], receipt.type);
      } catch {
        notify("Téléchargement indisponible. Actualise la page et réessaie.");
      }
      return;
    }
    const bytes = Uint8Array.from(atob(receipt.data), character => character.charCodeAt(0));
    downloadFile(receipt.name, [bytes], receipt.type);
  }

  function expenseClaimsPage() {

      const canReview = open && role.value === "treasurer";
      const controls = (open && (!remote || role.value === "treasurer" || expense.submittedBy === remote.userId)
        ? action("Modifier", "expense", expense.id) : "") +
        (canReview ? action("Examiner", "expense-review", expense.id, "primary") : "");
      const details = [expense.analysis.team, expense.analysis.event, expense.analysis.grant].filter(Boolean).join(" · ");
      return `<tr><td>${dateLabel(expense.date)}</td><td class="label-cell"><strong>${escapeHtml(expense.label)}</strong>
