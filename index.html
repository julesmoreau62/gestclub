  };
  const accountNames = {
    401: "Fournisseurs", 411: "Clients", 467: "Autres comptes débiteurs ou créditeurs", 512: "Banque", 53: "Caisse", 58: "Virements internes",
    606: "Achats non stockés", 613: "Locations", 616: "Primes d’assurances", 62: "Autres services extérieurs",
    625: "Déplacements et réceptions", 628: "Charges externes diverses", 65: "Autres charges de gestion courante",
    70: "Ventes et prestations", 706: "Prestations de services", 741: "Subventions d’exploitation",
    75: "Autres produits de gestion courante", 754: "Ressources liées à la générosité du public", 756: "Cotisations",
    890: "Contrepartie d’ouverture"
  };
  const movementNames = { AN: "Ouverture", AC: "Achats", VE: "Ventes", BQ: "Banque", CA: "Caisse" };
  const invoiceFilters = { kind: "", status: "" };
  let accountingAccount = "";

  function findInvoice(id) {
    return allInvoices().find(invoice => invoice.id === id);
  }

  function allInvoices() {
    return Object.values(bureau).flatMap(year => year.invoices ?? []);
  }

  function settledAmount(invoice, until = "9999-12-31", except = null) {
    return Object.values(bureau).reduce((total, year) => total + year.entries
      .filter(entry => entry.invoiceId === invoice.id && entry.date <= until && entry !== except)
      .reduce((sum, entry) => sum + entry.amount, 0), 0);
  }

  function invoicesForSeason() {
    const { start, end } = seasonDates();
    const today = todayIso();
    const comparison = today < end ? today : end;
    return allInvoices().filter(invoice => invoice.date <= end &&
      (invoice.date >= start || settledAmount(invoice, previousClosing()) < invoice.amount))
      .map(invoice => {
        const paid = settledAmount(invoice, end);
        const remaining = invoice.amount - paid;
        const status = remaining === 0 ? "Réglée" : paid === 0 ? "À régler" : "Partielle";
        const overdue = invoice.due < comparison && settledAmount(invoice, comparison) < invoice.amount;
        return { ...invoice, paid, remaining, status, overdue };
      }).sort((a, b) => a.due.localeCompare(b.due));
  }

  function previousClosing() {
    return `${season.value}-08-31`;
  }

  function invoiceTotals() {
    return invoicesForSeason().reduce((totals, invoice) => {
      totals[invoice.kind] += invoice.remaining;
      if (invoice.overdue) totals.overdue += 1;
      return totals;
    }, { income: 0, expense: 0, overdue: 0 });
  }

  function invoiceSummary() {
    const totals = invoiceTotals();
    return `${money(totals.expense)} à payer · ${money(totals.income)} à encaisser`;
  }

  function visibleInvoices() {
    return invoicesForSeason().filter(invoice =>
      (!invoiceFilters.kind || invoice.kind === invoiceFilters.kind) &&
      (!invoiceFilters.status || (invoiceFilters.status === "overdue" ? invoice.overdue :
        invoiceFilters.status === "closed" ? !invoice.remaining : invoice.remaining > 0)));
  }

  function invoicesPage() {
    const totals = invoiceTotals();
    const rows = visibleInvoices().map(invoice => {
      const status = badge(invoice.status, invoice.remaining > 0);
      const late = invoice.overdue ? '<span class="secondary-value negative">Échéance dépassée</span>' : "";
      const carry = invoice.date < seasonDates().start ? '<span class="secondary-value">Report de la saison précédente</span>' : "";
      const payment = invoice.remaining > 0 && settledAmount(invoice) < invoice.amount ?
        action(invoice.kind === "expense" ? "Régler" : "Encaisser", "invoice-payment", invoice.id) : "";
      const edit = invoice.date >= seasonDates().start && !invoice.expenseId ?
        action("Modifier", "invoice", invoice.id) : "";
      return `<tr><td class="label-cell"><strong>${escapeHtml(invoice.reference)}</strong>
        <span class="secondary-value">${escapeHtml(invoice.label)} · ${dateLabel(invoice.date)}</span>${carry}</td>
        <td>${escapeHtml(invoice.party)}<span class="secondary-value">${invoiceKinds[invoice.kind]}</span></td>
        <td>${dateLabel(invoice.due)}</td>${amountCell(invoice.amount)}${amountCell(invoice.paid)}${amountCell(invoice.remaining)}
        <td>${status}${late}</td><td><span class="row-actions">${edit}${payment}${receiptActions("invoice", invoice.id)}</span></td></tr>`;
    }).join("");
    const columns = [["Facture"], ["Tiers"], ["Échéance"], ["Montant", true], ["Réglé", true], ["Reste", true], ["Statut"], ["Actions"]];
    return `<p class="page-description">Enregistre les factures à leur date d’émission. Le journal de trésorerie se met à jour à chaque règlement.</p>
      <section class="overview money-overview" aria-label="Échéances">
        ${stat("À payer", money(totals.expense), "invoices", "", true)}
        ${stat("À encaisser", money(totals.income), "payments")}
        ${stat("Échéances dépassées", totals.overdue, "meetings")}
      </section>
      <section class="panel"><header class="panel-header"><h2>Factures de la saison</h2><div class="actions">
      ${action("Export CSV", "export-invoices", "", "outline", "download")}
      ${action("Nouvelle facture", "invoice", "", "primary", "plus")}</div></header>
      <div class="filters">
        <select id="invoice-kind" aria-label="Type de facture">${option("", "Tous les tiers", invoiceFilters.kind)}${choices(invoiceKinds, invoiceFilters.kind)}</select>
        <select id="invoice-status" aria-label="Statut des factures">
          ${choices({ "": "Tous les statuts", open: "Restent à régler", overdue: "En retard", closed: "Réglées" }, invoiceFilters.status)}
        </select>
      </div>${dataTable(columns, rows, "Factures de la saison")}</section>`;
  }

  function invalidInput(input, message) {
    input.setCustomValidity(message);
    input.reportValidity();
    return "";
  }

  function editInvoice(id) {
    const existing = id ? findInvoice(id) : null;
    if (existing?.expenseId) return;
    const paid = existing ? settledAmount(existing) : 0;
    const kind = existing?.kind ?? "expense";
    const directions = paid ? { [kind]: invoiceKinds[kind] } : invoiceKinds;
    const validCategories = paid ? [existing.category] : categories[kind];
    const issued = existing?.date || defaultDate();
    const dateControl = paid
      ? inputField("Date de facture", "date", issued, 'type="date" readonly required')
      : dateField("Date de facture", issued);
    const lockIdentity = paid ? "readonly" : "";
    const fields = `<div class="form-row">${selectField("Type de facture", "kind", choices(directions, kind))}
      ${inputField("Numéro de facture", "reference", existing?.reference, `maxlength=80 required ${lockIdentity}`)}</div>
      ${inputField("Fournisseur ou client", "party", existing?.party, `maxlength=120 required ${lockIdentity}`)}
      ${inputField("Libellé", "label", existing?.label, "maxlength=120 required")}
      <div class="form-row">${dateControl}
      ${inputField("Date d’échéance", "due", existing?.due ?? issued, `type="date" min="${issued}" max="9999-12-31" required`)}</div>
      ${selectField("Catégorie", "category", optionList(validCategories, existing?.category))}
      ${amountField("Montant total (€)", "amount", existing?.amount, 0.01)}
      ${analysisFields(existing?.analysis)}
      ${paid ? `<p class="meeting-meta">${money(paid)} déjà réglés sur cette facture.</p>` : ""}`;
    const editor = openModuleDialog(existing ? "Modifier la facture" : "Nouvelle facture", fields, (data, form) => {
      const amount = cents(data.amount);
      if (data.due < data.date) return invalidInput(form.elements.due, "L’échéance doit suivre la date de la facture ou tomber le même jour.");
      if (amount < paid) return invalidInput(form.elements.amount, `Le montant doit couvrir les ${money(paid)} déjà réglés.`);
      const reference = data.reference.trim();
      const party = data.party.trim();
      const duplicate = allInvoices().some(invoice => invoice.id !== id && invoice.kind === data.kind &&
        normalize(invoice.party) === normalize(party) && normalize(invoice.reference) === normalize(reference));
      if (duplicate) return invalidInput(form.elements.reference, "Une facture de ce tiers porte déjà ce numéro.");
      clubYear().invoices ??= [];
      const { kind, date, due } = data;
      saveItem(clubYear().invoices, { ...existing, kind, date, due, id: id || newId(),
        amount, party, reference, label: data.label.trim(), analysis: readAnalysis(data) });
      invoiceFilters.kind = "";
      invoiceFilters.status = "";
      return existing ? "Facture modifiée." : "Facture enregistrée.";
    });
    editor.elements.kind.addEventListener("change", () => {
      editor.elements.category.innerHTML = optionList(categories[editor.elements.kind.value]);
    });
    editor.elements.date.addEventListener("input", () => {
      const due = editor.elements.due;
      due.min = editor.elements.date.value;
      due.setCustomValidity("");
      if (due.value < due.min) due.value = due.min;
    });
    editor.elements.party.addEventListener("input", () => editor.elements.reference.setCustomValidity(""));
    editor.elements.kind.addEventListener("change", () => editor.elements.reference.setCustomValidity(""));
  }

  function editInvoicePayment(invoice, entry) {
    if (!invoice) return;
    const remaining = invoice.amount - settledAmount(invoice, "9999-12-31", entry);
    if (remaining <= 0) return;
    const { start, end } = seasonDates();
    const earliest = invoice.date > start ? invoice.date : start;
    const proposed = defaultDate();
    const date = entry?.date ?? (proposed < earliest ? earliest : proposed);
    const fields = `<p class="meeting-meta">${escapeHtml(invoice.reference)} · ${escapeHtml(invoice.party)}<br>
      Montant disponible pour ce règlement <strong>${money(remaining)}</strong></p>
      ${inputField("Date du règlement", "date", date, `type="date" min="${earliest}" max="${end}" required`)}
      ${selectField("Compte", "account", choices(accounts, entry?.account))}
      ${amountField("Montant du règlement (€)", "amount", entry?.amount ?? remaining, 0.01)}
      ${inputField("Référence du règlement", "reference", entry?.reference, "maxlength=100")}`;
    openModuleDialog(entry ? "Modifier le règlement" : "Enregistrer un règlement", fields, (data, form) => {
      const amount = cents(data.amount);
      if (amount > remaining) return invalidInput(form.elements.amount, `Le montant disponible est de ${money(remaining)}.`);
      const sameBankMovement = data.account === "bank" && entry?.account === "bank" &&
        entry.date === data.date && entry.amount === amount;
      saveItem(clubYear().entries, {
        id: entry?.id ?? newId(), invoiceId: invoice.id, date: data.date, kind: invoice.kind,
        account: data.account, amount, category: invoice.category,
        label: `Règlement ${invoice.reference} · ${invoice.party}`, reference: data.reference.trim(),
        cleared: Boolean(sameBankMovement && entry.cleared)
      });
      return "Règlement enregistré dans la trésorerie et les écritures.";
    });
  }

  function exportInvoices() {
    downloadCsv("factures", [
      ["Type", "Numéro", "Tiers", "Libellé", "Émission", "Échéance", "Montant EUR", "Réglé EUR", "Reste EUR", "Statut"],
      ...visibleInvoices().map(row => [invoiceKinds[row.kind], row.reference, row.party, row.label,
        row.date, row.due, asCsvEuros(row.amount), asCsvEuros(row.paid), asCsvEuros(row.remaining), row.status])
    ]);
  }

  function accountingMovements() {
    const { start } = seasonDates();
    const year = clubYear();
    const movements = [];
    const add = (journal, id, date, label, reference, debit, credit, amount) => {
      if (amount === 0) return;
      movements.push({ journal, id, date, label, reference, debit, credit, amount });
    };

    for (const [key, amount] of Object.entries(year.opening)) {
      const bank = bankAccounts[key];
      const contra = "890";
      add("AN", `AN-${key}`, start, `Solde d’ouverture · ${accounts[key]}`, "",
        amount >= 0 ? bank : contra, amount >= 0 ? contra : bank, Math.abs(amount));
    }

    for (const invoice of invoicesForSeason()) {
      const income = invoice.kind === "income";
      const carried = invoice.date < start;
      const other = carried ? "890" : categoryAccounts[invoice.category];
      const thirdParty = invoice.expenseId ? "467" : income ? "411" : "401";
      const amount = carried ? invoice.amount - settledAmount(invoice, previousClosing()) : invoice.amount;
      const journal = carried ? "AN" : income ? "VE" : "AC";
      add(journal, `${journal}-${invoice.id}`, carried ? start : invoice.date,
        `${carried ? "Report · " : ""}${invoice.label} · ${invoice.party}`, invoice.reference,
        income ? thirdParty : other, income ? other : thirdParty, amount);
    }

    for (const entry of year.entries) {
      const income = entry.kind === "income";
      const account = bankAccounts[entry.account];
      let contra = categoryAccounts[entry.category];
      if (entry.transferId) contra = "58";
      else if (entry.invoiceId) contra = findInvoice(entry.invoiceId)?.expenseId ? "467" : income ? "411" : "401";
      const journal = entry.account === "bank" ? "BQ" : "CA";
      add(journal, `${journal}-${entry.id}`, entry.date, entry.label, entry.reference,
        income ? account : contra, income ? contra : account, entry.amount);
    }

    return movements.sort((a, b) => a.date.localeCompare(b.date) ||
      (a.journal !== "AN") - (b.journal !== "AN") || a.journal.localeCompare(b.journal));
  }

  function accountingLines(movements) {
    return movements.flatMap(move => [
      { ...move, account: move.debit, debit: move.amount, credit: 0 },
      { ...move, account: move.credit, debit: 0, credit: move.amount }
    ]);
  }

  function trialBalance(lines) {
    const balances = new Map();
    for (const line of lines) {
      const balance = balances.get(line.account) ?? { code: line.account, debit: 0, credit: 0 };
      balance.debit += line.debit;
      balance.credit += line.credit;
      balances.set(line.account, balance);
    }
    return [...balances.values()].sort((a, b) => a.code.localeCompare(b.code));
  }

  function balanceSummary(balances) {
    return balances.reduce((summary, item) => {
      const net = item.debit - item.credit;
      summary.debit += item.debit;
      summary.credit += item.credit;
      summary.debitBalance += Math.max(net, 0);
      summary.creditBalance += Math.max(-net, 0);
      if (item.code.startsWith("6")) summary.expenses += net;
      if (item.code.startsWith("7")) summary.income -= net;
      return summary;
    }, { debit: 0, credit: 0, debitBalance: 0, creditBalance: 0, expenses: 0, income: 0 });
  }

  function filteredAccountingLines(lines) {
    return accountingAccount ? lines.filter(line => line.account === accountingAccount) : lines;
  }

  function accountingPage() {
    const lines = accountingLines(accountingMovements());
    const balances = trialBalance(lines);
    const summary = balanceSummary(balances);
    const visible = filteredAccountingLines(lines);
    const accountOptions = balances.map(item => option(item.code, `${item.code} · ${accountNames[item.code]}`, accountingAccount)).join("");
    return `<p class="page-description">Les écritures sont générées à partir du journal de trésorerie et des factures saisies. Les comptes utilisés constituent un plan simplifié.</p>
      <section class="overview money-overview" aria-label="Charges et produits enregistrés">
        ${stat("Produits enregistrés", money(summary.income), "payments")}
        ${stat("Charges enregistrées", money(summary.expenses), "invoices", "", true)}
        ${stat("Solde produits − charges", money(summary.income - summary.expenses), "accounting")}
      </section>
      <div class="stack">
        <section class="panel" aria-labelledby="trial-balance-title">
          <header class="panel-header"><div><h2 id="trial-balance-title">Balance des comptes</h2>
          <span class="account-period">${badge(summary.debit === summary.credit ? "Total débit = total crédit" : "Écart à vérifier", summary.debit !== summary.credit)}</span>
          </div>${action("Exporter la balance", "export-trial-balance", "", "outline", "download")}</header>
          ${balanceTable(balances, summary)}
        </section>
        <section class="panel" id="accounting-entries" aria-labelledby="accounting-title">
          <header class="panel-header"><h2 id="accounting-title">Journal en partie double</h2>
          ${action("Exporter les écritures", "export-accounting", "", "outline", "download")}</header>
          <div class="filters"><select id="accounting-account" aria-label="Compte comptable">
            ${option("", "Tous les comptes", accountingAccount)}${accountOptions}
          </select></div>
          ${accountingTable(visible)}
        </section>
      </div>`;
  }

  function balanceTable(balances, summary) {
    const columns = [["Compte"], ["Intitulé"], ["Mouvements débit", true], ["Mouvements crédit", true],
      ["Solde débiteur", true], ["Solde créditeur", true]];
    const rows = balances.map(({ code, debit, credit }) =>
      `<tr><td>${code}</td><td class="label-cell">${accountNames[code]}</td>${amountCell(debit)}${amountCell(credit)}
      ${amountCell(Math.max(debit - credit, 0))}${amountCell(Math.max(credit - debit, 0))}</tr>`).join("");
    const footer = `<tfoot><tr><td colspan="2">Total</td>${amountCell(summary.debit)}${amountCell(summary.credit)}
      ${amountCell(summary.debitBalance)}${amountCell(summary.creditBalance)}</tr></tfoot>`;
    return dataTable(columns, rows, "Balance des comptes", footer);
  }

  function accountingTable(lines) {
    const columns = [["Date"], ["Journal"], ["Libellé"], ["Compte"], ["Débit", true], ["Crédit", true]];
    const rows = lines.map((line, index) => {
      const previous = lines[index - 1];
      const groupStart = line.id !== previous?.id;
      const groupEnd = line.id !== lines[index + 1]?.id;
      const reference = line.reference ? `<span class="secondary-value">Pièce ${escapeHtml(line.reference)}</span>` : "";
      return `<tr${groupEnd ? ' class="account-line-end"' : ""}>
        <td>${groupStart ? dateLabel(line.date) : `<span class="visually-hidden">${dateLabel(line.date)}</span>`}</td>
        <td title="${movementNames[line.journal]}">${line.journal}</td>
        <td class="label-cell">${groupStart ? `${escapeHtml(line.label)}${reference}` : `<span class="visually-hidden">${escapeHtml(line.label)}</span>`}</td>
        <td>${line.account}<span class="secondary-value">${accountNames[line.account]}</span></td>
        ${line.debit ? amountCell(line.debit) : '<td class="numeric">—</td>'}
        ${line.credit ? amountCell(line.credit) : '<td class="numeric">—</td>'}
      </tr>`;
    }).join("");
    return dataTable(columns, rows, "Écritures au débit et au crédit");
  }

  function exportAccounting() {
    const lines = filteredAccountingLines(accountingLines(accountingMovements()));
    downloadCsv("ecritures", [
      ["Date", "Journal", "Identifiant", "Libellé", "Pièce", "Compte", "Intitulé du compte", "Débit EUR", "Crédit EUR"],
      ...lines.map(line => [line.date, line.journal, line.id, line.label, line.reference, line.account,
        accountNames[line.account], asCsvEuros(line.debit), asCsvEuros(line.credit)])
    ]);
  }

  function exportTrialBalance() {
    const balances = trialBalance(accountingLines(accountingMovements()));
    downloadCsv("balance", [
      ["Compte", "Intitulé", "Mouvements débit EUR", "Mouvements crédit EUR", "Solde débiteur EUR", "Solde créditeur EUR"],
      ...balances.map(({ code, debit, credit }) => [code, accountNames[code], asCsvEuros(debit), asCsvEuros(credit),
        asCsvEuros(Math.max(debit - credit, 0)), asCsvEuros(Math.max(credit - debit, 0))])
    ]);
  }

  main.addEventListener("change", event => {
    const target = event.target;
    if (target.id === "invoice-kind") invoiceFilters.kind = target.value;
    else if (target.id === "invoice-status") invoiceFilters.status = target.value;
    else if (target.id === "accounting-account") accountingAccount = target.value;
    else return;
    render();
    document.getElementById(target.id)?.focus();

  const financeWrites = new Set([
    "entry", "invoice", "invoice-payment", "invoice-payment-edit", "dues", "transfer", "opening", "plan", "clear",
    "bank-import", "bank-match", "bank-unmatch", "expense", "expense-review", "receipt", "close-finance", "helloasso-config"
  ]);

  function lockedFinanceYear(year = season.value) {
    return Object.keys(bureau).sort().find(candidate => candidate >= year && bureau[candidate].closedAt);
  }

  function financeLockMessage() {
    const locked = lockedFinanceYear();
    return locked === season.value ? "Cette saison est clôturée. Les écritures sont en lecture seule." :
      `Les écritures sont en lecture seule depuis la clôture de la saison ${locked}–${Number(locked) + 1}.`;
  }

  function analysisFields(analysis = {}) {
    return `<div class="form-row">
      ${selectField("Équipe", "analysisTeam", option("", "Sans équipe", analysis.team || "") + optionList(teams, analysis.team))}
      ${inputField("Événement ou projet", "analysisEvent", analysis.event, "maxlength=100")}</div>
      ${inputField("Subvention associée", "analysisGrant", analysis.grant, "maxlength=100")}`;
  }

  function readAnalysis(data) {
    return { team: data.analysisTeam, event: data.analysisEvent.trim(), grant: data.analysisGrant.trim() };
  }

  function analysisPanel() {
    const labels = { team: "Équipe", event: "Événement ou projet", grant: "Subvention" };
    const charges = [
      ...clubYear().entries.filter(entry => entry.kind === "expense" && !entry.invoiceId && !entry.transferId),
      ...(clubYear().invoices ?? []).filter(invoice => invoice.kind === "expense")
    ];
    const rows = Object.entries(labels).flatMap(([key, label]) => {
      const groups = new Map();
      for (const charge of charges) {
        const name = charge.analysis?.[key] || "Sans affectation";
        const identity = normalize(name);
        const line = groups.get(identity) || { name, amount: 0 };
        line.amount += charge.amount;
        groups.set(identity, line);
      }
      return [...groups.values()].sort((a, b) => b.amount - a.amount).map(group =>
        `<tr><td>${label}</td><td class="label-cell">${escapeHtml(group.name)}</td>${amountCell(group.amount)}</tr>`);
    });
    return `<section class="panel"><header class="panel-header"><h2>Dépenses par activité</h2></header>
      <p class="panel-note">Ce suivi inclut les factures dès leur saisie. Une dépense peut figurer dans plusieurs axes. Chaque axe se lit séparément.</p>
      ${dataTable([["Axe"], ["Affectation"], ["Charges enregistrées", true]], rows.join(""), "Dépenses par activité")}</section>`;
  }

  const receiptTypes = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" };

  function receiptField(required = false) {
    return `<label class="field file-field">Justificatif
      <input name="receipt" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"${required ? " required" : ""}>
      <small>PDF, JPEG, PNG ou WebP · 1 Mo maximum</small></label>`;
  }

  async function readReceipt(file, input) {
    const suffix = file.name.split(".").pop().toLowerCase();
    const type = receiptTypes[suffix];
    if (!type || file.size === 0 || file.size > 1024 * 1024) {
      invalidInput(input, "Choisis un PDF ou une image de 1 Mo maximum.");
      return null;
    }
    const bytes = new Uint8Array(await file.arrayBuffer());
    let raw = "";
    for (let index = 0; index < bytes.length; index += 8192) {
      raw += String.fromCharCode(...bytes.subarray(index, index + 8192));
    }
    return { name: file.name, type, data: btoa(raw) };
  }

  function expenseRecords(year = clubYear()) {
    return year.expenses ?? [];
  }

  function receiptTarget(key) {
    const [type, id] = key.split(":");
    for (const [year, data] of Object.entries(bureau)) {
      if (type !== "invoice" && year !== season.value) continue;
      const items = type === "entry" ? data.entries : type === "expense" ? expenseRecords(data) : data.invoices ?? [];
      const item = items.find(row => row.id === id);
      if (!item) continue;
      const source = type === "invoice" && item.expenseId ?
        expenseRecords(data).find(row => row.id === item.expenseId) : item;
      return { year, item: source || item };
    }
    return null;
  }

  function receiptActions(type, id) {
    const key = `${type}:${id}`;
    const target = receiptTarget(key);
    if (!target) return "";
    const download = target.item.receipt ? action("Pièce", "receipt-download", key) : "";
    const attach = !lockedFinanceYear(target.year) && !target.item.receipt && activeRole === "treasurer" ?
      action("Joindre une pièce", "receipt", key) : "";
    return download + attach;
  }

  function persistReceiptChange(undo) {
    if (remote) return;
    try {

    if (!receipt) return;

      try {
        const response = await fetch(`api.php?role=${encodeURIComponent(remote.role)}&attachment=${encodeURIComponent(receipt.id)}`,
          { cache: "no-store" });

        downloadFile(receipt.name, [data], receipt.type);

  }

  function csvRows(source, delimiter) {
    const rows = [];
    let row = [];
    let field = "";
    let quoted = false;
    for (let index = 0; index < source.length; index += 1) {
      const character = source[index];
      if (character === '"') {
        if (quoted && source[index + 1] === '"') {
          field += '"';
          index += 1;
        } else {
          quoted = !quoted;
        }
      } else if (!quoted && character === delimiter) {
        row.push(field);
        field = "";
      } else if (!quoted && (character === "\r" || character === "\n")) {
        row.push(field);
        if (row.some(cell => cell.trim())) rows.push(row);
        row = [];
        field = "";
        if (character === "\r" && source[index + 1] === "\n") index += 1;
      } else {
        field += character;
      }
    }
    if (quoted) throw new Error("Un champ du CSV contient des guillemets non fermés.");
    row.push(field);
    if (row.some(cell => cell.trim())) rows.push(row);
    return rows;
  }

  function statementDate(value) {
    const parts = value.trim().match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
    const date = parts ? `${parts[3]}-${parts[2].padStart(2, "0")}-${parts[1].padStart(2, "0")}` : value.trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return "";
    const check = new Date(`${date}T00:00:00Z`);
    return Number.isFinite(check.valueOf()) && check.toISOString().startsWith(date) ? date : "";
  }

  function statementAmount(value) {
    let number = value.trim().replace(/[\s€]/g, "").replace(/−/g, "-");
    if (!number) return 0;
    if (number.includes(",")) number = number.replace(/\./g, "").replace(",", ".");
    if (!/^[+-]?\d+(?:\.\d{1,2})?$/.test(number)) return NaN;
    const amount = cents(number);
    return Number.isSafeInteger(amount) && Math.abs(amount) <= 99999999900 ? amount : NaN;
  }

  function delimitedFile(content) {
    const source = content.replace(/^\uFEFF/, "").trim();
    const header = source.split(/\r?\n/, 1)[0].replace(/"[^"]*"/g, '""');
    const delimiter = [";", "\t", ","].sort((a, b) => header.split(b).length - header.split(a).length)[0];
    return csvRows(source, delimiter);
  }

  async function readCsvFile(file) {
    const buffer = await file.arrayBuffer();
    const utf8 = new TextDecoder().decode(buffer);
    return utf8.includes("\uFFFD") ? new TextDecoder("windows-1252").decode(buffer) : utf8;
  }

  function parseBankFile(content) {
    const [rawColumns = [], ...data] = delimitedFile(content);
    const columns = rawColumns.map(cell => normalize(cell).replace(/[’']/g, " ").replace(/\s+/g, " ").trim());
    const position = names => names.map(name => columns.indexOf(name)).find(index => index >= 0) ?? -1;
    const dateColumn = position(["date d operation", "date operation", "date de l operation", "date comptable", "date"]);
    const labelColumn = position(["libelle", "libelle operation", "description", "operation"]);
    const amountColumn = position(["montant", "montant signe", "montant eur", "montant (eur)", "montant (€)"]);
    const debitColumn = position(["debit", "debit eur", "debit (eur)", "debit (€)"]);
    const creditColumn = position(["credit", "credit eur", "credit (eur)", "credit (€)"]);
    const idColumn = position(["identifiant", "identifiant bancaire", "id", "id transaction"]);
    const referenceColumn = position(["reference", "reference operation"]);
    if (dateColumn < 0 || labelColumn < 0 || (amountColumn < 0 && (debitColumn < 0 || creditColumn < 0))) {
      throw new Error("Le CSV doit contenir Date, Libellé et Montant, ou les colonnes Débit et Crédit.");
    }
    if (data.length < 1 || data.length > 5000) throw new Error("Le CSV doit contenir entre 1 et 5 000 opérations.");
    const { start, end } = seasonDates();
    const counts = new Map();
    const lines = [];
    let outside = 0;
    for (const [index, cells] of data.entries()) {
      const date = statementDate(cells[dateColumn] || "");
      const label = (cells[labelColumn] || "").trim().replace(/\s+/g, " ");
      const bankId = (cells[idColumn] || "").trim();
      const reference = (cells[referenceColumn] || bankId).trim();
      const amount = amountColumn >= 0 ? statementAmount(cells[amountColumn] || "") :
        Math.abs(statementAmount(cells[creditColumn] || "")) - Math.abs(statementAmount(cells[debitColumn] || ""));
      if (!date || !label || !Number.isFinite(amount) || amount === 0) {
        throw new Error(`Date, libellé ou montant invalide à l’opération ${index + 1} du CSV.`);
      }
      if (date < start || date > end) {
        outside += 1;
        continue;
      }
      const signature = JSON.stringify([date, normalize(label), amount, normalize(reference)]);
      const count = (counts.get(signature) ?? 0) + 1;
      counts.set(signature, count);
      const fingerprint = bankId ? `id:${bankId}` : `line:${signature}:${count}`;
      lines.push({ date, label, amount, reference, fingerprint });
    }
    return { lines, outside };
  }

  function bankLines() { return clubYear().bankLines ?? []; }

  function importBankDialog() {
    const previous = clubYear().statement;
    const fields = `<p class="meeting-meta">Colonnes attendues&nbsp;: Date, Libellé, Montant signé, ou Débit et Crédit. L’identifiant bancaire est facultatif.</p>
      <label class="field">Relevé CSV <input type="file" name="statementCsv" accept=".csv,.tsv,text/csv" required></label>
      <div class="form-row">${dateField("Date du solde du relevé", previous?.date || "", false)}
      ${amountField("Solde du relevé (€)", "balance", previous?.balance, -999999999, false)}</div>`;
    openModuleDialog("Importer un relevé bancaire", fields, async (data, editor) => {
      const file = data.statementCsv;
      if (file.size > 2 * 1024 * 1024) return invalidInput(editor.elements.statementCsv, "Choisis un relevé de 2 Mo maximum.");
      if (Boolean(data.date) !== (data.balance !== "")) {
        notify("Renseigne ensemble la date et le solde du relevé.");
        return "";
      }
      const { lines, outside } = parseBankFile(await readCsvFile(file));
      const saved = bankLines();
      const known = new Set(saved.map(line => line.fingerprint));
      const additions = [];
      for (const line of lines) {
        if (known.has(line.fingerprint)) continue;
        known.add(line.fingerprint);
        additions.push({ id: newId(), ...line });
      }
      clubYear().bankLines = [...saved, ...additions];
      if (data.date && (!previous || previous.date <= data.date)) {
        clubYear().statement = { date: data.date, balance: cents(data.balance) };
      }
      return `${additions.length} ajoutée(s) · ${lines.length - additions.length} déjà importée(s) · ${outside} hors saison.`;
    });
  }

  function signedEntry(entry) { return entry.amount * (entry.kind === "income" ? 1 : -1); }

  function dayDistance(first, second) {
    return Math.abs(Date.parse(first) - Date.parse(second)) / 86400000;
  }

  function bankCandidates(line) {
    return clubYear().entries.filter(entry => entry.account === "bank" && !entry.bankLineId && signedEntry(entry) === line.amount)
      .sort((first, second) => dayDistance(first.date, line.date) - dayDistance(second.date, line.date));
  }

  function matchedBankEntries() {
    return new Map(clubYear().entries.filter(entry => entry.bankLineId).map(entry => [entry.bankLineId, entry]));
  }

  function statementDifference() {
    const { statement, opening, entries } = clubYear();
    if (!statement) return null;
    const imported = new Map(bankLines().map(line => [line.id, line]));
    const expected = entries.filter(entry => entry.account === "bank" && entry.cleared &&
      (imported.get(entry.bankLineId)?.date || entry.date) <= statement.date)
      .reduce((amount, entry) => amount + signedEntry(entry), opening.bank);
    return { ...statement, expected, difference: statement.balance - expected };
  }

  function reconciliationPage() {
    const matched = matchedBankEntries();
    const lines = bankLines();
    const pending = lines.filter(line => !matched.has(line.id)).length;
    const pendingEntries = clubYear().entries.filter(entry => entry.account === "bank" && !entry.cleared).length;
    const difference = statementDifference();
    const rows = [...lines].sort((a, b) => b.date.localeCompare(a.date)).map(line => {
      const entry = matched.get(line.id);
      const candidates = entry ? [] : bankCandidates(line);
      const suggested = candidates[0] && dayDistance(line.date, candidates[0].date) <= 5 ? candidates[0] : null;
      const status = entry ? `Rapprochée · ${entry.label}` : suggested ? `Proposition · ${suggested.label}` : "À examiner";
      const controls = entry ? action("Annuler le rapprochement", "bank-unmatch", line.id) :
        candidates.length ? action("Rapprocher", "bank-match", line.id, "primary") : "";
      return `<tr><td>${dateLabel(line.date)}</td><td class="label-cell"><strong>${escapeHtml(line.label)}</strong>
        <span class="secondary-value">${escapeHtml(line.reference)}</span></td>${amountCell(line.amount, true)}
        <td class="label-cell">${escapeHtml(status)}</td><td>${controls}</td></tr>`;
    });
    const differenceLabel = difference ? money(difference.difference) : "—";
    return `<section class="overview money-overview" aria-label="Indicateurs de rapprochement">
      ${stat("Lignes à examiner", pending, "bank")}
      ${stat("Écritures à pointer", pendingEntries, "ledger")}
      ${stat("Écart avec le relevé", differenceLabel, "accounting", "", true)}
      </section><section class="panel"><header class="panel-header"><h2>Relevé bancaire</h2>
      ${action("Importer un CSV", "bank-import", "", "primary", "plus")}</header>
      <p class="panel-note">Les propositions associent le même montant et des dates proches. Ouvre la ligne pour choisir l’écriture et confirmer.</p>
      ${difference ? `<p class="panel-note">Au ${dateLabel(difference.date)}, relevé à <strong>${money(difference.balance)}</strong> et solde pointé à <strong>${money(difference.expected)}</strong>.</p>` : ""}
      ${dataTable([["Date"], ["Libellé du relevé"], ["Montant", true], ["Correspondance"], ["Actions"]], rows.join(""), "Relevé bancaire importé")}</section>`;
  }

  function matchBankDialog(id) {
    const line = bankLines().find(item => item.id === id);
    if (!line || matchedBankEntries().has(id)) return;
    const candidates = bankCandidates(line);
    if (!candidates.length) return;
    const sameDay = candidates.filter(entry => entry.date === line.date);
    const selected = sameDay.length === 1 ? sameDay[0].id : "";
    const options = option("", "Choisir une écriture", selected) + candidates.map(entry =>
      option(entry.id, `${dateLabel(entry.date)} · ${entry.label}${entry.cleared ? " (déjà pointée)" : ""}`, selected)).join("");
    const fields = `<p class="meeting-meta">${dateLabel(line.date)} · ${escapeHtml(line.label)} · <strong>${money(line.amount)}</strong></p>
      ${selectField("Écriture à rapprocher", "entryId", options)}`;
    openModuleDialog("Confirmer le rapprochement", fields, (data, editor) => {
      const entry = candidates.find(item => item.id === data.entryId && !item.bankLineId);
      if (!entry) return invalidInput(editor.elements.entryId, "Choisis une écriture.");
      entry.wasPointed = entry.cleared;
      entry.cleared = true;
      entry.bankLineId = id;
      return "Rapprochement enregistré.";
    });
  }

  function unmatchBank(id) {
    const entry = matchedBankEntries().get(id);
    if (!entry) return;
    entry.cleared = Boolean(entry.wasPointed);
    delete entry.wasPointed;
    delete entry.bankLineId;
    saveBureau("Rapprochement annulé.");
    render();
  }

  function fileStatus(member) {

  function memberIdentity(member) {
    const clean = part => normalize(part.trim()).replace(/\s+/g, " ");
    return `${clean(member.first)}\u0001${clean(member.last)}`;
  }

  function priorSeason() {
    return String(Number(season.value) - 1);
  }

  function renewalRoster() {
    const previous = records[priorSeason()] || [];
    const current = getMembers();
    const linked = new Map(current.filter(member => member.renewal?.year === priorSeason())
      .map(member => [member.renewal.id, member]));
    const byName = new Map(current.map(member => [memberIdentity(member), member]));
    return previous.map(member => ({ previous: member, current: linked.get(member.id) || byName.get(memberIdentity(member)) }));
  }

  function addMembers(newMembers) {
    const current = getMembers();
    records[season.value] = [...newMembers, ...current];
    if (remote) return;
    try {
      localStorage.setItem(storageKey, JSON.stringify(records));
    } catch (error) {
      records[season.value] = current;
      throw new Error("Le navigateur n’a pas pu enregistrer les adhésions.");
    }
  }

  function renewMembersDialog() {
    const candidates = renewalRoster().filter(item => !item.current).map(item => item.previous);
    const choices = candidates.map(member => `<label><input type="checkbox" name="memberId" value="${escapeHtml(member.id)}">
      ${escapeHtml(`${member.first} ${member.last} · ${member.team}`)}</label>`).join("");
    const fields = selectionFields("Adhérents à reprendre", choices);
    const editor = openModuleDialog("Reprendre des adhérents", fields, (_data, editor) => {
      const selected = new Set(new FormData(editor).getAll("memberId"));
      const known = new Set(getMembers().map(memberIdentity));
      const renewed = [];
      for (const { previous, current } of renewalRoster()) {
        if (current || !selected.has(previous.id) || known.has(memberIdentity(previous))) continue;
        known.add(memberIdentity(previous));
        renewed.push({ id: newId(), first: previous.first, last: previous.last, team: previous.team,
          paid: false, fileStatus: "À vérifier", renewal: { year: priorSeason(), id: previous.id } });
      }
      if (!renewed.length) {
        notify("Sélectionne au moins un adhérent à reprendre.");
        return "";
      }
      addMembers(renewed);
      return renewed.length === 1 ? "Adhésion reprise." : `${renewed.length} adhésions reprises.`;
    }, remote ? saveBureau : notify);
    bindSelectAll(editor);
  }

  function parseMemberImport(content) {
    const [header = [], ...data] = delimitedFile(content);
    const columns = header.map(name => normalize(name.trim()));
    const first = columns.indexOf("prenom");
    const last = columns.indexOf("nom");
    const team = columns.indexOf("equipe");
    if ([first, last, team].includes(-1)) throw new Error("Le CSV doit contenir les colonnes Prénom, Nom et Équipe.");
    if (!data.length || data.length > 1500) throw new Error("Le CSV doit contenir entre 1 et 1 500 adhérents.");
    const known = new Set(getMembers().map(memberIdentity));
    return data.map((cells, index) => {
      const candidate = { first: (cells[first] || "").trim(), last: (cells[last] || "").trim(),
        team: teams.find(name => normalize(name) === normalize((cells[team] || "").trim())) };
      let status = "À importer";
      if (!candidate.first || !candidate.last || candidate.first.length > 60 || candidate.last.length > 60) status = "Prénom ou nom invalide";
      else if (!candidate.team) status = "Équipe inconnue";
      else if (known.has(memberIdentity(candidate))) status = "Doublon possible";
      else known.add(memberIdentity(candidate));
      return { ...candidate, index: index + 1, status };
    });
  }

  function importMembersDialog() {
    let content;
    const fields = `<p class="meeting-meta">Colonnes Prénom, Nom et Équipe. Équipes disponibles&nbsp;: ${teams.join(", ")}.</p>
      <label class="field">Fichier des adhérents <input type="file" name="membersCsv" accept=".csv,.tsv,text/csv" required></label>
      <div id="member-import-preview" aria-live="polite"></div>`;
    const editor = openModuleDialog("Importer des adhérents", fields, async (data, form) => {
      const button = form.querySelector('button[type="submit"]');
      if (content === undefined) {
        if (data.membersCsv.size > 1024 * 1024) return invalidInput(form.elements.membersCsv, "Choisis un CSV de 1 Mo maximum.");
        const next = await readCsvFile(data.membersCsv);
        const parsed = parseMemberImport(next);
        content = next;
        const count = parsed.filter(row => row.status === "À importer").length;
        const rows = parsed.map(row => `<tr><td>${row.index}</td><td>${escapeHtml(`${row.first} ${row.last}`)}</td>
          <td>${escapeHtml(row.team || "—")}</td><td>${escapeHtml(row.status)}</td></tr>`).join("");
        form.querySelector("#member-import-preview").innerHTML =
          `<p class="meeting-meta">${count} à importer · ${parsed.length - count} ignorée(s)</p>
          <div class="import-preview">${dataTable([["Ligne"], ["Adhérent"], ["Équipe"], ["Résultat"]], rows, "Aperçu de l’import")}</div>`;
        button.textContent = count ? `Importer ${count} adhésion${count === 1 ? "" : "s"}` : "Revoir le fichier";
        return "";
      }
      const candidates = parseMemberImport(content).filter(row => row.status === "À importer");
      if (!candidates.length) {
        notify("Vérifie les lignes signalées ou choisis un autre fichier.");
        return "";
      }
      addMembers(candidates.map(({ first, last, team }) =>
        ({ id: newId(), first, last, team, paid: false, fileStatus: "À vérifier" })));
      return candidates.length === 1 ? "Une adhésion importée." : `${candidates.length} adhésions importées.`;
    }, remote ? saveBureau : notify);
    const previewButton = editor.querySelector('button[type="submit"]');
    previewButton.textContent = "Afficher l’aperçu";
    editor.elements.membersCsv.addEventListener("change", () => {
      content = undefined;
      editor.querySelector("#member-import-preview").replaceChildren();
      previewButton.textContent = "Afficher l’aperçu";
    });
  }

  const equipmentConditions = ["Bon état", "À réparer", "À remplacer"];

  function equipmentStore(create = false) {
    const period = Object.values(bureau).find(year => year.equipment);
    if (period) return period.equipment;
    const inventory = { items: [], loans: [] };
    if (create) bureau[Object.keys(bureau).sort()[0]].equipment = inventory;
    return inventory;
  }

  function equipmentToday() {
    const fields = Object.fromEntries(new Intl.DateTimeFormat("fr-FR", {
      timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts().map(part => [part.type, part.value]));
    return fields.year + "-" + fields.month + "-" + fields.day;
  }

  function remainingLoanUnits(loan) {
    return loan.quantity - loan.returns.reduce((sum, entry) => sum + entry.quantity, 0);
  }

  function equipmentStock(loans) {
    const borrowed = new Map();
    for (const loan of loans) {
      borrowed.set(loan.itemId, (borrowed.get(loan.itemId) ?? 0) + remainingLoanUnits(loan));
    }
    return borrowed;
  }

  function equipmentReturnEntries(loan) {
    return [...loan.returns].sort((a, b) => a.date.localeCompare(b.date)).map(entry =>
      `<li>${dateLabel(entry.date)} · ${entry.quantity} rendu${entry.quantity > 1 ? "s" : ""}</li>`).join("");
  }

  function equipmentPage() {
    const { items, loans } = equipmentStore();
    const borrowed = equipmentStock(loans);
    const today = equipmentToday();
    const catalog = new Map(items.map(item => [item.id, item]));
    const inventoryRows = [...items].sort((a, b) => a.name.localeCompare(b.name, "fr")).map(item => {
      const out = borrowed.get(item.id) ?? 0;
      const available = item.condition === "Bon état" && !item.archived ? item.quantity - out : 0;
      return [item.archived, `<tr>
        <td class="label-cell"><strong>${escapeHtml(item.name)}</strong>
          ${item.category ? '<span class="secondary-value">' + escapeHtml(item.category) + '</span>' : ""}
          ${item.notes ? '<span class="secondary-value inventory-note">' + escapeHtml(item.notes) + '</span>' : ""}</td>
        <td>${escapeHtml(item.location || "—")}</td>
        <td>${badge(item.condition, item.condition !== "Bon état")}</td><td>${item.quantity}</td><td>${out}</td><td>${available}</td>
        <td><div class="row-actions">${available > 0 ? action("Prêter", "equipment-loan", item.id, "primary") : ""}
          ${action("Modifier", "equipment-item", item.id)}</div></td>
      </tr>`];
    });
    const active = loans.filter(loan => remainingLoanUnits(loan) > 0)
      .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || b.date.localeCompare(a.date));
    const late = active.filter(loan => loan.due && loan.due < today).length;
    const activeRows = active.map(loan => `<tr>
      <td class="label-cell">${escapeHtml(catalog.get(loan.itemId).name)}</td>
      <td>${escapeHtml(loan.borrower)}</td><td>${dateLabel(loan.date)}</td>
      <td>${remainingLoanUnits(loan)} sur ${loan.quantity}</td>
      <td>${dateLabel(loan.due)} ${loan.due && loan.due < today ? badge("En retard", true) : ""}</td>
      <td><div class="row-actions">${action("Enregistrer un retour", "equipment-return", loan.id, "primary")}
        ${action("Gérer le prêt", "equipment-loan-edit", loan.id)}</div></td></tr>`).join("");
    const completed = loans.filter(loan => remainingLoanUnits(loan) === 0)
      .map(loan => ({ ...loan, lastReturn: loan.returns.map(entry => entry.date).sort().at(-1) }))
      .sort((a, b) => b.lastReturn.localeCompare(a.lastReturn));
    const completedRows = completed.map(loan => `<tr>
      <td class="label-cell">${escapeHtml(catalog.get(loan.itemId).name)}</td>
      <td>${escapeHtml(loan.borrower)}</td><td>${dateLabel(loan.date)}</td>
      <td>${loan.quantity}</td><td><details class="return-details"><summary>${dateLabel(loan.lastReturn)}</summary>
        <ul>${equipmentReturnEntries(loan)}</ul></details></td></tr>`).join("");
    const columns = [["Matériel"], ["Rangement"], ["État"], ["Stock"], ["Prêté"], ["Disponible"], ["Actions"]];
    const archived = inventoryRows.filter(([isArchived]) => isArchived);
    return `<div class="stack">
      <section class="panel"><header class="panel-header"><h2>Inventaire du club</h2>
        ${action("Ajouter du matériel", "equipment-item", "", "primary", "plus")}</header>
        ${dataTable(columns, inventoryRows.filter(([isArchived]) => !isArchived).map(([, row]) => row).join(""), "Inventaire du club")}
      </section>
      <section class="panel"><header class="panel-header"><h2>Prêts en cours</h2>
        ${late ? badge(late + (late === 1 ? " retour en retard" : " retours en retard"), true) : ""}</header>
        ${dataTable([["Matériel"], ["Emprunteur"], ["Prêt le"], ["À rendre"], ["Retour prévu"], ["Actions"]], activeRows, "Prêts en cours")}
      </section>
      ${completed.length ? `<details class="panel inventory-details"><summary>Prêts terminés (${completed.length})</summary>
        ${dataTable([["Matériel"], ["Emprunteur"], ["Prêt le"], ["Quantité"], ["Dernier retour"]], completedRows, "Historique des prêts")}</details>` : ""}
      ${archived.length ? `<details class="panel inventory-details"><summary>Matériel archivé (${archived.length})</summary>
        ${dataTable(columns, archived.map(([, row]) => row).join(""), "Matériel archivé")}</details>` : ""}
    </div>`;
  }

  function equipmentCountField(label, value, max = 10000) {
    return inputField(label, "quantity", value, 'type="number" min="1" max="' + max + '" step="1" inputmode="numeric" required');
  }

  function editEquipmentItem(item) {
    const fields = `${inputField("Nom du matériel", "name", item?.name, "maxlength=120 required")}
      <div class="form-row">
        ${inputField("Catégorie", "category", item?.category, "maxlength=120")}
        ${inputField("Lieu de rangement", "location", item?.location, "maxlength=120")}</div>
      <div class="form-row">${equipmentCountField("Quantité totale", item?.quantity ?? 1)}
        ${selectField("État", "condition", optionList(equipmentConditions, item?.condition ?? "Bon état"))}</div>
      <label class="field">Notes<textarea name="notes" maxlength="600">${escapeHtml(item?.notes ?? "")}</textarea></label>
      ${item ? selectField("Inventaire", "archiveStatus", optionList(["En service", "Archivé"], item.archived ? "Archivé" : "En service")) : ""}`;
    openModuleDialog(item ? "Modifier le matériel" : "Ajouter du matériel", fields, (data, form) => {
      const inventory = equipmentStore(true);
      const quantity = Number(data.quantity);
      const archived = data.archiveStatus === "Archivé";
      const borrowed = equipmentStock(inventory.loans).get(item?.id) ?? 0;
      if (quantity < borrowed) {
        invalidInput(form.elements.quantity, "La quantité totale doit couvrir les " + borrowed + " unités prêtées.");
        return;
      }
      if (archived && borrowed > 0) {
        invalidInput(form.elements.archiveStatus, "Enregistre les retours avant d’archiver la fiche.");
        return;
      }
      saveItem(inventory.items, { id: item?.id ?? newId(), name: data.name.trim(), category: data.category.trim(),
        location: data.location.trim(), quantity, condition: data.condition, notes: data.notes.trim(), archived });
      return "Fiche matériel enregistrée.";
    });
  }

  function lendEquipment(item) {
    const inventory = equipmentStore();
    const available = item.quantity - (equipmentStock(inventory.loans).get(item.id) ?? 0);
    if (item.archived || item.condition !== "Bon état" || available < 1) return;
    const today = equipmentToday();
    const fields = `<p>${escapeHtml(item.name)}</p>
      <label class="field">Équipe ou emprunteur
        <input name="borrower" list="equipment-teams" maxlength="120" required>
        <datalist id="equipment-teams">${teams.map(team => option(team, team, "")).join("")}</datalist></label>
      ${equipmentCountField("Quantité à prêter sur " + available + " disponible" + (available > 1 ? "s" : ""), 1, available)}
      <div class="form-row">
        ${inputField("Date du prêt", "date", today, 'type="date" max="' + today + '" required')}
        ${inputField("Retour prévu", "due", "", 'type="date" max="9999-12-31"')}</div>`;
    const editor = openModuleDialog("Enregistrer un prêt", fields, (data, form) => {
      if (data.due && data.due < data.date) {
        invalidInput(form.elements.due, "Le retour prévu doit dater du prêt ou d’un jour ultérieur.");
        return;
      }
      inventory.loans.push({ id: newId(), itemId: item.id, borrower: data.borrower.trim(),
        quantity: Number(data.quantity), date: data.date, due: data.due, returns: [] });
      return "Prêt enregistré.";
    });
    editor.elements.date.addEventListener("input", () => editor.elements.due.setCustomValidity(""));
  }

  function returnEquipment(loan) {
    const item = equipmentStore().items.find(item => item.id === loan.itemId);
    const remaining = remainingLoanUnits(loan);
    if (remaining < 1) return;
    const today = equipmentToday();
    const fields = `<p>${escapeHtml(item.name)} · ${escapeHtml(loan.borrower)}</p>
      ${equipmentCountField("Quantité rendue sur " + remaining + " à rendre", remaining, remaining)}
      ${inputField("Date du retour", "date", today, 'type="date" min="' + loan.date + '" max="' + today + '" required')}`;
    openModuleDialog("Enregistrer un retour", fields, data => {
      loan.returns.push({ quantity: Number(data.quantity), date: data.date });

  function editEquipmentLoan(loan) {
    const entries = equipmentReturnEntries(loan);
    const fields = `${inputField("Retour prévu", "due", loan.due,
        'type="date" min="' + loan.date + '" max="9999-12-31"')}

        '<button type="button" class="button outline" data-cancel-loan>Annuler le prêt</button>'}`;

      loan.due = data.due;
      return "Échéance du prêt mise à jour.";
    });
    editor.querySelector("[data-cancel-loan]")?.addEventListener("click", () => {
      if (!window.confirm("Annuler ce prêt et remettre les unités en stock ?")) return;

      moduleDialog.close();

  const partnerStatuses = ["Prospect", "Actif", "Terminé"];

  function renewalUrgency(partner, today = todayIso()) {
    if (partner.status !== "Actif" || !partner.renewalDate) return "";
    const date = Date.parse(partner.renewalDate + "T00:00:00Z");
    const start = Date.parse(today + "T00:00:00Z");
    const days = (date - start) / 86400000;
    if (days < 0) return "Renouvellement en retard";
    if (days <= 30) return "Renouvellement sous 30 jours";
    return "";
  }

  function partnersFromPreviousSeason() {
    const key = partner => normalize(partner.name.trim()).replace(/\s+/g, " ");
    const existing = new Set((clubYear().partners ?? []).map(key));
    return (bureau[priorSeason()]?.partners ?? []).filter(partner => !existing.has(key(partner)));
  }

  function partnersPage() {
    const year = clubYear();
    const today = todayIso();
    const partners = [...(year.partners ?? [])].sort((a, b) =>
      Number(Boolean(renewalUrgency(b, today))) - Number(Boolean(renewalUrgency(a, today))) ||
      (a.renewalDate || "9999").localeCompare(b.renewalDate || "9999") || a.name.localeCompare(b.name, "fr"));
    const byPartner = new Map(partners.map(partner => [partner.id, []]));
    for (const entry of year.partnerCommitments ?? []) byPartner.get(entry.partnerId)?.push(entry);
    const renewals = partners.filter(partner => renewalUrgency(partner, today)).length;
    const pending = (year.partnerCommitments ?? []).filter(item => !item.done).length;
    const summary = `${renewals} renouvellement${renewals > 1 ? "s" : ""} à traiter · ${pending} engagement${pending > 1 ? "s" : ""} à réaliser`;
    const cards = partners.map(partner => {
      const urgency = renewalUrgency(partner, today);
      const contact = [partner.contact, partner.email, partner.phone].filter(Boolean).join(" · ");
      const commitments = byPartner.get(partner.id).sort((a, b) => Number(a.done) - Number(b.done) ||
        (a.due || "9999").localeCompare(b.due || "9999"));
      const rows = commitments.map(item => {
        const status = item.done ? "Réalisé" : item.due && item.due < today ? "En retard" : "À faire";
        return `<tr><td class="label-cell">${escapeHtml(item.title)}</td><td>${dateLabel(item.due)}</td>
          <td>${badge(status, !item.done)}</td><td>${item.receipt ? action("Télécharger la photo", "partner-photo", item.id) : "—"}</td>
          <td>${action("Modifier", "partner-commitment", partner.id + ":" + item.id)}</td></tr>`;
      }).join("");
      return `<section class="panel">
        <header class="panel-header"><div class="partner-details">
          <h2>${escapeHtml(partner.name)}</h2>
          ${contact ? '<p class="secondary-value">' + escapeHtml(contact) + '</p>' : ""}
          ${partner.renewalDate ? '<p class="secondary-value">Renouvellement le ' + dateLabel(partner.renewalDate) + '</p>' : ""}
          ${partner.notes ? '<p class="secondary-value">' + escapeHtml(partner.notes) + '</p>' : ""}
        </div><div class="actions">${badge(partner.status, partner.status === "Prospect")}${urgency ? badge(urgency, true) : ""}</div></header>
        ${commitments.length ? dataTable([["Engagement"], ["Échéance"], ["État"], ["Photo"], ["Actions"]], rows, "Engagements du club") :
          '<p class="panel-note">Aucun engagement renseigné.</p>'}
        <div class="actions partner-controls">
          ${action("Ajouter un engagement", "partner-commitment", partner.id, "primary", "plus")}
          ${action("Modifier la fiche", "partner", partner.id)}
        </div>
      </section>`;
    }).join("");
    return `<div class="stack">
      <section class="panel"><header class="panel-header"><h2>Partenaires de la saison</h2>
        <div class="actions">${action("Nouveau partenaire", "partner", "", "primary", "plus")}
          ${partnersFromPreviousSeason().length ? action("Reprendre des partenaires", "partner-carry") : ""}</div></header>
        <p class="panel-note">${partners.length ? summary : "Aucun partenaire pour cette saison."}</p>
      </section>${cards}</div>`;

  function reviewRegistration(item) {
    const files = item.files.map(file =>
      `<li><a href="api.php?role=secretary&amp;attachment=${encodeURIComponent(file.id)}">${escapeHtml(file.name)}</a></li>`).join("");
    const closed = ["Validé", "Refusé"].includes(item.status);
    const identity = `<div><strong>${escapeHtml(item.first + " " + item.last)}</strong><br>${escapeHtml(item.email)}</div>
      <div><strong>Pièces reçues</strong>${files ? "<ul>" + files + "</ul>" : "<p>Aucune pièce jointe.</p>"}</div>
      ${remote ? '<div>' + action("Retrouver le lien privé", "registration-tracking", item.id) + '</div>' : ""}`;
    if (closed) {
      moduleDialog.innerHTML = `<header><h2 id="module-dialog-title">Dossier · ${item.status}</h2>
        <button type="button" class="row-action" data-module-action="close" aria-label="Fermer">${icon("close")}</button></header>
        ${identity}${item.note ? "<p>" + escapeHtml(item.note) + "</p>" : ""}`;
      moduleDialog.showModal();
      return;
    }
    const matching = getMembers().filter(member =>
      member.first.toLocaleLowerCase("fr") === item.first.toLocaleLowerCase("fr") &&
      member.last.toLocaleLowerCase("fr") === item.last.toLocaleLowerCase("fr"));
    const memberOptions = option("", matching.length ? "Choisir une adhésion" : "Créer une adhésion", "") +
      matching.map(member => option(member.id, member.first + " " + member.last + " · " + member.team, "")).join("") +
      (matching.length ? option("__new__", "Créer une adhésion pour un homonyme", "") : "");
    const fields = identity +
      selectField("Décision", "status", option("", "Choisir", "") + optionList(["Incomplet", "Validé", "Refusé"], "")) +
      `<div class="form-row" data-registration-approval hidden>
        ${selectField("Équipe", "team", optionList([...new Set([...teams, ...matching.map(member => member.team)])], matching.length === 1 ? matching[0].team : teams[0]))}
        ${selectField("Adhésion", "memberId", memberOptions)}</div>
        <label class="field">Message visible par la famille
          <textarea name="note" maxlength="600">${escapeHtml(item.note || "")}</textarea></label>`;
    const year = Number(season.value);
    let command;
    let message;
    const editor = openModuleDialog("Vérifier le dossier", fields, (data, form) => {
      if (!data.status) {
        form.elements.status.setCustomValidity("Choisis une décision.");
        form.elements.status.reportValidity();
        return;
      }
      if (data.status === "Incomplet" && !data.note.trim()) {
        form.elements.note.setCustomValidity("Indique les pièces manquantes.");
        form.elements.note.reportValidity();
        return;
      }
      if (data.status === "Validé" && matching.length && !data.memberId) {
        form.elements.memberId.setCustomValidity("Choisis une adhésion ou indique qu’il s’agit d’un homonyme.");
        form.elements.memberId.reportValidity();
        return;
      }
      command = { action: "review", year, id: item.id, ...data, note: data.note.trim() };
      if (!remote) {
        if (data.status === "Validé") {
          const member = data.memberId === "__new__" ? null : getMembers().find(member => member.id === data.memberId);
          const fields = { team: data.team, fileStatus: "Complet", fileNote: "" };
          if (member) {
            const updated = getMembers().map(entry => entry.id === member.id ? { ...entry, ...fields } : entry);
            localStorage.setItem(storageKey, JSON.stringify({ ...records, [year]: updated }));
            records[year] = updated;
          } else {
            addMembers([{ ...fields, id: newId(), first: item.first, last: item.last, paid: false }]);
          }
        }
        item.status = data.status;
        item.note = command.note;
      }
      message = data.status === "Validé" ? "Dossier validé. Adhésion enregistrée." : "Dossier mis à jour.";
      return message;
    }, () => remote ? syncRemote(message, true, command) : saveBureau(message));
    editor.elements.status.addEventListener("change", () => {
      editor.elements.note.setCustomValidity("");
      editor.elements.memberId.setCustomValidity("");
      editor.querySelector("[data-registration-approval]").hidden = editor.elements.status.value !== "Validé";
    });
  }

      ${action("Choisir les adhérents", "assembly-list", "", "primary")}${action("Exporter la liste", "assembly-export", "", "outline", "download")}</div></header>
      ${dataTable([["Adhérent"], ["Équipe"], ["Présence"], ["Représenté par"], ["Actions"]], attendees, "Participants à l’assemblée")}</section>
      <section class="panel"><header class="panel-header"><h2>Votes</h2>
      ${action("Ajouter un vote", "assembly-vote", "", "primary")}</header>
      ${dataTable([["Résolution"], ["Pour"], ["Contre"], ["Abstentions"], ["Résultat"], ["Actions"]], votes, "Votes de l’assemblée")}</section>
      <section class="panel"><header class="panel-header"><h2>Rapport financier joint au PV</h2>
      ${action(report ? "Actualiser le rapport joint" : "Joindre le rapport de la saison", "assembly-report")}</header>
      <p class="panel-note">${report ? `${report.closed ? "Rapport de saison clôturée" : "Rapport provisoire"} · Copie du ${dateLabel(report.savedAt)}` :
        "Une copie du rapport financier de la saison peut être intégrée au PV téléchargé."}</p></section>
      </div>`;
  }

  function editAssemblyList() {
    const meeting = activeAssembly();
    if (!meeting) return;
    const previous = new Map(assemblyParticipants(meeting).map(item => [item.id, item]));
    const current = new Map(getMembers().map(item => [item.id, { id: item.id, name: `${item.first} ${item.last}`, team: item.team }]));
    const candidates = new Map([...previous, ...current]);
    const options = [...candidates.values()].sort((a, b) => a.name.localeCompare(b.name, "fr")).map(item =>
      `<label><input type="checkbox" name="participant" value="${escapeHtml(item.id)}"${previous.has(item.id) ? " checked" : ""}>
      ${escapeHtml(`${item.name} · ${item.team}`)}</label>`).join("");
    const fields = selectionFields("Adhérents à convoquer", options);
    const editor = openModuleDialog("Choisir les adhérents à convoquer", fields, (_data, form) => {
      const ids = new Set(new FormData(form).getAll("participant"));
      if ([...ids].some(id => previous.get(id)?.proxyId && !ids.has(previous.get(id).proxyId))) {
        notify("Retire la procuration avant de retirer la personne qui la détient.");
        return "";
      }
      meeting.participants = [...ids].filter(id => candidates.has(id)).map(id =>
        previous.get(id) || { ...candidates.get(id), status: "À confirmer", proxyId: "" });
      return "Liste de convocation mise à jour.";
    });
    bindSelectAll(editor);
  }

  function selectionFields(title, items) {
    return `<fieldset class="field"><legend>${title}</legend>
      <label class="selection-list-control"><input type="checkbox" data-select-all> Tout sélectionner</label>
      <div class="selection-list">${items}</div></fieldset>`;
  }

  function bindSelectAll(editor) {
    const control = editor.querySelector("[data-select-all]");
    const items = [...editor.querySelectorAll(".selection-list input")];
    const sync = () => {
      const checked = items.filter(item => item.checked).length;
      control.disabled = !items.length;
      control.checked = checked > 0 && checked === items.length;
      control.indeterminate = checked > 0 && checked < items.length;
    };
    control.addEventListener("change", () => {
      for (const item of items) item.checked = control.checked;
    });
    for (const item of items) item.addEventListener("change", sync);
    sync();
  }

  function editAssemblyAttendee(id) {
    const meeting = activeAssembly();
    const participants = meeting ? assemblyParticipants(meeting) : [];
    const person = participants.find(item => item.id === id);
    if (!person) return;
    const proxies = participants.filter(item => item.id !== id && item.status === "Présent");
    const options = option("", "Choisir une personne présente", person.proxyId) +
      proxies.map(item => option(item.id, item.name, person.proxyId)).join("");
    const fields = `<p class="meeting-meta">${escapeHtml(person.name)}</p>
      ${selectField("Présence", "status", optionList(attendanceStates, person.status))}
      ${selectField("Représenté par", "proxyId", options)}`;
    const editor = openModuleDialog("Enregistrer la présence", fields, (data, form) => {
      if (data.status === "Représenté" && !proxies.some(item => item.id === data.proxyId)) {
        return invalidInput(form.elements.proxyId, "Choisis une personne présente pour la procuration.");
      }
      if (data.status !== "Présent" && participants.some(item => item.proxyId === id)) {
        return invalidInput(form.elements.status, "Réattribue les procurations confiées à cette personne avant de changer sa présence.");
      }
      person.status = data.status;
      person.proxyId = data.status === "Représenté" ? data.proxyId : "";
      return "Présence enregistrée.";
    });
    const updateProxy = () => {
      editor.elements.proxyId.closest("label").hidden = editor.elements.status.value !== "Représenté";
      editor.elements.proxyId.setCustomValidity("");
    };
    editor.elements.status.addEventListener("change", updateProxy);
    updateProxy();
  }

  function editAssemblyVote(id) {
    const meeting = activeAssembly();
    if (!meeting) return;
    const vote = meeting.votes?.find(item => item.id === id);
    const voteCount = (label, name) => inputField(label, name, vote?.[name] ?? 0, 'type="number" min="0" max="10000" step="1" required');
    const fields = `${inputField("Résolution", "title", vote?.title, "maxlength=220 required")}
      <div class="form-row">${voteCount("Pour", "forVotes")}${voteCount("Contre", "against")}</div>
      ${voteCount("Abstentions", "abstain")}${selectField("Résultat constaté", "outcome", optionList(voteOutcomes, vote?.outcome))}`;
    openModuleDialog(vote ? "Modifier le vote" : "Consigner un vote", fields, data => {
      meeting.votes ??= [];
      saveItem(meeting.votes, { id: vote?.id ?? newId(), title: data.title.trim(),
        forVotes: Number(data.forVotes), against: Number(data.against), abstain: Number(data.abstain), outcome: data.outcome });
      return "Vote enregistré.";
    });
  }

  function recordVoteDecision(id) {
    const meeting = activeAssembly();
    const vote = meeting?.votes?.find(item => item.id === id);
    if (vote?.outcome !== "Adoptée") return;
    const year = clubYear();
    year.decisions ??= [];
    if (year.decisions.some(item => item.voteId === id && item.meetingId === meeting.id)) return;
    year.decisions.push({ id: newId(), voteId: id, meetingId: meeting.id, title: vote.title, status: "Adoptée", date: meeting.date });
    saveBureau("Décision ajoutée au registre du dirigeant.");
    render();
  }

  function attachAssemblyReport() {
    const meeting = activeAssembly();
    if (!meeting) return;
    meeting.financialReport = { ...financialReportData(), closed: Boolean(clubYear().closedAt), savedAt: todayIso() };
    saveBureau("Copie du rapport financier jointe au PV.");
    render();
  }

  function exportAssemblyList() {
    const meeting = activeAssembly();
    if (!meeting) return;
    const participants = assemblyParticipants(meeting);
    const names = new Map(participants.map(item => [item.id, item.name]));
    downloadCsv(`convocations-${meeting.date}`, [["Adhérent", "Équipe", "Présence", "Représenté par"],
      ...participants.map(item => [item.name, item.team, item.status, names.get(item.proxyId) || ""])]);
  }

  function assemblyExportLines(meeting, minutes) {
    if (!isAssembly(meeting)) return [];
    const participants = assemblyParticipants(meeting);
    const names = new Map(participants.map(item => [item.id, item.name]));
    const lines = ["", minutes ? "Feuille de présence" : "Liste des adhérents à convoquer"];
    if (minutes) lines.push(participantSummary(participants).map(([state, count]) => `${state} ${count}`).join(" · "));
    for (const item of participants) {
      const proxy = names.get(item.proxyId);
      const attendance = minutes ? ` · ${item.status}${proxy ? ` par ${proxy}` : ""}` : "";
      lines.push(`${item.name} · ${item.team}${attendance}`);
    }
    if (minutes && meeting.votes?.length) {
      lines.push("", "Votes");
      for (const vote of meeting.votes) lines.push(`${vote.title} — Pour ${vote.forVotes}, contre ${vote.against}, abstentions ${vote.abstain} — ${vote.outcome}`);
    }
    if (minutes && meeting.financialReport) {
      const report = meeting.financialReport;
      lines.push("", `Rapport financier joint · ${report.closed ? "Saison clôturée" : "Provisoire"}`,
        `Du ${dateLabel(report.start)} au ${dateLabel(report.end)} · copie du ${dateLabel(report.savedAt)}`);
      for (const [label, amount] of report.lines) lines.push(`${label} — ${money(amount)}`);
      lines.push("", "Budget de trésorerie");
      for (const [label, planned, realized] of report.budget) {
        lines.push(`${label} — Prévu ${money(planned)}, réalisé ${money(realized)}, écart ${money(realized - planned)}`);
      }
    }
    return lines;
  }


  const spaceLinks = spaceCards.map(([key, , title]) => [key, title]);
  spacesBar.innerHTML = spaceLinks.filter(([key]) => canOpenSpace(key)).map(([key, title]) =>
    `<button type="button" class="space-pill" data-space="${key}">${title}</button>`).join("");
  nav.innerHTML = bureauNavigation();
  nav.dataset.workspace = !remote || officeRoles.length === 1 ? bureauRole : "combined";
  elements["close-dialog"].innerHTML = icon("close");
  elements["member-team"].innerHTML = teams.map(team => option(team, team, "")).join("");
  document.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;
    if (remoteBusy) {
      event.preventDefault();
      return;
    }
    if (button.dataset.space) {
      openSpace(button.dataset.space);
    } else if (button.dataset.moduleAction) {
      handleModuleAction(button);
    } else if (button.dataset.nav) {
      const nextRole = button.dataset.role || activeRole;
      if (remote && !remote.roles.includes(nextRole)) return;
      const nested = !nav.contains(button);
      activeRole = nextRole;
      page = button.dataset.nav;
      filters = { search: "", team: button.dataset.team || "", payment: button.dataset.payment || "",
        fileStatus: button.dataset.fileStatus || "" };
      if (page === "invoices") {
        invoiceFilters.kind = "";
        invoiceFilters.status = button.dataset.invoiceStatus || "";
      }
      const focusHeading = () => elements["page-title"].focus();
      if (remote && nextRole !== remote.role) {
        syncRemote("", false).then(focusHeading);
      } else {
        render();
        if (nested) focusHeading();
      }
    } else if (button.hasAttribute("data-payment-filter")) {
      filters.payment = button.dataset.paymentFilter;
      updateMemberList();
    } else if (button.hasAttribute("data-clear-filters")) {
      filters = { search: "", team: "", payment: "", fileStatus: "" };
      for (const control of main.querySelectorAll("[data-filter]")) control.value = "";
      updateMemberList();
      main.querySelector('[data-filter="search"]').focus();
    } else if (button.hasAttribute("data-add")) {
      openMember();
    } else if (button.hasAttribute("data-edit")) {
      const member = getMembers().find(item => item.id === button.dataset.edit);
      if (member) openMember(member);
    } else if (button.hasAttribute("data-export")) {
      exportCsv();
    } else if (button.hasAttribute("data-close")) {
      dialog.close();
    }
  });

  function openSpace(key) {
    if (remoteBusy || !canOpenSpace(key)) return;
    if (key === "bureau") {
      activeRole = remote ? bureauRole : demoRole;
      page = "dashboard";
    } else {
      if (spaceRoles[key]) activeRole = spaceRoles[key];
      page = key;
    }
    const ready = remote && activeRole !== remote.role ? syncRemote("", false) : Promise.resolve(render());
    return ready.then(() => {
      window.scrollTo(0, 0);
      elements["page-title"].focus({ preventScroll: true });
    });
  }

  season.addEventListener("change", () => {
    ledgerFilters.kind = "";
    ledgerFilters.account = "";
    invoiceFilters.kind = "";
    invoiceFilters.status = "";
    accountingAccount = "";
    if (page === "assembly") page = "meetings";
    render();
  });
  main.addEventListener("input", event => {
    const key = event.target.dataset.filter;
    if (!key) return;
    filters[key] = event.target.value;
    updateMemberList();
  });

  for (const input of [form.elements.first, form.elements.last]) {
    input.addEventListener("input", () => input.setCustomValidity(""));
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    if (remoteBusy) return;
    const members = getMembers();
    const first = form.elements.first.value.trim();
    const last = form.elements.last.value.trim();
    if (!first || !last) {
      const input = first ? form.elements.last : form.elements.first;
      input.setCustomValidity("Renseignez ce champ.");
      input.reportValidity();
      return;
    }
    const existing = members.find(item => item.id === editingId);
    const member = {
      ...existing,
      id: editingId ?? (globalThis.crypto?.randomUUID?.() || String(Date.now())),
      first, last,
      team: form.elements.team.value,
      fileStatus: form.elements.fileStatus.value,
      fileNote: form.elements.fileNote.value.trim(),
      paid: form.elements.paid.disabled ? Boolean(existing?.paid) : form.elements.paid.value === "true"
    };
    const index = members.findIndex(item => item.id === editingId);
    if (index < 0) members.unshift(member);
    else members[index] = member;

    let saved = true;
    try {
      if (!remote) localStorage.setItem(storageKey, JSON.stringify(records));
    } catch {
      saved = false;
    }
    dialog.close();
    render();
    const focusTarget = Array.from(main.querySelectorAll("[data-edit]")).find(button => button.dataset.edit === member.id)
      || main.querySelector("[data-add], [data-filter]");
    focusTarget?.focus();
    const message = index < 0 ? "Adhérent ajouté." : "Modifications enregistrées.";
    if (remote) saveBureau(message);
    else notify(saved ? message : "Modifications disponibles jusqu’à la fermeture de cette page.");
  });

  function applyRemoteState(state, loadedRole) {
    remote.state = state;
    remote.role = loadedRole;
    activeRole = loadedRole;
    const selected = season.value;
    season.replaceChildren(...Object.keys(state.records).sort().reverse()
      .map(year => new Option(`${year}–${Number(year) + 1}`, year)));
    if (state.records[selected]) season.value = selected;
    for (const [local, updated] of [[records, state.records], [bureau, state.bureau]]) {
      for (const year of Object.keys(local)) delete local[year];
      Object.assign(local, structuredClone(updated));
    }
  }

  async function syncRemote(message, write = true, registrationCommand) {
    if (remoteBusy) return;
    remoteBusy = true;
    main.setAttribute("aria-busy", "true");
    for (const button of spacesBar.querySelectorAll("button")) button.disabled = true;
    season.disabled = true;
    document.getElementById("storage-mode").textContent = "Synchronisation…";
    const requestRole = activeRole;
    const endpoint = `api.php?role=${encodeURIComponent(requestRole)}`;
    try {
      const options = { cache: "no-store" };
      if (write) {
        options.method = "POST";
        options.headers = { "Content-Type": "application/json", "X-CSRF-Token": remote.csrf };
        options.body = JSON.stringify({ revision: remote.state.revision, records, bureau, registrationCommand });
      }
      const response = await fetch(endpoint, options);
      if (response.status === 401) {
        window.location.reload();
        return;
      }
      const data = await response.json();
      if (data.state) applyRemoteState(data.state, requestRole);
      if (!response.ok) throw new Error(data.error);
      applyRemoteState(data, requestRole);
      if (message) notify(message);
    } catch (error) {
      applyRemoteState(remote.state, remote.role);
      const available = page === "home" || workspaces[activeRole].includes(page) ||
        spaceRoles[page] === activeRole || page === "assembly";
      if (!available) page = "home";
      notify(error.message || "Synchronisation interrompue. Actualise le tableau de bord avant de réessayer.");
    } finally {
      remoteBusy = false;
      for (const button of spacesBar.querySelectorAll("button")) button.disabled = false;
      season.disabled = false;
      main.removeAttribute("aria-busy");
      document.getElementById("storage-mode").textContent = "Données partagées";
      render();
    }
  }

  if (remote) {
    document.getElementById("online-refresh").addEventListener("click", () => syncRemote("Données actualisées.", false));
  } else {
    demoRoleSelect.addEventListener("change", () => {
      demoRole = demoRoleSelect.value;
      if (page !== "home") openSpace("bureau");
    });
    document.getElementById("local-export").addEventListener("click", () =>
      downloadFile("sauvegarde-locale.json",
        [JSON.stringify({ format: "gestclub-state-v1", records, bureau }, null, 2)], "application/json"));
  }
  render();
})();
  </script>
</body>
